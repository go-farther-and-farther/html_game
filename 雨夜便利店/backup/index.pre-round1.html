'use strict';
/* =====================================================================
 * 雨夜便利店街角 —— 三渲二（Toon）微缩场景
 * 单文件 / 本地 three.js r147 / 程序化纹理 / 无 UI / 无外部资源
 * ===================================================================== */

/* ---------------- 0. 常量与小工具 ---------------- */
const AUTO_ROTATE = true;                       // 空闲 2.5s 后缓慢自转（代码开关，无 UI）
const rand   = (a=1,b) => b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const pick   = arr => arr[(Math.random()*arr.length)|0];
const clamp  = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1-t, 3);
const damp   = (cur, tgt, k, dt) => cur + (tgt-cur) * Math.min(1, k*dt);

/* ---------------- 1. 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 120);
const world  = new THREE.Group();
scene.add(world);

/* ---------------- 2. 三渲二材质工厂 ---------------- */
const TOON_VERT = `
varying vec3 vN; varying vec3 vP; varying vec2 vUv;
void main(){
  vUv = uv;
  vN = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
  vP = (modelMatrix * vec4(position, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const TOON_FRAG = `
uniform vec3 uColor; uniform vec3 uAmb; uniform vec3 uKey; uniform vec3 uDir;
uniform vec3 uRim; uniform vec3 uEmissive;
uniform float uT1; uniform float uT2; uniform float uMid; uniform float uDark;
uniform float uRimPow; uniform float uRimI; uniform float uEmiI; uniform float uAlpha;
uniform sampler2D uMap; uniform float uHasMap;
varying vec3 vN; varying vec3 vP; varying vec2 vUv;
void main(){
  vec3 n = normalize(vN);
  vec3 alb = uColor;
  if (uHasMap > 0.5) alb *= texture2D(uMap, vUv).rgb;
  float ndl = dot(n, normalize(uDir));
  float s = uDark;
  s = mix(s, uMid, smoothstep(uT2 - 0.06, uT2 + 0.06, ndl));
  s = mix(s, 1.0,  smoothstep(uT1 - 0.07, uT1 + 0.07, ndl));
  vec3 col = alb * (uAmb + uKey * s);
  vec3 V = normalize(cameraPosition - vP);
  float fr = pow(1.0 - max(dot(n, V), 0.0), uRimPow);
  col += uRim * fr * uRimI;
  col += uEmissive * uEmiI;
  gl_FragColor = vec4(col, uAlpha);
}`;

// 环境基调：室外冷蓝雨夜 / 室内暖光
const AMB_OUT = new THREE.Color(0.30, 0.36, 0.55);
const KEY_OUT = new THREE.Color(0.42, 0.50, 0.72);
const DIR_OUT = new THREE.Vector3(0.45, 1.0, 0.35).normalize();
const AMB_IN  = new THREE.Color(1.05, 0.90, 0.68);
const KEY_IN  = new THREE.Color(1.00, 0.93, 0.80);
const DIR_IN  = new THREE.Vector3(-0.12, 1.0, -0.06).normalize();

function autoOutline(hex){
  return new THREE.Color(hex).multiplyScalar(0.34).lerp(new THREE.Color(0x101830), 0.45);
}
function toonMat(hex, o = {}) {
  const u = {
    uColor:   { value: new THREE.Color(hex) },
    uAmb:     { value: (o.ambient || AMB_OUT).clone() },
    uKey:     { value: (o.key || KEY_OUT).clone() },
    uDir:     { value: (o.dir || DIR_OUT).clone().normalize() },
    uRim:     { value: new THREE.Color(o.rim !== undefined ? o.rim : 0x9fc0ff) },
    uEmissive:{ value: new THREE.Color(o.emissive !== undefined ? o.emissive : 0x000000) },
    uT1:{value:o.t1!==undefined?o.t1:0.55}, uT2:{value:o.t2!==undefined?o.t2:0.16},
    uMid:{value:o.mid!==undefined?o.mid:0.78}, uDark:{value:o.dark!==undefined?o.dark:0.55},
    uRimPow:{value:o.rimPow!==undefined?o.rimPow:2.6}, uRimI:{value:o.rimI!==undefined?o.rimI:0.20},
    uEmiI:{value:o.emiI||0}, uAlpha:{value:o.alpha!==undefined?o.alpha:1},
    uMap:{value:o.map||null}, uHasMap:{value:o.map?1:0},
  };
  if (u.uMap.value) { u.uMap.value.wrapS = u.uMap.value.wrapT = THREE.RepeatWrapping; }
  const m = new THREE.ShaderMaterial({ uniforms:u, vertexShader:TOON_VERT, fragmentShader:TOON_FRAG,
    transparent:!!o.transparent, side:o.side||THREE.FrontSide });
  if (o.outline !== false && o.outline !== null) {
    m.userData.outline = new THREE.Color(o.outline !== undefined ? o.outline : autoOutline(hex));
    m.userData.ow = o.ow;   // 绝对描边厚度（可选）
  }
  return m;
}

/* 反壳轮廓线 */
const outlineCache = new Map();
function outlineMat(color){
  const key = color.getHexString();
  if (!outlineCache.has(key)) outlineCache.set(key, new THREE.MeshBasicMaterial({ color:color.clone(), side:THREE.BackSide }));
  return outlineCache.get(key);
}
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 20);
const unitPlane = new THREE.PlaneGeometry(1, 1);

function hullFor(mesh, dims, ows){
  const om = new THREE.Mesh(mesh.geometry, outlineMat(mesh.material.userData.outline));
  om.scale.set((dims[0]+2*ows[0])/dims[0], (dims[1]+2*ows[1])/dims[1], (dims[2]+2*ows[2])/dims[2]);
  mesh.add(om);
}
function addBox(parent, w, h, d, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(unitBox, mat);
  m.scale.set(w, h, d); m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (mat.userData && mat.userData.outline) {
    const ow = o.ow !== undefined ? o.ow : (mat.userData.ow !== undefined ? mat.userData.ow : 0.045);
    hullFor(m, [w, h, d], [ow, ow, ow]);
  }
  parent.add(m);
  return m;
}
function addCyl(parent, r, h, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(unitCyl, mat);
  m.scale.set(r, h, r); m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (mat.userData && mat.userData.outline) {
    const ow = o.ow !== undefined ? o.ow : (mat.userData.ow !== undefined ? mat.userData.ow : 0.03);
    hullFor(m, [r, h, r], [ow, ow, ow]);
  }
  parent.add(m);
  return m;
}
function addPlane(parent, w, h, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(unitPlane, mat);
  m.scale.set(w, h, 1); m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (o.renderOrder) m.renderOrder = o.renderOrder;
  parent.add(m);
  return m;
}
// 水平贴地平面（可绕 y 轴转 angle）
function flatPlane(parent, w, h, mat, x, y, z, angle = 0) {
  const m = new THREE.Mesh(unitPlane, mat);
  m.scale.set(w, h, 1);
  m.rotation.set(-Math.PI/2, 0, angle);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

/* 自发光（Basic）材质 */
function glowMat(hex, o = {}) {
  const m = new THREE.MeshBasicMaterial({ color:hex,
    transparent:!!o.transparent, opacity:o.opacity!==undefined?o.opacity:1,
    side:o.side||THREE.FrontSide, depthWrite:o.depthWrite!==undefined?o.depthWrite:true });
  if (o.map) m.map = o.map;
  return m;
}

/* ---------------- 3. 程序化 Canvas 纹理工厂 ---------------- */
function makeTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

    g.fillRect(rand(w), rand(h), rand(1,3), rand(1,3)); }
  for (let i=0;i<14;i++){ g.fillStyle = 'rgba(12,16,26,0.20)';

  for (let i=0;i<7;i++){ g.strokeStyle = 'rgba(150,170,210,0.05)'; g.lineWidth = rand(2,7);
    const y = rand(h); g.beginPath(); g.moveTo(0,y); g.lineTo(w, y+rand(-24,24)); g.stroke(); }
});

// 招牌（正面横招）
const signTex = makeTex(1024, 128, (g,w,h)=>{

  g.fillStyle = '#e84a3f'; roundRect(g, 700, 20, 290, 88, 18); g.fill();
  g.fillStyle = '#ffffff'; g.font = 'bold 46px ' + JP_FONT;
  g.fillText('24時間営業', 718, 66);
});
function roundRect(g, x, y, w, h, r){
  g.beginPath(); g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
}
// 突出看板（竖招）

  g.fillStyle = '#ffd23e'; g.beginPath(); g.arc(64, 62, 34, 0, 7); g.fill();

// 货架商品条
function productTex(kind){
  return makeTex(256, 64, (g,w,h)=>{
    g.fillStyle = '#181d2b'; g.fillRect(0,0,w,h);
    const palettes = {
      drink:  ['#e84a3f','#ff9c3a','#3fbf6f','#3f8fe8','#8a5a3a','#f2ede0','#e85a9c','#57c8d8'],
      snack:  ['#ffd23e','#ff8c42','#a06fd8','#4fc3f7','#f2f2f2','#ff5a7a','#7ac74f','#f0a30a'],
      bento:  ['#8a4a32','#c96f3f','#2a2d38','#b03a3a','#d8cfc0','#5a7a9c'],
      misc:   ['#d8d8d8','#f2b53f','#7a8a9c','#e8e2d0','#4a7a5c','#c9c9c9']
    };
    const pal = palettes[kind] || palettes.misc;
    const n = 8, cw = w/n;
    for (let i=0;i<n;i++){
      const c = pal[i % pal.length];
      const bh = kind==='drink' ? rand(34,46) : rand(26,42);
      const x = i*cw + cw*0.16, y = h - 6 - bh;
      g.fillStyle = c;
      roundRect(g, x, y, cw*0.62, bh, 4); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x+2, y+2, cw*0.16, bh-4);
      g.fillStyle = 'rgba(20,20,30,0.85)'; g.fillRect(x + cw*0.18, y + bh*0.45, cw*0.3, 3);
    }
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(0, h-5, w, 2);
  });
}
const prodDrinkTex = [productTex('drink'), productTex('drink'), productTex('drink')];
const prodSnackTex = [productTex('snack'), productTex('snack')];
const prodBentoTex = [productTex('bento')];
const prodMiscTex  = [productTex('misc')];

function wallShelf(x0, x1, z, h, texes, faceRy = 0){
  const g = new THREE.Group(); store.add(g);
  const w = x1 - x0, cx = (x0+x1)/2;
  addBox(g, w, h, 0.5, whiteInMat, cx, h/2 + 0.06, z, { ow:0.03 });
  const levels = 4;
  for (let i=0;i<levels;i++){
    const y = 0.32 + i * (h-0.5)/(levels-1);
    addBox(g, w-0.06, 0.035, 0.44, whiteInMat, cx, y, z+0.02, { ow:0.02 });
    const t = texes[i % texes.length];
    const pm = glowMat(0xffffff, { map:t });
    const pl = addPlane(g, w-0.1, 0.36, pm, cx, y + 0.2, z + 0.245);
    if (faceRy) { pl.rotation.y = faceRy; pl.position.x = cx; }
  }
  return g;
}

function tube(parent, a, b, r, mat){
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const dir = B.clone().sub(A), len = dir.length();
  const m = new THREE.Mesh(unitCyl, mat);
  m.scale.set(r, len, r);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  parent.add(m); return m;
}

  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const mid = A.clone().add(B).multiplyScalar(0.5); mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(A, mid, B);
  const geo = new THREE.TubeGeometry(curve, 14, 0.014, 5, false);
  world.add(new THREE.Mesh(geo, glowMat(0x14161c)));
}

  world.add(g);
}

/* ---------------- 积水（反射波纹着色器） ---------------- */
const puddleUniforms = [];
function puddle(x, z, rx, rz, opts = {}){
  const u = {
    uTime:{value:0},
    uScale:{value:new THREE.Vector2(rx, rz)},
    uBase:{value:new THREE.Color(0x141a28)},
    uWarmC:{value:new THREE.Color(opts.warm||0xffb060)},
    uWarmX:{value:opts.warmX||0}, uWarmW:{value:opts.warmW||0.8}, uWarmI:{value:opts.warmI||0.5},
    uCoolC:{value:new THREE.Color(opts.cool||0x7fa8e8)},
    uCoolX:{value:opts.coolX||0}, uCoolW:{value:opts.coolW||0.8}, uCoolI:{value:opts.coolI||0.3},
    uAlpha:{value:opts.alpha||0.85},
  };
  const mat = new THREE.ShaderMaterial({
    uniforms:u, transparent:true, depthWrite:false,
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform float uTime; uniform vec2 uScale; uniform vec3 uBase;
      uniform vec3 uWarmC; uniform float uWarmX; uniform float uWarmW; uniform float uWarmI;
      uniform vec3 uCoolC; uniform float uCoolX; uniform float uCoolW; uniform float uCoolI;
      uniform float uAlpha;
      varying vec2 vUv;
      void main(){
        vec2 p = (vUv - 0.5) * 2.0 * uScale;
        vec2 e = vec2(p.x / uScale.x, p.y / uScale.y);
        // 不规则水洼轮廓
        float ang = atan(e.y, e.x);
        float r = length(e) * (1.0 + 0.13*sin(ang*3.0 + uScale.x*7.0) + 0.08*sin(ang*7.0 + uScale.y*3.0));
        float edge = smoothstep(1.0, 0.72, r);
        vec3 col = uBase;
        float w1 = exp(-pow((p.x - uWarmX)/uWarmW, 2.0)) * (0.72 + 0.28*sin(uTime*2.1 + p.x*6.0));
        float w2 = exp(-pow((p.x - uCoolX)/uCoolW, 2.0)) * (0.72 + 0.28*sin(uTime*1.6 + p.x*9.0 + 2.0));
        col += uWarmC * w1 * uWarmI + uCoolC * w2 * uCoolI;
        // 雨点闪斑：圆形小点（非整格方块）
        vec2 cell = floor(p * 9.0);
        vec2 f = fract(p * 9.0);
        float hsh = fract(sin(dot(cell, vec2(127.1,311.7)) + floor(uTime*6.0)*13.0) * 43758.5453);
        vec2 dpos = vec2(fract(hsh*13.71), fract(hsh*57.17)) * 0.6 + 0.2;
        float dd = length(f - dpos);
        col += vec3(0.85,0.92,1.0) * smoothstep(0.13, 0.04, dd) * step(0.72, hsh) * 0.16 * edge;
        gl_FragColor = vec4(col, uAlpha * edge);
      }`
  });
  puddleUniforms.push(u);
  return flatPlane(world, rx*2, rz*2, mat, x, opts.y||0.02, z, opts.angle||0);
}

// 主雨（LineSegments，GPU 动画）
function makeRain(count, spMin, spMax, lenMin, lenMax, opacity, colorHex, slant){
  const pos = new Float32Array(count*6);
  const seed = new Float32Array(count*8);
  const tip = new Float32Array(count*2);
  for (let i=0;i<count;i++){
    const x0 = rand(-10.8, 10.8), z0 = rand(-10.8, 10.8);
    const sp = rand(spMin, spMax), len = rand(lenMin, lenMax), off = rand(10);
    for (let v=0; v<2; v++){
      seed.set([x0, z0, sp, len], (i*2+v)*4);
      tip[i*2+v] = v;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  geo.setAttribute('aTip', new THREE.BufferAttribute(tip, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uH:{value:9.5}, uSlant:{value:slant},
      uColor:{value:new THREE.Color(colorHex)}, uOpacity:{value:opacity} },
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
    vertexShader:`
      attribute vec4 aSeed; attribute float aTip;
      uniform float uTime; uniform float uH; uniform float uSlant;
      varying float vA;
      void main(){
        // 便利店顶范围内的雨落到屋顶高度，不穿进店内
        float onRoof = step(aSeed.x, 0.6) * step(-7.6, aSeed.x) * step(aSeed.z, 1.1) * step(-7.5, aSeed.z);
        float hMin = onRoof * 3.8;
        float y = hMin + mod(aSeed.w*13.7 - uTime*aSeed.z, uH - hMin);
        float yv = mix(y + aSeed.w, y, aTip);
        float off = (uH - yv) * uSlant;
        vec3 p = vec3(aSeed.x + off, yv, aSeed.z);
        vA = smoothstep(hMin + 0.05, hMin + 0.5, yv) * (1.0 - smoothstep(uH - 0.7, uH, yv));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader:`
      uniform vec3 uColor; uniform float uOpacity; varying float vA;
      void main(){ gl_FragColor = vec4(uColor, uOpacity * vA); }`
  });
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false; lines.renderOrder = 20;
  scene.add(lines);
  return mat;
}
const rainMatA = makeRain(1600, 13, 19, 0.45, 0.75, 0.5, 0xcfe0ff, 0.13);
const rainMatB = makeRain(650, 8, 12, 0.8, 1.15, 0.22, 0xa8c0ee, 0.13);

// 涟漪池（雨点 / 滴水共用）
const ripplePool = [];
{
  const rg = new THREE.RingGeometry(0.82, 1.0, 36);
  for (let i=0;i<30;i++){
    const m = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ color:0xcfe2ff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide }));
    m.rotation.x = -Math.PI/2; m.visible = false; m.renderOrder = 8;
    scene.add(m);
    ripplePool.push({ mesh:m, t:0, dur:1, r:1, op:0.5, active:false });
  }
}
let rippleIdx = 0;
function spawnRipple(x, z, r, dur, op, y = 0.03){
  const it = ripplePool[rippleIdx]; rippleIdx = (rippleIdx+1) % ripplePool.length;
  it.mesh.position.set(x, y, z); it.mesh.visible = true;
  it.t = 0; it.dur = dur; it.r = r; it.op = op; it.active = true;
}
function updateRipples(dt){
  for (const it of ripplePool){
    if (!it.active) continue;
    it.t += dt;
    const k = it.t / it.dur;
    if (k >= 1){ it.active = false; it.mesh.visible = false; continue; }
    const s = Math.max(0.001, easeOut(k) * it.r);
    it.mesh.scale.set(s, s, 1);
    it.mesh.material.opacity = it.op * (1-k) * Math.min(1, k/0.12);
  }
}
// 雨点落地随机涟漪
function randomRoadPoint(){
  const r = Math.random();
  if (r < 0.45) return [rand(-9.5, 1.4), rand(2.5, 5.1), 0.03];      // A 路面
  if (r < 0.72) return [rand(2.0, 4.6), rand(-9.5, 5.0), 0.03];      // B 路面
  return [rand(-9.0, 1.2), rand(1.15, 2.05), 0.068];                 // 店前人行道
}

// 屋檐滴水
const dripPool = [];
{
  const dg = new THREE.SphereGeometry(1, 8, 6);
  const dm = glowMat(0xbfd8ff, { transparent:true, opacity:0.8 });
  for (let i=0;i<12;i++){
    const m = new THREE.Mesh(dg, dm);
    m.scale.set(0.022, 0.05, 0.022); m.visible = false;
    scene.add(m);
    dripPool.push({ mesh:m, active:false, vy:0, x:0, z:0 });
  }
}
const dripSources = [];
for (let x=-7.2; x<=0.2; x+=1.05) dripSources.push({ x, z:1.8, timer:rand(0.2, 2.5) });
function updateDrips(dt){
  for (const src of dripSources){
    src.timer -= dt;
    if (src.timer <= 0){
      src.timer = rand(0.9, 3.2);
      const d = dripPool.find(d => !d.active);
      if (d){ d.active = true; d.x = src.x + rand(-0.05,0.05); d.z = src.z; d.vy = -0.4; d.mesh.position.set(d.x, 2.5, d.z); d.mesh.visible = true; }
    }
  }
  for (const d of dripPool){
    if (!d.active) continue;
    d.vy -= 13*dt;
    d.mesh.position.y += d.vy*dt;
    if (d.mesh.position.y <= 0.04){
      d.active = false; d.mesh.visible = false;
      spawnRipple(d.x, d.z, rand(0.10, 0.16), 0.5, 0.5, 0.068);
    }
  }
}

// 玻璃雨痕（双层错速）
const glassRainMats = [];
{
  const mk = (tex, repX)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repX, 1);
    const m = glowMat(0xdceaff, { map:tex, transparent:true, opacity:0.14, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
    glassRainMats.push(m); return m;
  };
  const a = mk(glassRainTexA, 2);
  addPlane(store, 7.6, 2.1, a, -3.6, 1.62, SZ1-0.035, { renderOrder:6 });
  const b = mk(glassRainTexB, 1.4);
  addPlane(store, 5.3, 2.1, b, SX1-0.035, 1.62, -3.15, { ry:Math.PI/2, renderOrder:6 });
}
// 关东煮蒸汽
const steamSprites = [];
{
  const stTex = glowTex;
  for (let i=0;i<6;i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:stTex, color:0xe8f2f6, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }));
    s.position.set(0.12 + rand(-0.06,0.06), 1.2, rand(-2.4,-1.35));
    steamSprites.push({ s, off:rand(1), speed:rand(0.16,0.26), drift:rand(-0.02,0.02) });
    store.add(s);
  }
}

/* ---------------- 8. 动效调度 ---------------- */
// 闪烁注册表：招牌 / 灯箱（兼容 Basic 与 Toon 材质）
const flickers = [];
function regFlick(entry){
  if (entry.mat && entry.mat.isShaderMaterial) entry.base = entry.mat.uniforms.uColor.value.clone();
  flickers.push(entry); return entry;
}
function setBright(f, v){
  if (!f.mat) return;
  if (f.mat.isShaderMaterial) f.mat.uniforms.uColor.value.copy(f.base).multiplyScalar(v);
  else f.mat.color.setScalar(v);
}
const mainSignMat = (()=>{ for (const c of store.children) if (c.material && c.material.map === signTex) return c.material; })();
const bladeSignMesh = store.children.find(c => c.userData && c.userData.isBlade);
regFlick({ mode:'main', mat:mainSignMat, dipT:0, v:1 });
regFlick({ mode:'blade', mat:bladeSignMesh ? bladeSignMesh.material : null, v:1, next:rand(2,5), burstN:0, burstT:0 });
regFlick({ mode:'pulse', mat:neonSignMat, sprites:[neonGlow], v:1 });

function updateFlickers(t, dt){
  for (const f of flickers){
    if (f.mode === 'main'){
      let v = 0.97 + 0.03*Math.sin(t*7.3) + 0.015*Math.sin(t*23.0);
      if (f.dipT > 0){ f.dipT -= dt; v = 0.55; }
      else if (Math.random() < dt*0.25) f.dipT = rand(0.05, 0.16);
      setBright(f, v);
      f.v = v;
    } else if (f.mode === 'blade'){
      if (f.burstN > 0){
        f.burstT -= dt;
        if (f.burstT <= 0){ f.burstN--; f.burstT = rand(0.04, 0.12); f.v = Math.random() < 0.5 ? 0.3 : 1; }
      } else {
        f.next -= dt;
        if (f.next <= 0){ f.next = rand(3, 8); f.burstN = 4 + Math.floor(rand(6)); f.burstT = 0; }
        f.v = 1;
      }
      setBright(f, 0.4 + 0.6*f.v);
    } else if (f.mode === 'pulse'){
      f.v = 0.78 + 0.22*Math.sin(t*2.1) * (0.85 + 0.15*Math.sin(t*0.37));
      setBright(f, f.v);
      for (const s of f.sprites) s.material.opacity = 0.28 * f.v;
    }
  }
}

// 自动门
const door = { open:0, target:0, next:4.5 };
function updateDoor(t, dt){
  if (t > door.next){
    door.target = door.target ? 0 : 1;
    door.next = t + (door.target ? 2.6 : rand(6, 12));
  }
  door.open = damp(door.open, door.target, 3.2, dt);
  const o = easeOut(door.open);
  doorPanels[0].position.x = doorPanels[0].userData.baseX - o*0.92;
  doorPanels[1].position.x = doorPanels[1].userData.baseX + o*0.92;
  doorSpill.material.opacity = o * 0.20;
}
// 门内暖光柱
const doorShaft = addPlane(store, 1.7, 2.0, new THREE.MeshBasicMaterial({ map:glowTex, color:0xffe2b0, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }), -1.4, 1.2, SZ1+0.5, { renderOrder:4 });
doorShaft.scale.set(1.7, 1.2, 1);

// 交通灯
function updateTraffic(t){
  const cyc = t % 13.0;
  const idx = cyc < 6.2 ? 0 : (cyc < 11.8 ? 2 : 1);
  traffic.lamps.forEach((L,i)=>{
    L.mesh.material.color.setHex(i === idx ? L.on : L.off);
  });
  traffic.glows.forEach((G,i)=>{ G.opacity = i === idx ? 0.5 : 0; });
  const c = [0xff4a48, 0xffc23e, 0x4fd86f][idx];
  traffic.pool.material.color.setHex(c);
  traffic.pool.material.opacity = 0.11;
}
// 路灯微闪
let lampFlickT = 0, lampDip = 0;
function updateLamp(t, dt){
  let v = 1;
  if (lampDip > 0){ lampDip -= dt; v = 0.6; }
  else if (Math.random() < dt*0.06) lampDip = rand(0.05, 0.14);
  for (const m of lampGlowSprites) m.opacity = 0.5 * v;
  lampPool.material.opacity = 0.30 * v;
  lampStreak.material.opacity = 0.20 * v;
}

/* ---------------- 9. 自定义轨道控制（无 UI） ---------------- */
const ctl = {
  target: new THREE.Vector3(0.3, 0.8, 1.2),
  az: 0.95, pol: 1.1, r: 23,
  tAz: 0.55, tPol: 0.96, tR: 19.5,
  minR: 3.5, maxR: 26, minPol: 0.18, maxPol: 1.45,
  lastAct: -10,
};
function applyCamera(){
  const sp = Math.sin(ctl.pol);
  camera.position.set(
    ctl.target.x + ctl.r * sp * Math.sin(ctl.az),
    ctl.target.y + ctl.r * Math.cos(ctl.pol),
    ctl.target.z + ctl.r * sp * Math.cos(ctl.az));
  camera.lookAt(ctl.target);
}
const dom = renderer.domElement;
const pointers = new Map();
let pinchD = 0;
function poke(){ ctl.lastAct = tNow; }
dom.addEventListener('pointerdown', e => {
  dom.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const p = [...pointers.values()];
    pinchD = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
  }
  poke();
});
dom.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  poke();
  if (pointers.size === 1){
    ctl.tAz -= dx * 0.0052;
    ctl.tPol = clamp(ctl.tPol - dy * 0.0052, ctl.minPol, ctl.maxPol);
  } else if (pointers.size === 2){
    const pts = [...pointers.values()];
    const nd = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if (nd > 1 && pinchD > 1) ctl.tR = clamp(ctl.tR * pinchD / nd, ctl.minR, ctl.maxR);
    pinchD = nd;
  }
});
const endPointer = e => { pointers.delete(e.pointerId); poke(); };
dom.addEventListener('pointerup', endPointer);
dom.addEventListener('pointercancel', endPointer);
dom.addEventListener('wheel', e => {
  e.preventDefault();
  ctl.tR = clamp(ctl.tR * Math.exp(e.deltaY * 0.0011), ctl.minR, ctl.maxR);
  poke();
}, { passive:false });
dom.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- 10. 主循环 ---------------- */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
let tNow = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  tNow += dt;

  // 雨
  rainMatA.uniforms.uTime.value = tNow;
  rainMatB.uniforms.uTime.value = tNow;
  // 涟漪：雨点随机落
  if (Math.random() < dt*7){
    const p = randomRoadPoint();
    spawnRipple(p[0], p[1], rand(0.06, 0.14), rand(0.35, 0.6), 0.28, p[2]);
  }
  updateRipples(dt);
  updateDrips(dt);
  // 积水着色器
  for (const u of puddleUniforms) u.uTime.value = tNow;
  // 玻璃雨痕（向下流）
  glassRainMats[0].map.offset.y += dt * 0.055;
  glassRainMats[1].map.offset.y += dt * 0.09;
  // 闪烁 / 门 / 交通灯 / 路灯
  updateFlickers(tNow, dt);
  updateDoor(tNow, dt);
  updateTraffic(tNow);
  updateLamp(tNow, dt);
  doorShaft.material.opacity = door.open * 0.10;
  // 蒸汽
  for (const st of steamSprites){
    const k = (tNow * st.speed + st.off) % 1;
    st.s.position.y = 1.22 + k * 0.9;
    st.s.position.x = 0.12 + Math.sin(tNow*1.3 + st.off*7) * 0.05 + st.drift * k * 10;
    st.s.material.opacity = Math.sin(k*Math.PI) * 0.16;
    const sc = 0.22 + k * 0.4;
    st.s.scale.set(sc, sc, 1);
  }
  // 电视窗微闪（对面楼）
  winCoolMat.color.setHSL(0.55, 0.5, 0.55 + 0.12*Math.sin(tNow*13.0) * (Math.random()<0.9?1:0.2));

  // 相机
  if (AUTO_ROTATE && tNow - ctl.lastAct > 2.5) ctl.tAz += dt * 0.10;
  const k = Math.min(1, dt * 6.5);
  ctl.az  += (ctl.tAz  - ctl.az ) * k;
  ctl.pol += (ctl.tPol - ctl.pol) * k;
  ctl.r   += (ctl.tR   - ctl.r  ) * Math.min(1, dt * 4);
  applyCamera();

  renderer.render(scene, camera);
}
tick();
</script>
