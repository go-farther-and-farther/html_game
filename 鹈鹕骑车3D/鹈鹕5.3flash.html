var PIVOT = {x:770, y:420};     // 身体起伏的旋转中心
var WHEEL_R = 108;              // 车轮半径
var W_OMEGA = 3.2;              // 车轮角速度（rad/s）
var C_OMEGA = 2.4;              // 曲柄角速度（rad/s）
var GROUND_V = W_OMEGA * WHEEL_R; // 地面/路标滚动速度（与车轮线速度一致）
var CHAIN_V  = C_OMEGA * 26;      // 链条线速度 = 牙盘半径 × 角速度
var LAYER_W = 1600;             // 视差层循环周期宽度

/* ================= 节点缓存 ================= */
var el = {
  spokesR:$('spokesR'), spokesF:$('spokesF'),
  chainT:$('chainT'), chainB:$('chainB'), crSpin:$('crSpin'),
  crankArmN:$('crankArmN'), crankArmF:$('crankArmF'),
  pedalN:$('pedalN'), pedalF:$('pedalF'),
  legNO:$('legNO'), legNM:$('legNM'), legFO:$('legFO'), legFM:$('legFM'),
  footN:$('footN'), footF:$('footF'),
  peli:$('peli'), wingN:$('wingN'), head:$('head'), pouch:$('pouch'),
  eyeBlink:$('eyeBlink'),
  mtn:$('mtn'), hill:$('hill'), treeL:$('treeL'), frontL:$('frontL'),
  roadDash:$('roadDash'),
  clouds:[$('cloud1'),$('cloud2'),$('cloud3'),$('cloud4'),$('cloud5')],
  ring1:$('ring1'), ring2:$('ring2'), bell:$('bell'), flagW:$('flagW')
};
/* 每朵云的初始位置 / 速度 / 缩放 */
var CLOUDS = [
  {x0:300,  y:110, s:14, k:1.15},
  {x0:900,  y:200, s:20, k:0.85},
  {x0:1400, y:85,  s:10, k:1.40},
  {x0:600,  y:265, s:24, k:0.70},
  {x0:1200, y:155, s:16, k:1.00}
];

/* 世界坐标 → 鹈鹕局部坐标：
   身体整体做“上移 bob + 绕 PIVOT 俯仰 rock”，
   反变换后得到踏板在身体坐标系里的位置，保证脚始终精确踩在踏板上 */
function toLocal(x, y, bob, rock){
  var qx = x, qy = y - bob;                    // 先抵消平移
  var rx = qx - PIVOT.x, ry = qy - PIVOT.y;    // 移到旋转中心
  var c = Math.cos(-rock), s = Math.sin(-rock);
  return { x: PIVOT.x + rx*c - ry*s, y: PIVOT.y + rx*s + ry*c };
}
/* 局部坐标 → 世界坐标（远腿画在身体图层之外，需要世界坐标） */
function toWorld(x, y, bob, rock){
  var rx = x - PIVOT.x, ry = y - PIVOT.y;
  var c = Math.cos(rock), s = Math.sin(rock);
  return { x: PIVOT.x + rx*c - ry*s, y: PIVOT.y + rx*s + ry*c + bob };
}
/* 卡通两段式腿：髋 → 膝(二次贝塞尔控制点，膝盖朝前) → 踏板上的脚踝 */
function legPath(hx, hy, fx, fy){
  var mx = (hx+fx)/2, my = (hy+fy)/2;
  var dx = fx-hx, dy = fy-hy, d = Math.hypot(dx, dy) || 1;
  var nx = dy/d, ny = -dx/d;                              // 指向前方的法线
  var bend = Math.min(92, Math.max(22, (326-d)*0.6));     // 越蜷腿膝盖越前顶
  var kx = mx + nx*bend, ky = my + ny*bend;
  return 'M'+hx.toFixed(1)+','+hy.toFixed(1)+' Q'+kx.toFixed(1)+','+ky.toFixed(1)+' '+fx.toFixed(1)+','+fy.toFixed(1);
}
/* 视差层滚动：内容做成两份拼接，整体在 -LAYER_W..0 之间循环平移 */
function scrollLayer(node, t, v){
  node.setAttribute('transform', 'translate(' + (-(t*v) % LAYER_W).toFixed(2) + ',0)');
}

/* ================= 主循环 ================= */
function frame(now){
  var t = now / 1000;
  var a = t * C_OMEGA;                          // 曲柄相位
  var wa = (t * W_OMEGA * 180/Math.PI) % 360;   // 车轮角度（度）
  var bob = 3 * Math.sin(2*a + 0.6);            // 身体上下起伏（每踩一圈两次）
  var rockDeg = 1.2 * Math.sin(2*a + 0.9);      // 身体轻微前后俯仰
  var rock = rockDeg * Math.PI / 180;

  /* --- 车轮持续旋转 --- */
  el.spokesR.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ')');
  el.spokesF.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ')');

  /* --- 曲柄 / 脚踏：两点互成 180° --- */
  var pN = { x: BB.x + CRANK*Math.cos(a),       y: BB.y + CRANK*Math.sin(a) };
  var pF = { x: BB.x - CRANK*Math.cos(a),       y: BB.y - CRANK*Math.sin(a) };
  el.crankArmN.setAttribute('x2', pN.x.toFixed(1));
  el.crankArmN.setAttribute('y2', pN.y.toFixed(1));
  el.crankArmF.setAttribute('x2', pF.x.toFixed(1));
  el.crankArmF.setAttribute('y2', pF.y.toFixed(1));
  el.pedalN.setAttribute('transform', 'translate(' + pN.x.toFixed(1) + ',' + pN.y.toFixed(1) + ')');
  el.pedalF.setAttribute('transform', 'translate(' + pF.x.toFixed(1) + ',' + pF.y.toFixed(1) + ')');
  el.crSpin.setAttribute('transform', 'translate(805,700) rotate(' + ((a*180/Math.PI)%360).toFixed(1) + ')');

  /* --- 双腿联动踩踏（IK）：脚踝在踏板上方 10px，脚掌随曲柄微微俯仰 --- */
  var tilt = 10 * Math.sin(a + 0.6);
  var ankleN = toLocal(pN.x - 6, pN.y - 10, bob, rock);        // 近腿：画在身体图层内
  var dN = legPath(HIP_N.x, HIP_N.y, ankleN.x, ankleN.y);
  el.legNO.setAttribute('d', dN); el.legNM.setAttribute('d', dN);
  el.footN.setAttribute('transform', 'translate(' + ankleN.x.toFixed(1) + ',' + ankleN.y.toFixed(1) + ') rotate(' + (tilt - rockDeg).toFixed(1) + ')');
  var hipF = toWorld(HIP_F.x, HIP_F.y, bob, rock);             // 远腿：画在身体图层外
  var dF = legPath(hipF.x, hipF.y, pF.x - 6, pF.y - 10);
  el.legFO.setAttribute('d', dF); el.legFM.setAttribute('d', dF);
  el.footF.setAttribute('transform', 'translate(' + pF.x.toFixed(1) + ',' + pF.y.toFixed(1) + ') rotate(' + tilt.toFixed(1) + ')');

  /* --- 鹈鹕整体起伏 / 俯仰 + 翅膀摆动 + 点头 + 喉囊微晃 --- */
  el.peli.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ') rotate(' + rockDeg.toFixed(2) + ' ' + PIVOT.x + ' ' + PIVOT.y + ')');
  el.wingN.setAttribute('transform', 'rotate(' + (2.8*Math.sin(2*a+1.1)).toFixed(2) + ' 921 455)');
  el.head.setAttribute('transform', 'rotate(' + (1.4*Math.sin(a+1.0)).toFixed(2) + ' 872 300)');
  el.pouch.setAttribute('transform', 'rotate(' + (1.2*Math.sin(2*a+1.3)).toFixed(2) + ' 946 258)');

  /* --- 眨眼（约 4.4s 一次） --- */
  var bp = t % 4.4, es = 1;
  if (bp < 0.16) es = Math.max(0.08, bp < 0.08 ? bp/0.08 : (0.16-bp)/0.08);
  el.eyeBlink.setAttribute('transform', 'scale(1,' + es.toFixed(2) + ')');

  /* --- 车铃：每 3.6s“叮”一声，扩散波纹 + 铃身抖动 --- */
  var q = t % 3.6;
  if (q < 0.7){
    var k = q / 0.7;
    el.ring1.setAttribute('r', (12 + 30*k).toFixed(1)); el.ring1.setAttribute('opacity', (0.8*(1-k)).toFixed(2));
    el.ring2.setAttribute('r', (12 + 48*k).toFixed(1)); el.ring2.setAttribute('opacity', (0.5*(1-k)).toFixed(2));
    el.bell.setAttribute('transform', 'rotate(' + (8*Math.sin(q*45)*(1-k)).toFixed(2) + ' 958 430)');
  } else {
    el.ring1.setAttribute('opacity', 0); el.ring2.setAttribute('opacity', 0);
    el.bell.setAttribute('transform', '');
  }

  /* --- 旗帜飘动 --- */
  el.flagW.setAttribute('transform', 'rotate(' + (6*Math.sin(4*t)).toFixed(2) + ' 584 468)');

  /* --- 路面虚线向后滚动（速度与车轮线速度一致，形成前进感） --- */
  el.roadDash.setAttribute('stroke-dashoffset', ((t*GROUND_V) % 130).toFixed(2));

  /* --- 链条转动（上段向前、下段同步环绕） --- */
  var co = -(t * CHAIN_V % 13).toFixed(2);
  el.chainT.setAttribute('stroke-dashoffset', co);
  el.chainB.setAttribute('stroke-dashoffset', co);

  /* --- 背景多层视差：远山最慢 → 树木全速 --- */
  scrollLayer(el.mtn,   t, 42);
  scrollLayer(el.hill,  t, 120);
  scrollLayer(el.treeL, t, GROUND_V);
  scrollLayer(el.frontL,t, GROUND_V);

  /* --- 云朵各自匀速飘动并循环回绕 --- */
  for (var i = 0; i < CLOUDS.length; i++){
    var c = CLOUDS[i];
    var x = ((c.x0 - t*c.s) % 1900 + 1900) % 1900 - 250;
    el.clouds[i].setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + c.y + ') scale(' + c.k + ')');
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
