<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  /* ===== 页面基础：全屏自适应 ===== */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6FC4EE; }
  .stage { position: fixed; inset: 0; }
  svg { width: 100%; height: 100%; display: block; }

  /* ===== 背景视差滚动（内容复制两份，无缝循环） ===== */
  @keyframes scrollL { to { transform: translateX(-1000px); } }
  .clouds    { animation: scrollL 120s linear infinite; }  /* 云：最慢，最远 */
  .mountains { animation: scrollL 69s  linear infinite; }  /* 山：中等 */
  .trees     { animation: scrollL 23s  linear infinite; }  /* 树：较快，较近 */

  /* ===== 路面虚线向后滚动（364px/s，与车轮速度匹配） ===== */
  @keyframes roadDash { to { stroke-dashoffset: 140; } }
  .roadline { animation: roadDash 0.385s linear infinite; }

  /* ===== 车铃：周期性叮一下 ===== */
  @keyframes bellRing {
    0%, 88% { transform: rotate(0); }
    90%     { transform: rotate(-18deg); }
    92%     { transform: rotate(14deg); }
    94%     { transform: rotate(-8deg); }
    96%,100%{ transform: rotate(0); }
  }
  .bell { transform-box: fill-box; transform-origin: 50% 85%;
          animation: bellRing 3.2s ease-in-out infinite; }
  @keyframes ding {
    0%, 86% { opacity: 0; } 90% { opacity: 1; } 98%, 100% { opacity: 0; }
  }
  .ding { animation: ding 3.2s linear infinite; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FC4EE"/>
      <stop offset="1" stop-color="#CDEFFB"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect x="0" y="0" width="1000" height="560" fill="url(#sky)"/>

  <!-- ===== 太阳：光晕由 JS 缓慢旋转 ===== -->
  <g id="rays" stroke="#FFC94D" stroke-width="8" stroke-linecap="round">
    <line x1="178" y1="100" x2="200" y2="100"/>
    <line x1="161" y1="59"  x2="177" y2="43"/>
    <line x1="120" y1="42"  x2="120" y2="20"/>
    <line x1="79"  y1="59"  x2="63"  y2="43"/>
    <line x1="62"  y1="100" x2="40"  y2="100"/>
    <line x1="79"  y1="141" x2="63"  y2="157"/>
    <line x1="120" y1="158" x2="120" y2="180"/>
    <line x1="161" y1="141" x2="177" y2="157"/>
  </g>
  <circle cx="120" cy="100" r="44" fill="#FFD75E"/>
  <circle cx="120" cy="100" r="33" fill="#FFE082"/>

  <!-- ===== 云朵（复制一份在 x+1000 处实现无缝循环） ===== -->
  <g class="clouds">
    <g id="cloudSet" fill="#FFFFFF" opacity="0.93">
      <g transform="translate(170 92)">
        <ellipse cx="0" cy="0" rx="48" ry="20"/>
        <ellipse cx="-38" cy="10" rx="30" ry="14"/>
        <ellipse cx="40" cy="10" rx="34" ry="15"/>
      </g>
      <g transform="translate(500 55) scale(0.85)">
        <ellipse cx="0" cy="0" rx="48" ry="20"/>
        <ellipse cx="-38" cy="10" rx="30" ry="14"/>
        <ellipse cx="40" cy="10" rx="34" ry="15"/>
      </g>
      <g transform="translate(790 122) scale(0.6)">
        <ellipse cx="0" cy="0" rx="48" ry="20"/>
        <ellipse cx="-38" cy="10" rx="30" ry="14"/>
        <ellipse cx="40" cy="10" rx="34" ry="15"/>
      </g>
    </g>
    <use href="#cloudSet" x="1000"/>
  </g>

  <!-- ===== 远山（带雪顶） ===== -->
  <g class="mountains">
    <g id="mtnSet">
      <path fill="#B9D9EC" d="M0 456 L110 292 L220 456 Z M180 456 L320 330 L470 456 Z
                              M430 456 L560 268 L700 456 Z M640 456 L790 336 L940 456 Z
                              M880 456 L1000 380 L1000 456 Z"/>
      <path fill="#FFFFFF" d="M110 292 L142 346 L78 346 Z"/>
      <path fill="#FFFFFF" d="M560 268 L584 320 L536 320 Z"/>
    </g>
    <use href="#mtnSet" x="1000"/>
  </g>

  <!-- ===== 草地 ===== -->
  <rect x="0" y="455" width="1000" height="27" fill="#8FD07C"/>

  <!-- ===== 树木与灌木（近处，滚动较快） ===== -->
  <g class="trees">
    <g id="treeSet">
      <rect x="136" y="430" width="8" height="52" fill="#8A5A3B"/>
      <circle cx="140" cy="414" r="44" fill="#3E9B4F"/>
      <circle cx="126" cy="400" r="24" fill="#5FBE6E"/>
      <rect x="466" y="438" width="7" height="44" fill="#8A5A3B"/>
      <circle cx="469" cy="424" r="36" fill="#3E9B4F"/>
      <circle cx="458" cy="412" r="19" fill="#5FBE6E"/>
      <rect x="785" y="428" width="9" height="54" fill="#8A5A3B"/>
      <circle cx="789" cy="408" r="48" fill="#3E9B4F"/>
      <circle cx="773" cy="392" r="26" fill="#5FBE6E"/>
      <ellipse cx="320" cy="476" rx="32" ry="13" fill="#4FA854"/>
      <ellipse cx="640" cy="477" rx="26" ry="11" fill="#46A050"/>
    </g>
    <use href="#treeSet" x="1000"/>
  </g>

  <!-- ===== 路面：沥青 + 黄色虚线（虚线由 CSS 滚动） ===== -->
  <rect x="0" y="482" width="1000" height="78" fill="#5A6572"/>
  <rect x="0" y="482" width="1000" height="4" fill="#7B8794"/>
  <line class="roadline" x1="-20" y1="521" x2="1020" y2="521"
        stroke="#F7D154" stroke-width="7" stroke-dasharray="55 85"/>

  <!-- ===== 自行车与鹈鹕的地面阴影 ===== -->
  <ellipse cx="505" cy="486" rx="205" ry="7" fill="rgba(31,42,54,0.15)"/>

  <!-- ===== 远侧腿（画在自行车之后面，颜色偏暗） ===== -->
  <g id="bobFar">
    <g transform="translate(392 262)"><!-- 远腿髋部定位 -->
      <g id="thighF"><!-- 大腿：JS 绕髋点旋转 -->
        <line x1="0" y1="0" x2="108" y2="0" stroke="#D97F0E" stroke-width="13" stroke-linecap="round"/>
        <g transform="translate(108 0)"><!-- 膝关节定位 -->
          <g id="shinF"><!-- 小腿：JS 绕膝关节旋转 -->
            <line x1="0" y1="0" x2="108" y2="0" stroke="#D97F0E" stroke-width="11" stroke-linecap="round"/>
            <g id="footF" transform="translate(108 0)"><!-- 远侧蹼足：JS 反向旋转保持水平 -->
              <path d="M-7 -5 L12 -6 Q23 -5 27 0 Q23 5 12 6 L-7 5 Z" fill="#D97F0E"/>
              <path d="M14 -4 L25 0 M14 4 L25 0" stroke="#D97F0E" stroke-width="2.5" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== 自行车 ===== -->
  <g id="bike">
    <!-- 后轮：轮圈、辐条、气嘴点，整组由 JS 绕轮毂旋转 -->
    <g id="wheelR">
      <circle cx="330" cy="412" r="70" fill="none" stroke="#2F3B4C" stroke-width="11"/>
      <circle cx="330" cy="412" r="58" fill="none" stroke="#C7CEDA" stroke-width="3"/>
      <g stroke="#8FA1B3" stroke-width="3">
        <line x1="272" y1="412" x2="388" y2="412"/>
        <line x1="330" y1="354" x2="330" y2="470"/>
        <line x1="279.8" y1="383" x2="380.2" y2="441"/>
        <line x1="279.8" y1="441" x2="380.2" y2="383"/>
        <line x1="301" y1="361.8" x2="359" y2="462.2"/>
        <line x1="301" y1="462.2" x2="359" y2="361.8"/>
      </g>
      <circle cx="388" cy="412" r="3.5" fill="#E8503A"/>
      <circle cx="330" cy="412" r="7" fill="#2F3B4C"/>
    </g>
    <!-- 前轮：结构同上 -->
    <g id="wheelF">
      <circle cx="660" cy="412" r="70" fill="none" stroke="#2F3B4C" stroke-width="11"/>
      <circle cx="660" cy="412" r="58" fill="none" stroke="#C7CEDA" stroke-width="3"/>
      <g stroke="#8FA1B3" stroke-width="3">
        <line x1="602" y1="412" x2="718" y2="412"/>
        <line x1="660" y1="354" x2="660" y2="470"/>
        <line x1="609.8" y1="383" x2="710.2" y2="441"/>
        <line x1="609.8" y1="441" x2="710.2" y2="383"/>
        <line x1="631" y1="361.8" x2="689" y2="462.2"/>
        <line x1="631" y1="462.2" x2="689" y2="361.8"/>
      </g>
      <circle cx="718" cy="412" r="3.5" fill="#E8503A"/>
      <circle cx="660" cy="412" r="7" fill="#2F3B4C"/>
    </g>

    <!-- 链条（虚线表现链节）+ 牙盘 + 飞轮 -->
    <line x1="450" y1="394" x2="330" y2="403" stroke="#46566A" stroke-width="5" stroke-dasharray="7 4"/>
    <line x1="450" y1="442" x2="330" y2="421" stroke="#46566A" stroke-width="5" stroke-dasharray="7 4"/>
    <circle cx="330" cy="412" r="9" fill="none" stroke="#4A5560" stroke-width="4"/>
    <circle cx="450" cy="418" r="24" fill="none" stroke="#4A5560" stroke-width="5"/>

    <!-- 车架（红色） -->
    <g stroke="#E8503A" stroke-linecap="round" fill="none">
      <line x1="330" y1="412" x2="450" y2="418" stroke-width="9"/>  <!-- 后下叉 -->
      <line x1="330" y1="412" x2="396" y2="246" stroke-width="7"/>  <!-- 后上叉 -->
      <line x1="450" y1="418" x2="396" y2="246" stroke-width="9"/>  <!-- 座管 -->
      <line x1="396" y1="252" x2="610" y2="252" stroke-width="8"/>  <!-- 上管 -->
      <line x1="615" y1="258" x2="450" y2="418" stroke-width="9"/>  <!-- 下管 -->
      <line x1="608" y1="242" x2="622" y2="284" stroke-width="11"/> <!-- 头管 -->
      <line x1="620" y1="282" x2="660" y2="412" stroke-width="7"/>  <!-- 前叉 -->
    </g>
    <line x1="390" y1="234" x2="396" y2="248" stroke="#4A5560" stroke-width="6"/> <!-- 座管杆 -->
    <ellipse cx="386" cy="230" rx="27" ry="8" fill="#5D4037"/>     <!-- 车座 -->
    <line x1="608" y1="242" x2="600" y2="224" stroke="#37474F" stroke-width="7" stroke-linecap="round"/> <!-- 立管 -->
    <path d="M600 224 C 594 212 582 212 574 222" fill="none" stroke="#37474F"
          stroke-width="7" stroke-linecap="round"/>                <!-- 车把 -->
    <circle cx="574" cy="222" r="4.5" fill="#263238"/>             <!-- 把套 -->

    <!-- 车铃：CSS 周期性摇铃 + “叮”声波 -->
    <g class="bell">
      <circle cx="600" cy="215" r="6.5" fill="#F2B705"/>
      <circle cx="600" cy="207.5" r="2.5" fill="#B7791F"/>
    </g>
    <g class="ding" stroke="#F2B705" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M608 206 Q615 200 614 192"/>
      <path d="M612 210 Q621 204 620 194"/>
    </g>

    <!-- 远侧曲柄 + 踏板（JS 绕五通旋转） -->
    <g id="crankFar">
      <line x1="450" y1="418" x2="450" y2="457" stroke="#37474F" stroke-width="7" stroke-linecap="round"/>
      <rect x="438" y="454" width="24" height="7" rx="2" fill="#263238"/>
    </g>
    <!-- 牙盘辐条（随曲柄一起转） -->
    <g id="chainring" stroke="#4A5560" stroke-width="4" stroke-linecap="round">
      <line x1="432" y1="418" x2="468" y2="418"/>
      <line x1="441" y1="402.4" x2="459" y2="433.6"/>
      <line x1="459" y1="402.4" x2="441" y2="433.6"/>
    </g>
    <!-- 近侧曲柄 + 踏板 -->
    <g id="crankNear">
      <line x1="450" y1="418" x2="450" y2="457" stroke="#37474F" stroke-width="7" stroke-linecap="round"/>
      <rect x="438" y="454" width="24" height="7" rx="2" fill="#263238"/>
    </g>
  </g>

  <!-- ===== 鹈鹕（整体随踩踏轻微起伏，由 JS 平移） ===== -->
  <g id="riderBob">
    <!-- 尾羽 -->
    <path d="M286 230 L248 214 L284 238 Z" fill="#EAF1F7"/>
    <path d="M286 240 L252 232 L286 248 Z" fill="#EAF1F7"/>
    <!-- 身体 -->
    <ellipse cx="348" cy="246" rx="64" ry="50" fill="#FFFFFF"/>
    <ellipse cx="340" cy="258" rx="46" ry="30" fill="#F4F8FB"/>
    <!-- 羽毛纹理 -->
    <path d="M310 262 Q348 278 388 258" fill="none" stroke="#E3EAF2" stroke-width="4" stroke-linecap="round"/>
    <path d="M300 240 Q330 252 366 246" fill="none" stroke="#E3EAF2" stroke-width="4" stroke-linecap="round"/>

    <!-- 头颈（JS 绕颈根轻微摆动）：S 形长颈、脑袋、大眼、长喙与喉囊 -->
    <g id="headG">
      <path d="M386 212 C 404 186 400 156 434 138 C 450 130 462 130 472 128"
            fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
      <circle cx="484" cy="120" r="21" fill="#FFFFFF"/>
      <!-- 头顶羽簇 -->
      <path d="M466 110 L452 100 L468 104 L458 92 L472 100 Z" fill="#F1F5F7"/>
      <!-- 上喙（长而尖） -->
      <path d="M500 114 L648 142 L500 132 Z" fill="#F7B733"/>
      <!-- 下垂的喉囊 -->
      <path d="M502 132 C 512 176 560 196 648 144 C 610 160 556 158 502 132 Z" fill="#F58B1F"/>
      <!-- 嘴缝与鼻孔 -->
      <path d="M502 131 L648 143" stroke="#D97706" stroke-width="2"/>
      <circle cx="530" cy="124" r="2" fill="#D97706"/>
      <!-- 眼睛 -->
      <circle cx="492" cy="108" r="6.5" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
      <circle cx="494.5" cy="108.5" r="3.2" fill="#1F2937"/>
      <circle cx="493" cy="106.5" r="1.1" fill="#FFFFFF"/>
    </g>

    <!-- 近侧翅膀：伸向车把，JS 绕肩关节轻微摆动 -->
    <g id="wing">
      <path d="M382 236 C 420 200 500 194 556 214 C 574 220 582 230 574 238
               C 530 254 440 258 386 254 Z" fill="#FFFFFF" stroke="#E3EAF2" stroke-width="2"/>
      <path d="M420 236 Q470 226 520 224" fill="none" stroke="#E3EAF2" stroke-width="3" stroke-linecap="round"/>
      <!-- 握住车把的蹼手 -->
      <circle cx="574" cy="230" r="8" fill="#F5A623"/>
      <path d="M574 222 L588 217 M575 230 L592 229 M574 238 L588 243"
            stroke="#F5A623" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- 近侧腿（画在最前面，踩踏时脚掌始终贴合踏板） -->
    <g transform="translate(396 266)"><!-- 近腿髋部定位 -->
      <g id="thighN">
        <line x1="0" y1="0" x2="108" y2="0" stroke="#F5A623" stroke-width="13" stroke-linecap="round"/>
        <g transform="translate(108 0)">
          <g id="shinN">
            <line x1="0" y1="0" x2="108" y2="0" stroke="#F5A623" stroke-width="11" stroke-linecap="round"/>
            <g id="footN" transform="translate(108 0)">
              <path d="M-7 -5 L12 -6 Q23 -5 27 0 Q23 5 12 6 L-7 5 Z" fill="#F5A623"/>
              <path d="M14 -4 L25 0 M14 4 L25 0" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>

<script>
/* =========================================================
   动画核心：requestAnimationFrame 驱动
   - 车轮 / 曲柄 / 牙盘 / 太阳光束：匀速旋转（SVG rotate 带圆心，无需处理原点）
   - 双腿：根据踏板实时位置做两连杆 IK（逆运动学），保证脚掌始终踩在踏板上
   - 身体起伏 / 翅膀摆动 / 头颈摆动：与曲柄相位联动的正弦波动
   速度基准：路面 364 px/s，车轮周长 2π×70≈440px → 一圈 1.208s
========================================================= */
const $ = id => document.getElementById(id);
const CRANK = 1.208;              // 曲柄每圈秒数
const BB  = { x: 450, y: 418 };   // 五通（曲柄轴心）
const CR  = 42;                   // 曲柄长度
const L1  = 108, L2 = 108;        // 大腿 / 小腿长度
const D2R = 180 / Math.PI;

/* 设置带圆心的旋转 */
function setRot(el, deg, cx, cy) {
  el.setAttribute('transform', `rotate(${deg} ${cx} ${cy})`);
}

/* 两连杆 IK：已知髋点 H 与脚掌目标 F（踏板位置），求大腿/小腿角度
   取“膝盖朝前”的解，脚掌反向旋转保持水平 */
function ikLeg(thigh, shin, foot, H, F) {
  let dx = F.x - H.x, dy = F.y - H.y, d = Math.hypot(dx, dy);
  const md = L1 + L2 - 1;                       // 防超出伸直极限
  if (d > md) { const s = md / d; dx *= s; dy *= s; F = { x: H.x + dx, y: H.y + dy }; d = md; }
  const c  = Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
  const A1 = Math.acos(c), phi = Math.atan2(dy, dx);
  const a1 = phi - A1, a2 = phi + A1;           // 两个候选膝解
  const k1x = H.x + L1 * Math.cos(a1), k2x = H.x + L1 * Math.cos(a2);
  const th1 = (k1x > k2x) ? a1 : a2;            // 选膝盖更靠前的解
  const Kx = H.x + L1 * Math.cos(th1), Ky = H.y + L1 * Math.sin(th1);
  const th2 = Math.atan2(F.y - Ky, F.x - Kx);   // 小腿绝对角
  thigh.setAttribute('transform', `rotate(${th1 * D2R})`);
  shin.setAttribute('transform',  `rotate(${(th2 - th1) * D2R})`);
  foot.setAttribute('transform',  `translate(108 0) rotate(${-(th1 + th2) * D2R})`);
}

function tick(ts) {
  const t = ts / 1000;
  const a = (t / CRANK) * Math.PI * 2;   // 曲柄角（弧度）
  const w = (t / CRANK) * 360;           // 车轮/曲柄角（度）

  /* 身体起伏：与曲柄两倍频联动（每圈两次起落） */
  const bob = 2.4 * Math.sin(2 * a);
  $('bobFar').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  $('riderBob').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

  /* 车轮、牙盘、曲柄：整圈匀速 */
  setRot($('wheelR'), w, 330, 412);
  setRot($('wheelF'), w, 660, 412);
  setRot($('chainring'), w, 450, 418);
  setRot($('crankNear'), w, 450, 418);
  setRot($('crankFar'), w + 180, 450, 418);

  /* 两个踏板的实时位置（a=0 时近踏板在下） */
  const sn = Math.sin(a), cs = Math.cos(a);
  const pN = { x: BB.x + CR * sn, y: BB.y + CR * cs };
  const pF = { x: BB.x - CR * sn, y: BB.y - CR * cs };

  /* 双腿 IK（髋点随身体起伏一起移动） */
  ikLeg($('thighF'), $('shinF'), $('footF'), { x: 392, y: 262 + bob }, pF);
  ikLeg($('thighN'), $('shinN'), $('footN'), { x: 396, y: 266 + bob }, pN);

  /* 翅膀：握把时随踩踏轻微上下摆动（绕肩关节） */
  setRot($('wing'), 3 * Math.cos(a + 0.3), 382, 236);
  /* 头颈：慢速小幅度摆动，增加生气 */
  setRot($('headG'), 2.2 * Math.sin(a * 0.9 + 0.6), 388, 212);
  /* 太阳光束：45 秒转一圈 */
  setRot($('rays'), t * 8, 120, 100);

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
