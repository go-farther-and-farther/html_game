</head>
<body>

      <!-- 长喙（上喙） -->

  <!-- 握把（压在翅膀尖端之上，表现"握把"） -->

  <circle cx="672" cy="332" r="7" fill="#34495e"/>

<script>
/* ================================================================
   动画驱动：单一 requestAnimationFrame 循环，保证轮、踏板、腿联动
   ================================================================ */
(function () {
  'use strict';

  /* ---------- 关键几何常量（与 SVG 坐标一致） ---------- */
  var BB = { x: 560, y: 455 };      // 中轴（曲柄中心）
  var CRANK_R = 35;                 // 曲柄长度
  var WHEEL_R = 85;                 // 车轮半径
  var HIP_NEAR = { x: 512, y: 352 };// 近侧髋关节
  var HIP_FAR  = { x: 494, y: 350 };// 远侧髋关节
  var L1 = 72, L2 = 78;             // 大腿 / 小腿长度
  var CADENCE = 0.75;               // 踩踏频率（转/秒）
  var ROAD_SPEED = 2 * Math.PI * CADENCE * WHEEL_R; // 路面滚动速度 = 轮缘线速度

  /* ---------- 元素引用 ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var spokesRear = $('spokesRear'), spokesFront = $('spokesFront'), crank = $('crank');
  var chain = $('chain'), pedalNear = $('pedalNear');
  var legNear = $('legNear'), legFar = $('legFar'), kneeNear = $('kneeNear');
  var footNear = $('footNear'), footFar = $('footFar');
  var pelicanBody = $('pelicanBody'), headGroup = $('headGroup'), pouch = $('pouch');
  var wingNear = $('wingNear'), wingFar = $('wingFar'), seams = $('seams');

  /* ---------- 背景元素状态（位置 + 速度） ---------- */
  var clouds = [
    { el: $('cloud1'), x: 220,  y: 110, v: 12 },
    { el: $('cloud2'), x: 640,  y: 78,  v: 8  },
    { el: $('cloud3'), x: 1000, y: 165, v: 16 }
  ];
  var palms = [
    { el: $('palm1'), x: 150,  y: 560, v: 55 },
    { el: $('palm2'), x: 640,  y: 560, v: 55 },
    { el: $('palm3'), x: 1060, y: 560, v: 55 }
  ];
  var gulls = [
    { el: $('gull1'), x: 380, y: 150, v: 85, ph: 0 },
    { el: $('gull2'), x: 820, y: 210, v: 70, ph: 2 }
  ];

  var t = 0, last = null;

  /* ---------- 两连杆腿部逆运动学：给定髋与脚，求膝盖 ---------- */
  function solveKnee(hx, hy, px, py) {
    var dx = px - hx, dy = py - hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.min(d, L1 + L2 - 1);                 // 防止超伸
    d = Math.max(d, Math.abs(L1 - L2) + 1);       // 防止折叠
    var base = Math.atan2(dy, dx);
    var cosA = (d * d + L1 * L1 - L2 * L2) / (2 * d * L1);
    cosA = Math.max(-1, Math.min(1, cosA));
    var off = Math.acos(cosA);
    // 两个解中取膝盖更靠前（x 更大）的一个，符合鸟类屈膝方向
    var k1x = hx + L1 * Math.cos(base + off), k1y = hy + L1 * Math.sin(base + off);
    var k2x = hx + L1 * Math.cos(base - off), k2y = hy + L1 * Math.sin(base - off);
    return (k1x > k2x) ? { x: k1x, y: k1y } : { x: k2x, y: k2y };
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    if (last === null) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    t += dt;

    var angle = 2 * Math.PI * CADENCE * t;   // 曲柄角（弧度，顺时针）
    var deg = angle * 180 / Math.PI;

    /* 车轮持续旋转（与踩踏同步） */
    spokesRear.setAttribute('transform', 'rotate(' + deg + ' 430 480)');
    spokesFront.setAttribute('transform', 'rotate(' + deg + ' 730 480)');

    /* 曲柄与齿盘旋转 */
    crank.setAttribute('transform', 'rotate(' + deg + ' 560 455)');

    /* 链条行进（虚线偏移） */
    chain.setAttribute('stroke-dashoffset', (-130 * t).toFixed(1));

    /* 踏板位置：近侧随曲柄，远侧反相 */
    var pnx = BB.x + CRANK_R * Math.cos(angle), pny = BB.y + CRANK_R * Math.sin(angle);
    var pfx = BB.x - CRANK_R * Math.cos(angle), pfy = BB.y - CRANK_R * Math.sin(angle);

    /* 身体起伏：每踩一步起伏一次 */
    var bob = 3 * Math.sin(angle * 2);
    pelicanBody.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');

    /* 双腿联动：髋随身体起伏，脚锁定踏板，膝盖由 IK 求解 */
    var kn = solveKnee(HIP_NEAR.x, HIP_NEAR.y + bob, pnx, pny);
    legNear.setAttribute('points', HIP_NEAR.x + ',' + (HIP_NEAR.y + bob) + ' ' +
                            kn.x.toFixed(1) + ',' + kn.y.toFixed(1) + ' ' +
                            pnx.toFixed(1) + ',' + pny.toFixed(1));
    kneeNear.setAttribute('cx', kn.x.toFixed(1));
    kneeNear.setAttribute('cy', kn.y.toFixed(1));

    var kf = solveKnee(HIP_FAR.x, HIP_FAR.y + bob, pfx, pfy);
    legFar.setAttribute('points', HIP_FAR.x + ',' + (HIP_FAR.y + bob) + ' ' +
                            kf.x.toFixed(1) + ',' + kf.y.toFixed(1) + ' ' +
                            pfx.toFixed(1) + ',' + pfy.toFixed(1));

    /* 蹼足与近侧踏板保持水平 */
    var tilt = 6 * Math.sin(angle);
    footNear.setAttribute('transform', 'translate(' + pnx.toFixed(1) + ',' + pny.toFixed(1) + ') rotate(' + tilt.toFixed(1) + ')');
    footFar.setAttribute('transform', 'translate(' + pfx.toFixed(1) + ',' + pfy.toFixed(1) + ') rotate(' + tilt.toFixed(1) + ')');
    pedalNear.setAttribute('transform', 'translate(' + pnx.toFixed(1) + ',' + pny.toFixed(1) + ')');

    /* 翅膀：握住车把，随踩踏节奏轻微摆动（近远反相） */
    var sway = 4 * Math.sin(angle * 2);
    wingNear.setAttribute('transform', 'rotate(' + sway.toFixed(2) + ' 548 268)');
    wingFar.setAttribute('transform', 'rotate(' + (-sway).toFixed(2) + ' 530 260)');

    /* 头部轻点 + 喉囊随节奏鼓动 */
    headGroup.setAttribute('transform', 'rotate(' + (2 * Math.sin(angle * 2 + 1)).toFixed(2) + ' 645 212)');
    var puff = 1 + 0.08 * Math.sin(angle * 2);
    pouch.setAttribute('transform', 'translate(686,220) scale(1,' + puff.toFixed(3) + ') translate(-686,-220)');

    /* 路面接缝向后滚动（循环取模，无缝衔接） */
    seams.setAttribute('transform', 'translate(' + (-(ROAD_SPEED * t) % 100).toFixed(1) + ',0)');

    /* 云朵缓慢左移，出界后从右侧循环进入 */
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= c.v * dt;
      if (c.x < -120) c.x = 1320;
      c.el.setAttribute('transform', 'translate(' + c.x.toFixed(1) + ',' + c.y + ')');
    }

    /* 棕榈树视差移动（比云快，比路面慢） */
    for (var j = 0; j < palms.length; j++) {
      var p = palms[j];
      p.x -= p.v * dt;
      if (p.x < -140) p.x = 1340;
      p.el.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ',' + p.y + ')');
    }

    /* 海鸥飞行 + 上下浮动 */
    for (var k = 0; k < gulls.length; k++) {
      var g = gulls[k];
      g.x -= g.v * dt;
      if (g.x < -60) g.x = 1260;
      var gy = g.y + 8 * Math.sin(t * 2 + g.ph);
      g.el.setAttribute('transform', 'translate(' + g.x.toFixed(1) + ',' + gy.toFixed(1) + ')');
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
