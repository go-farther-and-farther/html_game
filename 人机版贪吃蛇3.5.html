<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 贪吃蛇大作战 V4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#060810;overflow:hidden;
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
canvas{
  display:block;position:fixed;top:0;left:0;
  z-index:1;pointer-events:none;
}
.overlay{
  position:fixed;inset:0;
  background:rgba(6,8,16,0.88);
  display:none;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:200;backdrop-filter:blur(8px);
}
.overlay.show{display:flex}
.overlay .icon{font-size:72px;margin-bottom:12px}
.overlay .title{font-size:34px;font-weight:800;color:#fff;margin-bottom:6px}
.overlay .sub{font-size:16px;color:rgba(255,255,255,0.45);margin-bottom:28px}
.overlay .stats{display:flex;gap:32px;margin-bottom:28px}
.overlay .stat{text-align:center}
.overlay .stat .val{font-size:30px;font-weight:700;color:#e94560}
.overlay .stat .lbl{font-size:12px;color:rgba(255,255,255,0.35);margin-top:4px}
.btn{
  background:#e94560;color:#fff;border:none;
  border-radius:12px;padding:14px 44px;
  font-size:17px;font-weight:700;cursor:pointer;
  transition:all .15s;letter-spacing:1px;
}
.btn:hover{background:#d63851}
.btn:active{transform:scale(.94);background:#c02e44}
.boost-btn{
  position:fixed;bottom:28px;left:28px;
  width:68px;height:68px;border-radius:50%;
  background:rgba(233,69,96,0.25);
  border:2px solid rgba(233,69,96,0.45);
  color:rgba(255,255,255,0.6);font-size:26px;
  display:flex;justify-content:center;align-items:center;
  z-index:50;cursor:pointer;transition:all .12s;
  -webkit-tap-highlight-color:transparent;
  animation:pulse 2.5s infinite;
}
.boost-btn.active{
  background:rgba(233,69,96,0.7);
  border-color:#e94560;transform:scale(.88);color:#fff;
  animation:none;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,0.35)}
  50%{box-shadow:0 0 0 12px rgba(233,69,96,0)}
}
.overlay .desc{
  max-width:320px;text-align:center;
  font-size:14px;color:rgba(255,255,255,0.35);
  line-height:1.6;margin-bottom:24px;
}
.revive-btn{
  background:linear-gradient(135deg,#ff6b6b,#e94560);
  margin-top:12px;display:block;
  animation:revivePulse 1.5s infinite;
}
.revive-btn:disabled{
  background:#333;color:#666;cursor:not-allowed;
  animation:none;opacity:0.5;
}
@keyframes revivePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,0.4)}
  50%{box-shadow:0 0 20px 4px rgba(233,69,96,0.2)}
}
.settings-panel{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;padding:24px;
  margin-bottom:28px;width:360px;
}
.settings-panel h3{
  color:rgba(255,255,255,0.8);font-size:15px;
  margin-bottom:16px;text-align:center;
}
.setting-row{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:16px;
}
.setting-row:last-child{margin-bottom:0}
.setting-label{color:rgba(255,255,255,0.6);font-size:13px}
.setting-value{display:flex;align-items:center;gap:10px}
.setting-value span{
  color:#fff;font-size:15px;font-weight:600;
  min-width:36px;text-align:center;
}
.setting-btn{
  width:32px;height:32px;border-radius:8px;
  background:rgba(233,69,96,0.2);
  border:1px solid rgba(233,69,96,0.4);
  color:#e94560;font-size:18px;font-weight:700;
  cursor:pointer;display:flex;
  justify-content:center;align-items:center;
  transition:all .12s;
}
.setting-btn:hover{background:rgba(233,69,96,0.4)}
.diff-btns{display:flex;gap:6px}
.diff-btn{
  padding:6px 14px;border-radius:8px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.5);font-size:12px;
  cursor:pointer;transition:all .12s;
}
.diff-btn.active{
  background:rgba(233,69,96,0.3);
  border-color:#e94560;color:#fff;
}
.key-hints{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%);
  display:none;gap:8px;z-index:100;
  pointer-events:none;
}
.key-hints.show{display:flex}
.key-hint{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;padding:8px 12px;
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
}
.key-hint kbd{
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:6px;padding:4px 10px;
  color:#fff;font-size:14px;font-weight:600;
  font-family:inherit;min-width:36px;text-align:center;
}
.key-hint span{color:rgba(255,255,255,0.45);font-size:10px}
/* 模式切换（互斥样式） */
.mode-toggle{
  display:flex;align-items:center;gap:10px;
  margin-top:8px;padding:10px 14px;
  border-radius:10px;cursor:pointer;
  transition:all .15s;
}
.mode-toggle input{display:none}
.mode-check{
  width:22px;height:22px;border-radius:6px;
  border:2px solid rgba(255,255,255,0.25);
  display:flex;justify-content:center;align-items:center;
  transition:all .15s;font-size:13px;color:transparent;
}
.hunt-toggle{background:rgba(255,60,60,0.08);border:1px solid rgba(255,60,60,0.2)}
.hunt-toggle:hover{background:rgba(255,60,60,0.15)}
.hunt-toggle input:checked+.mode-check{background:#ff4444;border-color:#ff4444;color:#fff}
.hunt-label{color:rgba(255,255,255,0.7);font-size:13px}
.hunt-label b{color:#ff6666}
.team-toggle{background:rgba(60,120,255,0.08);border:1px solid rgba(60,120,255,0.2)}
.team-toggle:hover{background:rgba(60,120,255,0.15)}
.team-toggle input:checked+.mode-check{background:#4488ff;border-color:#4488ff;color:#fff}
.team-label{color:rgba(255,255,255,0.7);font-size:13px}
.team-label b{color:#66aaff}
.mode-exclude-hint{
  text-align:center;font-size:11px;
  color:rgba(255,255,255,0.3);margin-top:6px;
}
.mode-tag{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  border-radius:20px;padding:6px 18px;
  font-size:13px;font-weight:700;
  z-index:50;display:none;letter-spacing:1px;
}
.hunt-mode-tag{background:rgba(255,60,60,0.25);border:1px solid rgba(255,60,60,0.5);color:#ff6666}
.team-tag{background:rgba(60,120,255,0.25);border:1px solid rgba(60,120,255,0.5);color:#66aaff}
.mode-tag.show{display:block}
/* 截图 */
.screenshot-box{
  margin:16px 0;border-radius:12px;overflow:hidden;
  border:2px solid rgba(255,255,255,0.1);
  max-width:360px;width:100%;
}
.screenshot-box img{width:100%;display:block}
.victory-title{color:#ffd700!important}
.download-btn{
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  margin-top:8px;display:inline-block;
}
/* 击杀播报 */
.kill-feed{
  position:fixed;top:100px;right:170px;
  z-index:50;pointer-events:none;
  display:flex;flex-direction:column;gap:4px;
  max-width:260px;
}
.kill-msg{
  background:rgba(0,0,0,0.55);
  color:rgba(255,255,255,0.85);
  padding:5px 12px;border-radius:6px;
  font-size:11px;white-space:nowrap;
  animation:kfFade 4s forwards;
  border-left:3px solid #e94560;
}
@keyframes kfFade{
  0%{opacity:0;transform:translateX(20px)}
  8%{opacity:1;transform:translateX(0)}
  75%{opacity:1}
  100%{opacity:0}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="boostBtn" class="boost-btn">⚡</div>
<div id="huntTag" class="mode-tag hunt-mode-tag">⚔️ 猎杀模式</div>
<div id="teamTag" class="mode-tag team-tag">👥 队友模式</div>
<div id="killFeed" class="kill-feed"></div>

<div id="keyHints" class="key-hints">
  <div class="key-hint"><kbd>W</kbd><kbd>↑</kbd><span>上</span></div>
  <div class="key-hint"><kbd>A</kbd><kbd>←</kbd><span>左</span></div>
  <div class="key-hint"><kbd>S</kbd><kbd>↓</kbd><span>下</span></div>
  <div class="key-hint"><kbd>D</kbd><kbd>→</kbd><span>右</span></div>
  <div class="key-hint" style="margin-left:16px"><kbd>Space</kbd><span>加速</span></div>
</div>

<div id="startScreen" class="overlay show">
  <div class="icon">🐍</div>
  <div class="title">贪吃蛇大作战</div>
  <div class="sub" id="botInfo">与 6 条 AI 蛇同场竞技！</div>
  <div class="settings-panel">
    <h3>⚙️ 游戏设置</h3>
    <div class="setting-row">
      <span class="setting-label">AI 数量</span>
      <div class="setting-value">
        <button class="setting-btn" id="botMinus">−</button>
        <span id="botCount">6</span>
        <button class="setting-btn" id="botPlus">+</button>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">AI 难度</span>
      <div class="diff-btns">
        <button class="diff-btn" data-diff="easy">简单</button>
        <button class="diff-btn active" data-diff="normal">普通</button>
        <button class="diff-btn" data-diff="hard">困难</button>
      </div>
    </div>
    <label class="mode-toggle hunt-toggle">
      <input type="checkbox" id="huntMode">
      <span class="mode-check">✓</span>
      <span class="hunt-label"><b>猎杀模式</b> · 可穿过自己 · 撞对方使其变小</span>
    </label>
    <label class="mode-toggle team-toggle">
      <input type="checkbox" id="teamMode">
      <span class="mode-check">✓</span>
      <span class="team-label"><b>队友模式</b> · 分队对抗 · 队友不会互吃</span>
    </label>
    <div class="mode-exclude-hint">两种模式不可同时开启</div>
  </div>
  <div class="desc" id="controlDesc">
    移动鼠标/触摸屏幕 控制方向<br>
    点击/按住 加速（消耗长度）<br>
    撞到边界或其他蛇的身体即死亡
  </div>
  <button class="btn" id="startBtn">🎮 开始游戏</button>
</div>

<div id="gameOverScreen" class="overlay">
  <div class="icon" id="endIcon">💀</div>
  <div class="title" id="endTitle">游戏结束</div>
  <div class="sub" id="deathReason">-</div>
  <div class="screenshot-box" id="screenshotBox" style="display:none">
    <img id="screenshotImg" src="" alt="screenshot">
  </div>
  <div class="stats">
    <div class="stat"><div class="val" id="fScore">0</div><div class="lbl">得分</div></div>
    <div class="stat"><div class="val" id="fLen">0</div><div class="lbl">长度</div></div>
    <div class="stat"><div class="val" id="fKills">0</div><div class="lbl">击杀</div></div>
  </div>
  <button class="btn download-btn" id="downloadBtn" style="display:none">📥 保存截图</button>
  <button class="btn" id="restartBtn">🔄 再来一局</button>
  <button class="btn revive-btn" id="reviveBtn">❤️ 复活 (<span id="reviveCount">3</span>/3)</button>
</div>

<script>
(()=>{
'use strict';

/* ═══════════════════════════════════════
   V4 改动清单：
   1. canvas pointer-events:none + 输入绑 document → 修复 PC 点击无效
   2. 猎杀/队友模式互斥
   3. AI 数量 2~18 确认可用
   4. huntShrink 碰撞方向修正（撞人者受伤）
   5. permanentDeath 标志
   6. 击杀播报
   7. AI 食物搜索优化
   ═══════════════════════════════════════ */

/* ══════════ 常量 ══════════ */
const MAP = 3000;
const FOOD_N = 250;
const SR = 10;          // 蛇头半径
const SG = 16;          // 节段间距
const SPD = 2.5;        // 普通速度
const BSPD = 5.2;       // 加速速度
const TURN = 0.07;      // 转向速率
const INIT_L = 20;      // 初始长度
const FOOD_R = 5;       // 食物半径
const DEAD_R = 7;       // 死亡掉落物半径
const BOOST_MIN = 15;   // 加速最短长度
const BOOST_CI = 8;     // 加速消耗间隔（帧）
const INVULN_T = 120;   // 无敌帧数
const MAX_BOTS = 18;
const COPIES_PER_TYPE = 3;
const HUNT_SHRINK = 10; // 猎杀模式每次掉节数
const HUNT_MIN_LEN = 8; // 猎杀模式最低节数
const MAX_REVIVES = 3;
const MAX_PARTICLES = 300;
const GRID_SIZE = 200;  // 空间网格大小

const BOT_CFG = [
  {name:'小青龙',   color:'#00d2ff', aggr:.5},
  {name:'贪吃鬼',   color:'#ff8c00', aggr:.8},
  {name:'闪电蛇',   color:'#ffd700', aggr:.6},
  {name:'毒液',     color:'#7cfc00', aggr:.4},
  {name:'粉色风暴', color:'#ff69b4', aggr:.7},
  {name:'暗影忍者', color:'#9b59b6', aggr:.3}
];

const TEAM_COLORS = ['#4488ff','#ff4444'];

const DIFF_CFG = {
  easy:   {aggrMul:0.5, thinkCD:5, lookMul:0.7, label:'简单'},
  normal: {aggrMul:1.0, thinkCD:3, lookMul:1.0, label:'普通'},
  hard:   {aggrMul:1.5, thinkCD:2, lookMul:1.3, label:'困难'}
};

/* ══════════ 状态 ══════════ */
const cv = document.getElementById('canvas');
const cx = cv.getContext('2d');
const DPR = window.devicePixelRatio || 1;

let snakes = [], foods = [], particles = [];
let cam = {x:MAP/2, y:MAP/2};
let player = null;
let gameActive = false;   // 游戏进行中（无覆盖层）
let tAngle = 0, boostHeld = false;
let shakeAmt = 0, shakeX = 0, shakeY = 0;
let revives = 0;
let victoryChecked = false;
let animId = null;

let settings = {
  botCount: 6,
  difficulty: 'normal',
  huntMode: false,
  teamMode: false
};

/* ══════════ 设备检测 ══════════ */
const isPC = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;

/* ══════════ 画布尺寸 ══════════ */
function resize(){
  cv.width = innerWidth * DPR;
  cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

/* ═══════════════════════════════════════
   蛇 工 厂
   ═══════════════════════════════════════ */
function mkSnake(name, color, isP, aggr, team){
  const x = 300 + Math.random()*(MAP-600);
  const y = 300 + Math.random()*(MAP-600);
  const a = Math.random()*Math.PI*2;
  const segs = [];
  for(let i=0; i<INIT_L; i++)
    segs.push({x: x - Math.cos(a)*i*SG, y: y - Math.sin(a)*i*SG});
  return {
    segs, angle:a, tAngle:a, speed:SPD, color, name,
    score:0, alive:true, isP, boost:false, bc:0,
    kills:0, invuln:INVULN_T, rt:0,
    aggr: aggr||.5,
    team: team||0,         // 0=无 1=蓝 2=红
    permanentDeath: false,
    thinkCD:0, lastDir:a,
    stuckCount:0, lastPos:{x,y}, stuckCheck:0
  };
}

function moveSnake(s){
  let d = s.tAngle - s.angle;
  while(d > Math.PI)  d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  if(Math.abs(d) > TURN) s.angle += Math.sign(d)*TURN;
  else s.angle = s.tAngle;
  while(s.angle > Math.PI)  s.angle -= Math.PI*2;
  while(s.angle < -Math.PI) s.angle += Math.PI*2;
  const h = s.segs[0];
  h.x += Math.cos(s.angle)*s.speed;
  h.y += Math.sin(s.angle)*s.speed;
  for(let i=1; i<s.segs.length; i++){
    const p = s.segs[i-1], c = s.segs[i];
    const dx = p.x-c.x, dy = p.y-c.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist > SG){
      const r = (dist-SG)/dist;
      c.x += dx*r; c.y += dy*r;
    }
  }
}

function killSnake(s, reason){
  if(!s.alive) return;
  s.alive = false;
  // 粒子（限制数量）
  const maxP = Math.min(s.segs.length, 60);
  const step = Math.max(1, Math.floor(s.segs.length/maxP));
  for(let i=0; i<s.segs.length; i+=step){
    const sg = s.segs[i];
    for(let j=0; j<2; j++)
      particles.push({
        x:sg.x, y:sg.y,
        vx:(Math.random()-.5)*7, vy:(Math.random()-.5)*7,
        life:1, dec:.014+Math.random()*.014,
        sz:3+Math.random()*3, color:s.color
      });
  }
  // 掉落食物
  for(let i=0; i<s.segs.length; i+=3)
    foods.push({
      x:s.segs[i].x+(Math.random()-.5)*18,
      y:s.segs[i].y+(Math.random()-.5)*18,
      r:DEAD_R, color:s.color, val:2
    });
  if(s.isP){
    addShake(18);
    setTimeout(()=>showOver(reason, s), 600);
  } else {
    s.rt = 3000 + Math.random()*3000;
  }
  // 击杀播报
  addKillFeed('💀 ' + reason);
}

function respawnBot(s){
  let x, y, ok;
  for(let t=0; t<50; t++){
    x = 300+Math.random()*(MAP-600);
    y = 300+Math.random()*(MAP-600);
    ok = true;
    for(const o of snakes){
      if(!o.alive || o===s) continue;
      if((x-o.segs[0].x)**2+(y-o.segs[0].y)**2 < 280*280){ok=false;break;}
    }
    if(ok) break;
  }
  const a = Math.random()*Math.PI*2;
  s.segs = [];
  for(let i=0; i<INIT_L; i++)
    s.segs.push({x:x-Math.cos(a)*i*SG, y:y-Math.sin(a)*i*SG});
  s.angle=a; s.tAngle=a; s.speed=SPD; s.alive=true;
  s.boost=false; s.bc=0; s.score=0; s.kills=0;
  s.invuln=INVULN_T; s.permanentDeath=false;
  s.thinkCD=0; s.stuckCount=0;
  s.lastPos={x,y}; s.stuckCheck=0; s.lastDir=a;
}

/* ═══════════════════════════════════════
   食 物（空间网格加速）
   ═══════════════════════════════════════ */
let foodGrid = {};

function buildFoodGrid(){
  foodGrid = {};
  for(let i=0; i<foods.length; i++){
    const f = foods[i];
    const key = ((f.x/GRID_SIZE|0)<<16) | (f.y/GRID_SIZE|0);
    if(!foodGrid[key]) foodGrid[key] = [];
    foodGrid[key].push(i);
  }
}

function getNearFood(x, y, r){
  const res = [];
  const gx0 = Math.max(0, (x-r)/GRID_SIZE|0);
  const gy0 = Math.max(0, (y-r)/GRID_SIZE|0);
  const gx1 = Math.min((MAP/GRID_SIZE|0), (x+r)/GRID_SIZE|0);
  const gy1 = Math.min((MAP/GRID_SIZE|0), (y+r)/GRID_SIZE|0);
  for(let gx=gx0; gx<=gx1; gx++){
    for(let gy=gy0; gy<=gy1; gy++){
      const arr = foodGrid[(gx<<16)|gy];
      if(arr) res.push(...arr);
    }
  }
  return res;
}

function spawnFood(){
  foods.push({
    x:60+Math.random()*(MAP-120),
    y:60+Math.random()*(MAP-120),
    r:FOOD_R,
    color:`hsl(${Math.random()*360},80%,60%)`,
    val:1
  });
}

function ensureFood(){
  while(foods.length > FOOD_N*2.5)
    foods.splice(Math.floor(Math.random()*foods.length), 1);
  while(foods.length < FOOD_N) spawnFood();
  buildFoodGrid();
}

/* ═══════════════════════════════════════
   击 杀 播 报
   ═══════════════════════════════════════ */
const killFeedEl = document.getElementById('killFeed');

function addKillFeed(text){
  const el = document.createElement('div');
  el.className = 'kill-msg';
  el.textContent = text;
  killFeedEl.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
  while(killFeedEl.children.length > 6)
    killFeedEl.removeChild(killFeedEl.firstChild);
}

/* ═══════════════════════════════════════
   智 能 AI — 360° 方向评分
   ═══════════════════════════════════════ */
function updateAI(s){
  const h = s.segs[0];
  const diffCfg = DIFF_CFG[settings.difficulty];

  // ---- 防卡死 ----
  s.stuckCheck++;
  if(s.stuckCheck > 60){
    s.stuckCheck = 0;
    const dx = h.x-s.lastPos.x, dy = h.y-s.lastPos.y;
    if(dx*dx+dy*dy < 9) s.stuckCount++;
    else s.stuckCount = 0;
    s.lastPos = {x:h.x, y:h.y};
  }
  if(s.stuckCount >= 3){
    s.stuckCount = 0;
    s.tAngle = s.angle + (Math.random()-.5)*2.5;
    s.boost = true;
    return;
  }

  // ---- 决策频率 ----
  s.thinkCD--;
  if(s.thinkCD > 0) return;
  s.thinkCD = diffCfg.thinkCD;

  const NUM_DIRS = 36;
  const step = Math.PI*2/NUM_DIRS;
  const lookDist = (130 + s.segs.length*0.5) * diffCfg.lookMul;

  // 缓存附近食物（只需计算一次）
  const nearFood = getNearFood(h.x, h.y, 400);

  const scores = new Float64Array(NUM_DIRS);

  for(let i=0; i<NUM_DIRS; i++){
    const a = i*step;
    const cosA = Math.cos(a), sinA = Math.sin(a);
    let sc = 0;

    // 1. 边界安全
    const tx = h.x + cosA*lookDist;
    const ty = h.y + sinA*lookDist;
    const wd = Math.min(tx, MAP-tx, ty, MAP-ty);
    if(wd < 0)        sc -= 9999;
    else if(wd < 60)  sc -= (60-wd)*60;
    else if(wd < 130) sc -= (130-wd)*12;
    else              sc += 5;

    // 远层预测
    const tx2 = h.x + cosA*lookDist*1.8;
    const ty2 = h.y + sinA*lookDist*1.8;
    if(Math.min(tx2, MAP-tx2, ty2, MAP-ty2) < 80) sc -= 400;

    // 2. 蛇身避障
    for(const o of snakes){
      if(!o.alive) continue;
      const odx = tx-o.segs[0].x, ody = ty-o.segs[0].y;
      const maxR = o.segs.length*SG + 80;
      if(odx*odx+ody*ody > maxR*maxR) continue;
      const startI = (o===s) ? 8 : 0;
      for(let j=startI; j<o.segs.length; j+=2){
        const seg = o.segs[j];
        const d2 = (tx-seg.x)**2 + (ty-seg.y)**2;
        if(d2 < 400)       sc -= 9999;
        else if(d2 < 2500) sc -= (50-Math.sqrt(d2))*25;
        else if(d2 < 6400) sc -= (80-Math.sqrt(d2))*4;
      }
      // 预判对方蛇头走向
      if(o!==s && o.alive && o.segs.length>1){
        const ox2 = o.segs[0].x + Math.cos(o.angle)*60;
        const oy2 = o.segs[0].y + Math.sin(o.angle)*60;
        if((tx-ox2)**2+(ty-oy2)**2 < 2500) sc -= 200;
      }
    }

    // 3. 食物吸引力
    let foodScore = 0;
    for(const fi of nearFood){
      const f = foods[fi];
      const fd2 = (f.x-h.x)**2 + (f.y-h.y)**2;
      if(fd2 > 160000) continue;
      let fa = Math.atan2(f.y-h.y, f.x-h.x);
      let diff = a - fa;
      while(diff > Math.PI)  diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      if(Math.abs(diff) < 0.6){
        const cone = 1 - Math.abs(diff)/0.6;
        foodScore += cone * (400-Math.sqrt(fd2))/400 * 8 * f.val;
      }
    }
    sc += foodScore;

    // 4. 追杀其他玩家
    const aggrMul = diffCfg.aggrMul;
    const huntAggr = settings.huntMode ? 2 : 1;
    if(!s.isP && s.segs.length > 25){
      // 追玩家
      const ph = player && player.alive ? player.segs[0] : null;
      if(ph && !(settings.teamMode && s.team>0 && s.team===player.team)){
        const dx = ph.x-h.x, dy = ph.y-h.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const chaseD = settings.huntMode ? 500 : 350;
        if(dist < chaseD){
          let pa = Math.atan2(dy, dx);
          let diff = a - pa;
          while(diff > Math.PI)  diff -= Math.PI*2;
          while(diff < -Math.PI) diff += Math.PI*2;
          if(Math.abs(diff) < 0.5)
            sc += (1-Math.abs(diff)/0.5)*(chaseD-dist)/chaseD*15*s.aggr*aggrMul*huntAggr;
        }
      }
      // 追短蛇
      for(const o of snakes){
        if(!o.alive || o===s || o.isP) continue;
        if(settings.teamMode && s.team>0 && o.team===s.team) continue;
        const ratio = settings.huntMode ? 1.2 : 0.6;
        if(o.segs.length < s.segs.length*ratio){
          const dx = o.segs[0].x-h.x, dy = o.segs[0].y-h.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          const chaseD = settings.huntMode ? 400 : 280;
          if(dist < chaseD){
            let pa = Math.atan2(dy, dx);
            let diff = a - pa;
            while(diff > Math.PI)  diff -= Math.PI*2;
            while(diff < -Math.PI) diff += Math.PI*2;
            if(Math.abs(diff) < 0.4)
              sc += (1-Math.abs(diff)/0.4)*(chaseD-dist)/chaseD*10*s.aggr*aggrMul*huntAggr;
          }
        }
      }
    }

    // 5. 逃跑
    for(const o of snakes){
      if(!o.alive || o===s) continue;
      if(settings.teamMode && s.team>0 && o.team===s.team) continue;
      const fleeRatio = settings.huntMode ? 1.1 : 1.3;
      const fleeDist = settings.huntMode ? 280 : 200;
      if(o.segs.length > s.segs.length*fleeRatio){
        const dx = o.segs[0].x-h.x, dy = o.segs[0].y-h.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < fleeDist){
          let pa = Math.atan2(dy, dx);
          let diff = a - pa;
          while(diff > Math.PI)  diff -= Math.PI*2;
          while(diff < -Math.PI) diff += Math.PI*2;
          if(Math.abs(diff) > 1.5)
            sc += ((Math.abs(diff)-1.5)/1.5)*(fleeDist-dist)/fleeDist*20;
        }
      }
    }

    // 6. 方向惯性
    let adiff = a - s.lastDir;
    while(adiff > Math.PI)  adiff -= Math.PI*2;
    while(adiff < -Math.PI) adiff += Math.PI*2;
    sc -= Math.abs(adiff)*6;

    // 7. 前方开阔度
    let openScore = 0;
    for(let r=1; r<=3; r++){
      const rd = r*50;
      for(let da=-0.4; da<=0.4; da+=0.4){
        const cx2 = h.x+Math.cos(a+da)*rd;
        const cy2 = h.y+Math.sin(a+da)*rd;
        if(Math.min(cx2, MAP-cx2, cy2, MAP-cy2) > 50) openScore += r;
        for(const o of snakes){
          if(!o.alive) continue;
          const si = o===s ? 10 : 0;
          for(let j=si; j<o.segs.length; j+=4){
            if((cx2-o.segs[j].x)**2+(cy2-o.segs[j].y)**2 < 900){
              openScore -= r*2; break;
            }
          }
        }
      }
    }
    sc += openScore;

    scores[i] = sc;
  }

  // 找最佳方向
  let bestI = 0;
  for(let i=1; i<NUM_DIRS; i++)
    if(scores[i] > scores[bestI]) bestI = i;
  s.tAngle = bestI * step;
  s.lastDir = s.tAngle;

  // ---- AI 加速 ----
  s.boost = false;
  if(s.segs.length > BOOST_MIN + 5){
    for(const f of foods){
      const fd = Math.sqrt((f.x-h.x)**2+(f.y-h.y)**2);
      if(fd<110 && fd>20 && f.val>=2){
        let fa = Math.atan2(f.y-h.y, f.x-h.x);
        let diff = s.angle - fa;
        while(diff > Math.PI)  diff -= Math.PI*2;
        while(diff < -Math.PI) diff += Math.PI*2;
        if(Math.abs(diff) < 0.4){ s.boost = true; break; }
      }
    }
    if(!s.boost){
      for(const o of snakes){
        if(!o.alive || o===s) continue;
        if(o.segs.length > s.segs.length*1.2){
          const dist = Math.sqrt((o.segs[0].x-h.x)**2+(o.segs[0].y-h.y)**2);
          if(dist < 130){ s.boost = true; break; }
        }
      }
    }
  }
}

/* ══════════ 加速 ══════════ */
function updateBoost(s){
  if(s.isP) s.boost = boostHeld && gameActive;
  if(s.boost && s.alive && s.segs.length > BOOST_MIN){
    s.speed = BSPD; s.bc++;
    if(s.bc >= BOOST_CI){
      s.bc = 0;
      const t = s.segs.pop();
      if(t) foods.push({x:t.x, y:t.y, r:3, color:s.color, val:1});
      if(s.isP) s.score = Math.max(0, s.score-1);
    }
  } else {
    s.speed = SPD; s.boost = false; s.bc = 0;
  }
}

/* ══════════ 猎杀模式：撞对方使其变小 ══════════ */
function huntShrink(victim, attacker){
  if(victim.segs.length <= HUNT_MIN_LEN){
    // 太短 → 永久死亡
    killSnake(victim, attacker.name+' 吞噬了 '+victim.name);
    attacker.kills++;
    victim.permanentDeath = true;
    return;
  }
  const lose = Math.min(HUNT_SHRINK, victim.segs.length - HUNT_MIN_LEN);
  for(let i=0; i<lose; i++){
    const seg = victim.segs.pop();
    if(seg) foods.push({
      x:seg.x+(Math.random()-.5)*10,
      y:seg.y+(Math.random()-.5)*10,
      r:DEAD_R, color:victim.color, val:1
    });
  }
  victim.score = Math.max(0, victim.score - lose);
  // 攻击者获得部分长度
  const gain = Math.floor(lose * 0.6);
  for(let i=0; i<gain; i++){
    const tail = attacker.segs[attacker.segs.length-1];
    if(tail) attacker.segs.push({x:tail.x, y:tail.y});
  }
  attacker.score += gain;
  addShake(8);
  for(let j=0; j<12; j++)
    particles.push({
      x:victim.segs[0].x, y:victim.segs[0].y,
      vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6,
      life:1, dec:.03, sz:3+Math.random()*3, color:victim.color
    });
  addKillFeed('⚔️ '+attacker.name+' 撞了 '+victim.name+' (-'+lose+')');
}

/* ══════════ 碰撞检测 ══════════ */
function checkHit(){
  const eaten = new Set();
  const hunt = settings.huntMode;
  const teamOn = settings.teamMode;
  const hitR2 = SR*SR*1.5;
  const selfR2 = SR*SR*0.9;

  for(const s of snakes){
    if(!s.alive || s.invuln > 0) continue;
    const h = s.segs[0];

    // 边界
    if(h.x<0 || h.x>MAP || h.y<0 || h.y>MAP){
      killSnake(s, s.name+' 撞到了边界');
      continue;
    }

    let dead = false;

    // 蛇撞蛇
    for(const o of snakes){
      if(!o.alive || o===s) continue;
      if(teamOn && s.team>0 && o.team===s.team) continue;
      // 距离预判
      const maxRange = o.segs.length*SG + SR*2;
      if((h.x-o.segs[0].x)**2+(h.y-o.segs[0].y)**2 > maxRange*maxRange) continue;

      for(let i=0; i<o.segs.length; i++){
        const sg = o.segs[i];
        const dx = h.x-sg.x, dy = h.y-sg.y;
        if(dx*dx+dy*dy < hitR2){
          if(hunt){
            // 猎杀模式：s 的头撞到 o 的身体 → o 受伤变小
            huntShrink(o, s);
          } else {
            killSnake(s, s.name+' 被 '+o.name+' 消灭');
            o.kills++;
          }
          dead = true; break;
        }
      }
      if(dead) break;
    }
    if(dead) continue;

    // 自身碰撞（猎杀模式可穿过自己）
    if(!hunt && s.segs.length > 12){
      for(let i=12; i<s.segs.length; i++){
        const sg = s.segs[i];
        const dx = h.x-sg.x, dy = h.y-sg.y;
        if(dx*dx+dy*dy > 2500) continue;
        if(dx*dx+dy*dy < selfR2){
          killSnake(s, s.name+' 咬到了自己');
          dead = true; break;
        }
      }
    }
    if(dead) continue;

    // 食物碰撞
    const eatR = SR + FOOD_R + 5;
    const nearIdx = getNearFood(h.x, h.y, eatR);
    for(const i of nearIdx){
      if(eaten.has(i)) continue;
      const f = foods[i];
      if((h.x-f.x)**2+(h.y-f.y)**2 < (SR+f.r)*(SR+f.r)){
        eaten.add(i);
        s.score += f.val;
        for(let j=0; j<f.val; j++){
          const tail = s.segs[s.segs.length-1];
          s.segs.push({x:tail.x, y:tail.y});
        }
        for(let j=0; j<5; j++)
          particles.push({
            x:f.x, y:f.y,
            vx:(Math.random()-.5)*4, vy:(Math.random()-.5)*4,
            life:1, dec:.04, sz:2+Math.random()*2, color:f.color
          });
      }
    }
  }

  // 批量删除食物（swap-and-pop）
  const toDel = [...eaten].sort((a,b)=>b-a);
  for(const idx of toDel){
    if(idx < foods.length-1) foods[idx] = foods[foods.length-1];
    foods.pop();
  }
}

/* ══════════ 粒子 & 震动 ══════════ */
function updateParts(){
  while(particles.length > MAX_PARTICLES) particles.shift();
  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= .94; p.vy *= .94;
    p.life -= p.dec;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

function addShake(a){ shakeAmt = a; }

function updateShake(){
  if(shakeAmt > .5){
    shakeX = (Math.random()-.5)*shakeAmt;
    shakeY = (Math.random()-.5)*shakeAmt;
    shakeAmt *= .88;
  } else {
    shakeX = shakeY = shakeAmt = 0;
  }
}

/* ══════════ 镜头 ══════════ */
function updateCam(){
  if(!player || !player.alive) return;
  cam.x += (player.segs[0].x - cam.x)*.09;
  cam.y += (player.segs[0].y - cam.y)*.09;
}

/* ═══════════════════════════════════════
   渲 染
   ═══════════════════════════════════════ */
function render(){
  const W = innerWidth, H = innerHeight;
  cx.fillStyle = '#060810';
  cx.fillRect(0, 0, W, H);
  cx.save();
  cx.translate(W/2 - cam.x + shakeX, H/2 - cam.y + shakeY);
  drawWorld(W, H);
  drawFoods();
  drawSnakes();
  drawParts();
  cx.restore();
  drawUI(W, H);
}

function drawWorld(W, H){
  cx.fillStyle = '#0c1020';
  cx.fillRect(0, 0, MAP, MAP);
  cx.strokeStyle = 'rgba(255,255,255,0.025)';
  cx.lineWidth = 1;
  const gs = 80;
  const sx = Math.max(0, Math.floor((cam.x-W/2)/gs)*gs);
  const sy = Math.max(0, Math.floor((cam.y-H/2)/gs)*gs);
  const ex = Math.min(MAP, sx+W+gs*2);
  const ey = Math.min(MAP, sy+H+gs*2);
  cx.beginPath();
  for(let x=sx; x<=ex; x+=gs){cx.moveTo(x,sy);cx.lineTo(x,ey);}
  for(let y=sy; y<=ey; y+=gs){cx.moveTo(sx,y);cx.lineTo(ex,y);}
  cx.stroke();
  cx.strokeStyle = 'rgba(233,69,96,0.25)';
  cx.lineWidth = 4;
  cx.strokeRect(0, 0, MAP, MAP);
  cx.strokeStyle = 'rgba(233,69,96,0.06)';
  cx.lineWidth = 35;
  cx.strokeRect(0, 0, MAP, MAP);
}

function drawFoods(){
  const W2 = innerWidth/2+60, H2 = innerHeight/2+60;
  // 光晕
  cx.globalAlpha = .2;
  for(const f of foods){
    if(Math.abs(f.x-cam.x)>W2 || Math.abs(f.y-cam.y)>H2) continue;
    cx.fillStyle = f.color;
    cx.beginPath(); cx.arc(f.x, f.y, f.r*2.4, 0, Math.PI*2); cx.fill();
  }
  // 实体
  cx.globalAlpha = 1;
  for(const f of foods){
    if(Math.abs(f.x-cam.x)>W2 || Math.abs(f.y-cam.y)>H2) continue;
    cx.fillStyle = f.color;
    cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, Math.PI*2); cx.fill();
  }
  // 高光
  cx.fillStyle = 'rgba(255,255,255,0.3)';
  for(const f of foods){
    if(Math.abs(f.x-cam.x)>W2 || Math.abs(f.y-cam.y)>H2) continue;
    cx.beginPath(); cx.arc(f.x-f.r*.25, f.y-f.r*.25, f.r*.3, 0, Math.PI*2); cx.fill();
  }
}

function drawSnakes(){
  const sorted = snakes.filter(s=>s.alive);
  sorted.sort((a,b)=>(a.isP?1:0)-(b.isP?1:0));
  sorted.forEach(drawSnake);
}

function drawSnake(s){
  const h = s.segs[0];
  if(Math.abs(h.x-cam.x)>innerWidth/2+250 || Math.abs(h.y-cam.y)>innerHeight/2+250) return;
  const n = s.segs.length;
  const blink = s.invuln>0 && Math.floor(s.invuln/5)%2===0;
  const W2 = innerWidth/2+30, H2 = innerHeight/2+30;
  const huntWeak = settings.huntMode && n<=HUNT_MIN_LEN+5 && n>HUNT_MIN_LEN;
  const drawStep = n>80 ? 3 : n>40 ? 2 : 1;

  for(let i=n-1; i>=0; i-=drawStep){
    const sg = s.segs[i];
    if(Math.abs(sg.x-cam.x)>W2 || Math.abs(sg.y-cam.y)>H2) continue;
    const t = n>1 ? i/(n-1) : 0;
    const r = i===0 ? SR*1.15 : SR*(.72+.28*t);
    const stripe = Math.floor(i/3)%2===0;
    const br = stripe ? (.62+.38*t) : (.48+.38*t);
    if(blink) continue;
    cx.globalAlpha = .12; cx.fillStyle = '#000';
    cx.beginPath(); cx.arc(sg.x+2, sg.y+2, r, 0, Math.PI*2); cx.fill();
    cx.globalAlpha = br;
    cx.fillStyle = huntWeak ? '#ff3333' : s.color;
    cx.beginPath(); cx.arc(sg.x, sg.y, r, 0, Math.PI*2); cx.fill();
    cx.globalAlpha = br*.13; cx.fillStyle = '#fff';
    cx.beginPath(); cx.arc(sg.x-r*.22, sg.y-r*.22, r*.42, 0, Math.PI*2); cx.fill();
  }
  cx.globalAlpha = 1;

  // 眼睛 + 名牌
  if(s.alive && !blink){
    const eo=SR*.42, er=SR*.28, pr=er*.55, perp=s.angle+Math.PI/2;
    for(let side=-1; side<=1; side+=2){
      const ex = h.x+Math.cos(s.angle)*eo*.6+Math.cos(perp)*eo*side;
      const ey = h.y+Math.sin(s.angle)*eo*.6+Math.sin(perp)*eo*side;
      cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(ex, ey, er, 0, Math.PI*2); cx.fill();
      cx.fillStyle = '#111'; cx.beginPath();
      cx.arc(ex+Math.cos(s.angle)*pr*.3, ey+Math.sin(s.angle)*pr*.3, pr, 0, Math.PI*2); cx.fill();
    }
    const teamIcon = settings.teamMode && s.team>0 ? (s.team===1?'🔵 ':'🔴 ') : '';
    const label = teamIcon + s.name + ' (' + n + ')';
    cx.font = 'bold 12px "Segoe UI","PingFang SC",sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'bottom';
    const tw = cx.measureText(label).width;
    cx.fillStyle = 'rgba(0,0,0,0.4)';
    rrect(h.x-tw/2-6, h.y-SR-24, tw+12, 18, 4); cx.fill();
    const isTeammate = settings.teamMode && s.team>0 && player && s.team===player.team;
    cx.fillStyle = s.isP ? '#fff' : (isTeammate ? '#88bbff' : 'rgba(255,255,255,0.75)');
    cx.fillText(label, h.x, h.y-SR-8);
  }

  // 加速尾焰
  if(s.boost && s.alive && !blink){
    const tail = s.segs[n-1];
    cx.globalAlpha = .15; cx.fillStyle = s.color;
    cx.beginPath(); cx.arc(tail.x, tail.y, SR*1.5, 0, Math.PI*2); cx.fill();
    cx.globalAlpha = 1;
  }
}

function rrect(x, y, w, h, r){
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y);
  cx.quadraticCurveTo(x+w,y,x+w,y+r); cx.lineTo(x+w,y+h-r);
  cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); cx.lineTo(x+r,y+h);
  cx.quadraticCurveTo(x,y+h,x,y+h-r); cx.lineTo(x,y+r);
  cx.quadraticCurveTo(x,y,x+r,y); cx.closePath();
}

function drawParts(){
  const W2=innerWidth/2+30, H2=innerHeight/2+30;
  const groups = {};
  for(const p of particles){
    if(Math.abs(p.x-cam.x)>W2 || Math.abs(p.y-cam.y)>H2) continue;
    if(p.life < .05) continue;
    if(!groups[p.color]) groups[p.color] = [];
    groups[p.color].push(p);
  }
  for(const color in groups){
    cx.fillStyle = color;
    for(const p of groups[color]){
      cx.globalAlpha = Math.max(0, p.life);
      cx.beginPath(); cx.arc(p.x, p.y, p.sz*Math.max(.2, p.life), 0, Math.PI*2); cx.fill();
    }
  }
  cx.globalAlpha = 1;
}

/* ══════════ 边界警告 ══════════ */
function drawBorderWarning(W, H){
  if(!player || !player.alive) return;
  const px=player.segs[0].x, py=player.segs[0].y;
  const warnDist = 200;
  const left   = Math.max(0, (warnDist-px)/warnDist);
  const right  = Math.max(0, (warnDist-(MAP-px))/warnDist);
  const top    = Math.max(0, (warnDist-py)/warnDist);
  const bottom = Math.max(0, (warnDist-(MAP-py))/warnDist);
  if(Math.max(left,right,top,bottom) <= 0) return;

  if(left>0 || right>0){
    const g = cx.createLinearGradient(0,0,W,0);
    if(left>0){g.addColorStop(0,`rgba(255,40,40,${left*.4})`);g.addColorStop(.15,'transparent');}
    if(right>0){g.addColorStop(.85,'transparent');g.addColorStop(1,`rgba(255,40,40,${right*.4})`);}
    cx.fillStyle = g; cx.fillRect(0,0,W,H);
  }
  if(top>0 || bottom>0){
    const g = cx.createLinearGradient(0,0,0,H);
    if(top>0){g.addColorStop(0,`rgba(255,40,40,${top*.4})`);g.addColorStop(.15,'transparent');}
    if(bottom>0){g.addColorStop(.85,'transparent');g.addColorStop(1,`rgba(255,40,40,${bottom*.4})`);}
    cx.fillStyle = g; cx.fillRect(0,0,W,H);
  }
}

  );
  cx.textAlign = 'left';

function drawMinimap(W, H){
  const ms=150, mx=W-ms-14, my=H-ms-14, sx=ms/MAP, sy=ms/MAP;
  cx.fillStyle = 'rgba(0,0,0,0.6)'; rrect(mx-4, my-4, ms+8, ms+8, 12); cx.fill();
  cx.fillStyle = '#0c1020'; rrect(mx, my, ms, ms, 8); cx.fill();
  // 网格
  cx.strokeStyle = 'rgba(255,255,255,0.04)'; cx.lineWidth = .5;
  for(let g=0; g<=MAP; g+=600){
    cx.beginPath(); cx.moveTo(mx+g*sx,my); cx.lineTo(mx+g*sx,my+ms); cx.stroke();
    cx.beginPath(); cx.moveTo(mx,my+g*sy); cx.lineTo(mx+ms,my+g*sy); cx.stroke();
  }
  // 发光边界
  cx.strokeStyle = 'rgba(233,69,96,0.6)'; cx.lineWidth = 2.5;
  cx.shadowColor = '#e94560'; cx.shadowBlur = 6;
  cx.strokeRect(mx+1, my+1, ms-2, ms-2);
  cx.shadowBlur = 0;
  // AI 蛇
  const teamOn = settings.teamMode;
  for(const s of snakes){
    if(!s.alive || s.isP) continue;
    const hx = mx+s.segs[0].x*sx, hy = my+s.segs[0].y*sy;
    const isTM = teamOn && s.team>0 && player && s.team===player.team;
    cx.globalAlpha = isTM ? .75 : .45;
    cx.fillStyle = isTM ? '#4488ff' : s.color;
    cx.beginPath(); cx.arc(hx, hy, isTM?3.5:2.5, 0, Math.PI*2); cx.fill();
  }
  cx.globalAlpha = 1;
  // 玩家
  if(player && player.alive){
    const ppx = mx+player.segs[0].x*sx;
    const ppy = my+player.segs[0].y*sy;
    const glowR = 8+Math.sin(Date.now()/300)*2;
    cx.globalAlpha = .25; cx.fillStyle = '#e94560';
    cx.beginPath(); cx.arc(ppx, ppy, glowR, 0, Math.PI*2); cx.fill();
    cx.globalAlpha = .12; cx.fillStyle = '#fff';
    cx.beginPath(); cx.arc(ppx, ppy, glowR*.6, 0, Math.PI*2); cx.fill();
    cx.globalAlpha = 1; cx.fillStyle = '#fff';
    cx.beginPath(); cx.arc(ppx, ppy, 4, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#e94560';
    cx.beginPath(); cx.arc(ppx, ppy, 2.5, 0, Math.PI*2); cx.fill();
    // 方向箭头
    const arrLen = 14;
    const ax = ppx+Math.cos(player.angle)*arrLen;
    const ay = ppy+Math.sin(player.angle)*arrLen;
    cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.globalAlpha = .85;
    cx.beginPath(); cx.moveTo(ppx,ppy); cx.lineTo(ax,ay); cx.stroke();
    const aL=5, aA=player.angle+Math.PI;
    cx.beginPath();
    cx.moveTo(ax,ay); cx.lineTo(ax+Math.cos(aA-.5)*aL, ay+Math.sin(aA-.5)*aL);
    cx.moveTo(ax,ay); cx.lineTo(ax+Math.cos(aA+.5)*aL, ay+Math.sin(aA+.5)*aL);
    cx.stroke();
  }
  cx.globalAlpha = 1;
  // 视野框
  cx.strokeStyle = 'rgba(255,255,255,0.3)'; cx.lineWidth = 1.5;
  cx.strokeRect(mx+(cam.x-W/2)*sx, my+(cam.y-H/2)*sy, W*sx, H*sy);
  // 危险箭头
  if(player && player.alive){
    const ppx=player.segs[0].x, ppy=player.segs[0].y;
    for(const s of snakes){
      if(!s.alive || s.isP) continue;
      const dx=s.segs[0].x-ppx, dy=s.segs[0].y-ppy;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist>800 || dist<150) continue;
      const angle = Math.atan2(dy, dx);
      const edgeX = Math.max(mx-2, Math.min(mx+ms+2, mx+ms/2+Math.cos(angle)*(ms/2+6)));
      const edgeY = Math.max(my-2, Math.min(my+ms+2, my+ms/2+Math.sin(angle)*(ms/2+6)));
      cx.fillStyle = 'rgba(255,80,80,0.7)';
      cx.beginPath();
      cx.moveTo(edgeX+Math.cos(angle)*5, edgeY+Math.sin(angle)*5);
      cx.lineTo(edgeX+Math.cos(angle+2.5)*4, edgeY+Math.sin(angle+2.5)*4);
      cx.lineTo(edgeX+Math.cos(angle-2.5)*4, edgeY+Math.sin(angle-2.5)*4);
      cx.closePath(); cx.fill();
    }
  }
  cx.fillStyle = 'rgba(255,255,255,0.45)';
  cx.font = 'bold 10px sans-serif'; cx.textAlign = 'center';
  cx.fillText('MAP', mx+ms/2, my-6);
}

   输 入（全部绑在 document 上，修复 PC 点击问题）

const keys = {};

// 鼠标移动 → 控制方向
document.addEventListener('mousemove', e => {
  if(!gameActive || !player || !player.alive) return;
  const dx = e.clientX - innerWidth/2;
  const dy = e.clientY - innerHeight/2;
  if(dx*dx+dy*dy > 225){
    tAngle = Math.atan2(dy, dx);
    player.tAngle = tAngle;
  }
});

// 鼠标按住 → 加速（排除 UI 元素）
document.addEventListener('mousedown', e => {
  if(!gameActive) return;
  // 不在 UI 元素上才触发
  if(e.target.closest('.overlay') || e.target.closest('.boost-btn')) return;
  boostHeld = true;
});
document.addEventListener('mouseup', () => { boostHeld = false; });

// 键盘
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(k==='arrowup')    keys['w'] = true;
  if(k==='arrowleft')  keys['a'] = true;
  if(k==='arrowdown')  keys['s'] = true;
  if(k==='arrowright') keys['d'] = true;
  if(k===' ' || k==='spacebar'){
    boostHeld = gameActive;
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if(k==='arrowup')    keys['w'] = false;
  if(k==='arrowleft')  keys['a'] = false;
  if(k==='arrowdown')  keys['s'] = false;
  if(k==='arrowright') keys['d'] = false;
  if(k===' ' || k==='spacebar') boostHeld = false;
});

function updateKeyboardAngle(){
  if(!gameActive || !player || !player.alive) return;
  let dx=0, dy=0;
  if(keys['w']) dy=-1;
  if(keys['s']) dy=1;
  if(keys['a']) dx=-1;
  if(keys['d']) dx=1;
  if(dx!==0 || dy!==0){
    tAngle = Math.atan2(dy, dx);
    player.tAngle = tAngle;
  }
}

// 触摸
document.addEventListener('touchstart', e => {
  if(!gameActive || !player || !player.alive) return;
  if(e.target.closest('.overlay') || e.target.closest('.boost-btn')) return;
  e.preventDefault();
  const t = e.touches[0];
  tAngle = Math.atan2(t.clientY-innerHeight/2, t.clientX-innerWidth/2);
  player.tAngle = tAngle;
}, {passive:false});

document.addEventListener('touchmove', e => {

/* ══════════ 胜利检测 ══════════ */
function checkVictory(){
  if(!player || !player.alive) return false;
  if(settings.teamMode){
    return snakes.filter(s=>s.alive && !s.isP && s.team!==player.team).length === 0;
  }
  const aliveBots = snakes.filter(s=>s.alive && !s.isP);
  return aliveBots.length===0 && snakes.length>1;
}

function showVictory(){
  gameActive = false;
  document.getElementById('endIcon').textContent = '🏆';
  document.getElementById('endTitle').textContent = '胜利！';
  document.getElementById('endTitle').className = 'title victory-title';
  document.getElementById('deathReason').textContent =
    settings.teamMode ? '你的队伍消灭了所有对手！' : '你击败了所有AI蛇！';
  captureScreenshot();
  document.getElementById('fScore').textContent = player.score;
  document.getElementById('fLen').textContent = player.segs.length;
  document.getElementById('fKills').textContent = player.kills;
  document.getElementById('gameOverScreen').classList.add('show');
  document.getElementById('reviveBtn').style.display = 'none';
  document.getElementById('restartBtn').textContent = '🔄 再来一局';
}

/* ══════════ 结束 / 重开 ══════════ */
function showOver(r, s){
  gameActive = false;
  document.getElementById('endIcon').textContent = '💀';
  document.getElementById('endTitle').textContent = '游戏结束';
  document.getElementById('endTitle').className = 'title';
  document.getElementById('deathReason').textContent = r;
  document.getElementById('fScore').textContent = s.score;
  document.getElementById('fLen').textContent = s.segs.length;
  document.getElementById('fKills').textContent = s.kills;
  document.getElementById('gameOverScreen').classList.add('show');

  const reviveBtn = document.getElementById('reviveBtn');
  const reviveCountEl = document.getElementById('reviveCount');
  const canRevive = revives < MAX_REVIVES && (!settings.huntMode || s.segs.length >= HUNT_MIN_LEN);
  reviveCountEl.textContent = MAX_REVIVES - revives;
  reviveBtn.disabled = !canRevive;
  reviveBtn.style.display = canRevive ? 'block' : 'none';
  if(settings.huntMode && s.segs.length < HUNT_MIN_LEN){
    document.getElementById('deathReason').textContent += '（太短了，无法复活）';
  }
  captureScreenshot();
  document.getElementById('keyHints').classList.remove('show');
  document.getElementById('huntTag').classList.remove('show');
  document.getElementById('teamTag').classList.remove('show');
}

/* ═══════════════════════════════════════
   主 循 环
   ═══════════════════════════════════════ */
function loop(){
  updateKeyboardAngle();
  for(const s of snakes){
    if(!s.alive){
      if(!s.isP && !s.permanentDeath){ s.rt -= 16; if(s.rt<=0) respawnBot(s); }
      continue;
    }
    if(s.invuln > 0) s.invuln--;
    if(!s.isP) updateAI(s);
    updateBoost(s);
    moveSnake(s);
  }
  checkHit();
  ensureFood();
  updateParts();
  updateShake();
  updateCam();
  render();
  // 胜利检测
  if(!victoryChecked && player && player.alive && snakes.length>1){
    if(checkVictory()){
      victoryChecked = true;
      setTimeout(()=>showVictory(), 500);
    }
  }
  animId = requestAnimationFrame(loop);
}

/* ══════════ 复活 ══════════ */
function revivePlayer(){
  let x, y, ok;
  for(let t=0; t<50; t++){
    x = 300+Math.random()*(MAP-600);
    y = 300+Math.random()*(MAP-600);
    ok = true;
    for(const o of snakes){
      if(!o.alive || o===player) continue;
      if((x-o.segs[0].x)**2+(y-o.segs[0].y)**2 < 280*280){ok=false;break;}
    }
    if(ok) break;
  }
  const a = Math.random()*Math.PI*2;
  const reviveLen = settings.huntMode
    ? Math.max(HUNT_MIN_LEN, Math.floor(player.segs.length/2))
    : INIT_L;
  player.segs = [];
  for(let i=0; i<reviveLen; i++)
    player.segs.push({x:x-Math.cos(a)*i*SG, y:y-Math.sin(a)*i*SG});
  player.angle=a; player.tAngle=a; player.speed=SPD;
  player.alive=true; player.boost=false; player.bc=0;
  player.score = Math.floor(player.score/2);
  player.invuln = INVULN_T*2;
  player.permanentDeath = false;
  cam.x = player.segs[0].x;
  cam.y = player.segs[0].y;
  gameActive = true;
  document.getElementById('huntTag').classList.toggle('show', settings.huntMode);
  document.getElementById('teamTag').classList.toggle('show', settings.teamMode);
  document.getElementById('keyHints').classList.toggle('show', isPC);
}

/* ══════════ 开始游戏 ══════════ */
function startGame(){
  snakes=[]; foods=[]; particles=[];
  revives=0; victoryChecked=false;
  killFeedEl.innerHTML = '';

  const teamOn = settings.teamMode;
  const playerTeam = teamOn ? 1 : 0;
  player = mkSnake('玩家', '#e94560', true, .5, playerTeam);
  snakes.push(player);

  // 创建 AI 蛇（2~18，每种最多3条）
  const botCount = Math.min(settings.botCount, MAX_BOTS);
  let created = 0;
  while(created < botCount){
    for(let t=0; t<BOT_CFG.length && created<botCount; t++){
      const b = BOT_CFG[t];
      const copies = Math.min(COPIES_PER_TYPE, botCount - created);
      for(let c=0; c<copies && created<botCount; c++){
        const suffix = c===0 ? '' : '·'+(c+1);
        const botTeam = teamOn ? (created < botCount/2 ? 1 : 2) : 0;
        const botColor = teamOn ? TEAM_COLORS[botTeam-1] : b.color;
        snakes.push(mkSnake(b.name+suffix, botColor, false, b.aggr, botTeam));
        created++;
      }
    }
  }

  if(teamOn) player.color = TEAM_COLORS[0];
  ensureFood();
  cam.x = player.segs[0].x;
  cam.y = player.segs[0].y;
  gameActive = true;

  document.getElementById('huntTag').classList.toggle('show', settings.huntMode);
  document.getElementById('teamTag').classList.toggle('show', teamOn);
  document.getElementById('keyHints').classList.toggle('show', isPC);
  document.getElementById('screenshotBox').style.display = 'none';
  document.getElementById('downloadBtn').style.display = 'none';

  if(animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

/* ══════════ 初始背景 ══════════ */
(function initBg(){
  resize();
  cx.fillStyle = '#0c1020';
  cx.fillRect(0, 0, innerWidth, innerHeight);
  cx.strokeStyle = 'rgba(255,255,255,0.02)';
  cx.lineWidth = 1;
  cx.beginPath();
  for(let x=0; x<innerWidth; x+=80){cx.moveTo(x,0);cx.lineTo(x,innerHeight);}
  for(let y=0; y<innerHeight; y+=80){cx.moveTo(0,y);cx.lineTo(innerWidth,y);}
  cx.stroke();
})();

})();
</script>
