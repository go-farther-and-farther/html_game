<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨夜のガソリンスタンド</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060a12; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(3,6,13,0.55) 100%);
  }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         color: #9fb6c9; font: 14px/1.6 sans-serif; text-align: center; padding: 2em; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="vignette"></div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

let tGlobal = 0;
try {

/* ================= renderer / scene / camera ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0c1424, 120, 440);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 700);
camera.position.set(46, 24, 52);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 10;
controls.maxDistance = 220;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.45;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.addEventListener('start', () => { controls.autoRotate = false; });

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.4, 0.68);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
window.__dbg = { scene, camera, controls, renderer };

/* ================= helpers ================= */
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","MS PGothic",sans-serif';
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (draw) draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.userData = { canvas: c, ctx };
  return t;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// toon material with soft rim (inverted fresnel darkening = 轮廓感)
const toonGradient = (() => {
  const d = new Uint8Array([70, 150, 235, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RedFormat);
  t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();
function toon(color, opts = {}) {
  const { rim = 0.3, ...rest } = opts;
  const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: toonGradient }, rest));
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uRimStr = { value: rim };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vRimWPos; varying vec3 vRimWN;')
      .replace('#include <worldpos_vertex>',
        '#include <worldpos_vertex>\nvRimWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvRimWN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vRimWPos; varying vec3 vRimWN;\nuniform float uRimStr;')
      .replace('#include <dithering_fragment>', `{
  vec3 rimV = normalize(cameraPosition - vRimWPos);
  float rimF = pow(1.0 - saturate(dot(rimV, vRimWN)), 3.0) * uRimStr;
  gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.02, 0.04, 0.08), rimF);
}
#include <dithering_fragment>`);
  };
  return m;
}
// inverted-hull outline
const outlineBase = new THREE.MeshBasicMaterial({ color: 0x0a0f16, side: THREE.BackSide });
function addOutline(mesh, thick = 0.05) {
  const mat = new THREE.MeshBasicMaterial({ color: 0x0a0f16, side: THREE.BackSide });
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>\ntransformed += normal * ${thick.toFixed(4)};`);
  };
  const o = new THREE.Mesh(mesh.geometry, mat);
  o.castShadow = false; o.receiveShadow = false;
  mesh.add(o);
  return o;
}
function box(w, h, d, mat, x, y, z, parent = scene, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function plane(w, h, mat, x, y, z, rotY = 0, rotX = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.rotation.set(rotX, rotY, 0);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
function cyl(rt, rb, h, mat, x, y, z, seg = 12, parent = scene) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
// glow sprite + ground light pool
const glowTex = canvasTex(128, 128, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}, false);
const poolTex = canvasTex(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.55, 'rgba(255,255,255,0.28)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}, false);
function glow(color, scale, x, y, z, opacity = 0.5) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s.scale.set(scale, scale, 1);
  s.position.set(x, y, z);
  s.renderOrder = 30;
  scene.add(s);
  return s;
}
function pool(color, sx, sz, x, z, opacity = 0.15) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(sx, sz).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: poolTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.set(x, 0.09, z);
  m.renderOrder = 5;
  scene.add(m);
  return m;
}
function wire(p1, p2, sag = 0.5, r = 0.028, mat) {
  const mid = p1.clone().lerp(p2, 0.5); mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, r, 5, false), mat || new THREE.MeshBasicMaterial({ color: 0x0d1116 }));
  scene.add(m);
  return m;
}
function tubeBetween(p1, p2, r, mat, parent) {
  const v1 = new THREE.Vector3(...p1), v2 = new THREE.Vector3(...p2);
  const d = v2.clone().sub(v1);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat);
  m.position.copy(v1).add(v2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  m.castShadow = true;
  parent.add(m);
  return m;
}

/* ================= night sky background ================= */
scene.background = canvasTex(512, 512, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#111b30'); g.addColorStop(0.6, '#0c1424'); g.addColorStop(1, '#070d18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const r = ctx.createRadialGradient(w * 0.5, h * 0.62, 10, w * 0.5, h * 0.62, w * 0.55);
  r.addColorStop(0, 'rgba(52,72,110,0.55)'); r.addColorStop(1, 'rgba(52,72,110,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, w, h);
});

/* ================= diorama base + ground ================= */
const groundTex = canvasTex(2048, 2048, drawGround);
groundTex.anisotropy = 8;

function drawGround(ctx, W, H) {
  const S = W / 84;
  const X = (x) => (x + 42) * S;
  const Z = (z) => (z + 42) * S;
  const U = (u) => u * S;
  // sidewalk base + joints
  ctx.fillStyle = '#3e4550';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(16,20,26,0.16)';
  ctx.lineWidth = 2;
  for (let v = -42; v <= 42; v += 1.5) {
    ctx.beginPath(); ctx.moveTo(X(v), 0); ctx.lineTo(X(v), H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, Z(v)); ctx.lineTo(W, Z(v)); ctx.stroke();
  }
  // 加油站前庭
  ctx.fillStyle = '#565d66';
  ctx.fillRect(X(-26), Z(-21), U(36), U(34));
  ctx.fillStyle = 'rgba(16,20,26,0.4)';
  ctx.beginPath(); ctx.ellipse(X(-10), Z(-2), U(2.2), U(1.4), 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(X(-1), Z(-2.6), U(1.8), U(1.2), 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(X(-5.5), Z(6), U(2.6), U(1.6), 0.2, 0, Math.PI * 2); ctx.fill();
  // 出口箭头 ×2
  ctx.fillStyle = 'rgba(220,226,232,0.75)';
  [[-13.5], [-5.5]].forEach(([x]) => {
    ctx.fillRect(X(x - 0.3), Z(7.6), U(0.6), U(2.4));
    ctx.beginPath();
    ctx.moveTo(X(x - 0.9), Z(10.0)); ctx.lineTo(X(x), Z(12.0)); ctx.lineTo(X(x + 0.9), Z(10.0));
    ctx.closePath(); ctx.fill();
  });
  // 加油岛安全黄线
  ctx.strokeStyle = 'rgba(217,176,46,0.55)';
  ctx.lineWidth = U(0.14);
  ctx.strokeRect(X(-10.6), Z(-6.2), U(1.2), U(6.4));
  ctx.strokeRect(X(-1.6), Z(-6.2), U(1.2), U(6.4));
  // alley floor
  ctx.fillStyle = '#2a3140';
  ctx.fillRect(X(-32), Z(-22), U(8), U(30));
  ctx.fillStyle = 'rgba(20,24,32,0.35)';
  ctx.beginPath(); ctx.ellipse(X(-29), Z(-4), U(3), U(2), 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(X(-28), Z(4), U(2), U(1.5), 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#262d38';
  ctx.fillRect(X(-32), Z(5.6), U(8), U(0.4));
  // roads
  const asphalt = (x0, z0, x1, z1) => {
    ctx.fillStyle = '#1c232d';
    ctx.fillRect(X(x0), Z(z0), U(x1 - x0), U(z1 - z0));
    for (let i = 0; i < 380; i++) {
      const x = x0 + Math.random() * (x1 - x0);
      const z = z0 + Math.random() * (z1 - z0);
      ctx.fillStyle = Math.random() < 0.5 ? 'rgba(14,18,25,0.5)' : 'rgba(44,54,68,0.4)';
      ctx.fillRect(X(x), Z(z), 1.6, 1.6);
    }
  };
  asphalt(-42, 13, 42, 25);
  asphalt(13, -42, 25, 25);
  // parking area
  ctx.fillStyle = '#242b36';
  ctx.fillRect(X(26), Z(-8), U(7), U(10));
  ctx.strokeStyle = 'rgba(205,212,218,0.75)';
  ctx.lineWidth = U(0.18);
  [-8, -5.3, -2.6, 0.1].forEach(z => {
    ctx.beginPath(); ctx.moveTo(X(26), Z(z)); ctx.lineTo(X(31), Z(z)); ctx.stroke();
  });
  ctx.beginPath(); ctx.moveTo(X(31), Z(-8)); ctx.lineTo(X(31), Z(0.1)); ctx.stroke();
  ctx.fillStyle = '#2b4a7a';
  ctx.beginPath(); ctx.arc(X(37), Z(-4), U(1.3), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#eef2f5';
  ctx.font = `bold ${U(1.5)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('P', X(37), Z(-4) + U(0.06));
  // lane markings
  ctx.strokeStyle = 'rgba(201,207,214,0.7)';
  ctx.lineWidth = U(0.18);
  ctx.setLineDash([U(2.2), U(2.2)]);
  ctx.beginPath(); ctx.moveTo(X(-40), Z(19)); ctx.lineTo(X(12.6), Z(19)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(25.4), Z(19)); ctx.lineTo(X(40), Z(19)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(19), Z(-40)); ctx.lineTo(X(19), Z(12.6)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = U(0.16);
  ctx.strokeStyle = 'rgba(201,207,214,0.55)';
  const seg = (x1, z1, x2, z2) => { ctx.beginPath(); ctx.moveTo(X(x1), Z(z1)); ctx.lineTo(X(x2), Z(z2)); ctx.stroke(); };
  seg(-42, 13.5, 12.6, 13.5); seg(25.4, 13.5, 42, 13.5);
  seg(-42, 24.5, 12.6, 24.5); seg(25.4, 24.5, 42, 24.5);
  seg(13.5, -42, 13.5, 12.6); seg(24.5, -42, 24.5, 12.6);
  // crosswalks
  ctx.fillStyle = 'rgba(215,221,226,0.85)';
  for (let x = 13.8; x < 24.2; x += 2.2) { rr(ctx, X(x), Z(8.9), U(1.0), U(3.7), U(0.5)); ctx.fill(); }
  for (let z = 13.8; z < 24.2; z += 2.2) { rr(ctx, X(8.9), Z(z), U(3.7), U(1.0), U(0.5)); ctx.fill(); }
  // gutters along curbs
  ctx.fillStyle = '#161c24';
  ctx.fillRect(X(-42), Z(24.4), U(84), U(0.7));
  ctx.fillRect(X(24.4), Z(-42), U(0.7), U(67.4));
  ctx.strokeStyle = 'rgba(70,80,94,0.8)';
  ctx.lineWidth = 2;
  for (let x = -42; x < 42; x += 1.2) { ctx.beginPath(); ctx.moveTo(X(x), Z(24.45)); ctx.lineTo(X(x), Z(25.05)); ctx.stroke(); }
  for (let z = -42; z < 24.4; z += 1.2) { ctx.beginPath(); ctx.moveTo(X(24.45), Z(z)); ctx.lineTo(X(25.05), Z(z)); ctx.stroke(); }
  // catch basin at corner
  ctx.fillStyle = '#10151b';
  ctx.fillRect(X(23.3), Z(23.3), U(1.6), U(1.6));
  ctx.strokeStyle = 'rgba(80,92,108,0.9)';
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(X(23.5), Z(23.6 + i * 0.35)); ctx.lineTo(X(24.7), Z(23.6 + i * 0.35)); ctx.stroke(); }
  // manholes
  const manhole = (x, z, r) => {
    ctx.fillStyle = '#1a2027';
    ctx.beginPath(); ctx.arc(X(x), Z(z), U(r), 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#39424e'; ctx.lineWidth = U(0.12);
    ctx.beginPath(); ctx.arc(X(x), Z(z), U(r), 0, Math.PI * 2); ctx.stroke();
  };
  manhole(-24, 19, 1.0);
  manhole(31, 18, 1.0);
  // tactile paving strips
  ctx.fillStyle = 'rgba(168,144,58,0.4)';
  ctx.fillRect(X(-42), Z(12.2), U(54.6), U(0.8));
  ctx.fillRect(X(12.2), Z(-42), U(0.8), U(54.6));
  ctx.fillRect(X(-42), Z(25.4), U(54.6), U(0.8));
  ctx.fillRect(X(25.4), Z(-42), U(0.8), U(54.6));
}

// base slab(镜像渲染时需隐藏,否则底座底面挡住反射视野)
const baseSide = toon(0x232b36, { rim: 0.25 });
const baseParts = [];
baseParts.push(box(84, 6, 84, baseSide, 0, -3, 0));
const groundMat = toon(0xffffff, { map: groundTex, rim: 0.15 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(84, 84).rotateX(-Math.PI / 2), groundMat);
ground.position.y = 0.01;
ground.receiveShadow = true;
scene.add(ground);
baseParts.push(ground);
baseParts.push(box(90, 2.6, 90, toon(0x151b24, { rim: 0.2 }), 0, -7.3, 0));
baseParts.push(box(85.2, 0.5, 0.9, toon(0x3a4450), 0, -0.25, 42.2));
baseParts.push(box(85.2, 0.5, 0.9, toon(0x3a4450), 0, -0.25, -42.2));
baseParts.push(box(0.9, 0.5, 85.2, toon(0x3a4450), 42.2, -0.25, 0));
baseParts.push(box(0.9, 0.5, 85.2, toon(0x3a4450), -42.2, -0.25, 0));

/* ================= wet ground reflector ================= */
const R_COUNT = 12;
const ripples = Array.from({ length: R_COUNT }, () => new THREE.Vector4(0, 0, 0, -100));
let rippleIdx = 0;
function addRipple(x, z, s) {
  ripples[rippleIdx].set(x, z, s, tGlobal);
  rippleIdx = (rippleIdx + 1) % R_COUNT;
}

class WetReflector extends THREE.Mesh {
  constructor(size, height, resolution = 768) {
    const geo = new THREE.PlaneGeometry(size, size);
    geo.rotateX(-Math.PI / 2);
    super(geo, new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: null },
        uTexMatrix: { value: new THREE.Matrix4() },
        uTime: { value: 0 },
        uValid: { value: 1 },
        uRipples: { value: ripples }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        #define saturate(x) clamp(x, 0.0, 1.0)
        uniform sampler2D tDiffuse;
        uniform mat4 uTexMatrix;
        uniform float uTime;
        uniform float uValid;
        uniform vec4 uRipples[${R_COUNT}];
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          vec2 off = vec2(0.0);
          for (int i = 0; i < ${R_COUNT}; i++) {
            vec4 rp = uRipples[i];
            float age = uTime - rp.w;
            if (rp.z > 0.001 && age > 0.0 && age < 2.5) {
              vec2 d = vWorldPos.xz - rp.xy;
              float dist = length(d);
              float wave = dist - age * 2.6;
              float k = exp(-wave * wave * 22.0) * exp(-age * 2.1) * rp.z;
              off += (d / max(dist, 0.001)) * k * 0.35;
            }
          }
          off += 0.012 * vec2(sin(vWorldPos.x * 2.3 + uTime * 1.6), sin(vWorldPos.y * 1.7 - uTime * 1.2));
          vec4 rc = uTexMatrix * vec4(vWorldPos + vec3(off.x, 0.0, off.y), 1.0);
          vec3 refl = vec3(0.0);
          if (rc.w > 0.001) {
            refl = texture2D(tDiffuse, rc.xy / rc.w).rgb;
          }
          vec3 V = normalize(cameraPosition - vWorldPos);
          float fres = pow(1.0 - saturate(V.y), 1.7);
          float wet = (0.34 + fres * 0.55) * uValid;
          float edge = smoothstep(0.0, 0.05, min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y)));
          wet *= edge;
          gl_FragColor = vec4(refl, clamp(wet, 0.0, 0.9));
        }`,
      transparent: true,
      depthWrite: false
    }));
    this.position.y = height;
    this.renderOrder = 2;
    this.frustumCulled = false;
    this.height = height;
    this.target = new THREE.WebGLRenderTarget(resolution, resolution, { type: THREE.HalfFloatType });
    this.target.texture.generateMipmaps = false;
    this.mirrorCam = new THREE.PerspectiveCamera(60, 1, 0.5, 700);
    this.mirrorCam.matrixAutoUpdate = false;      // 防止 updateMatrix 用默认姿态覆盖镜像矩阵
    this.mirrorCam.matrixWorldAutoUpdate = false;
    this._M = new THREE.Matrix4().set(1, 0, 0, 0, 0, -1, 0, 2 * height, 0, 0, 1, 0, 0, 0, 0, 1);
    this._bias = new THREE.Matrix4().set(
      0.5, 0, 0, 0.5,
      0, 0.5, 0, 0.5,
      0, 0, 0.5, 0.5,
      0, 0, 0, 1);
    this._mirrorWorld = new THREE.Matrix4();
    this._texM = new THREE.Matrix4();
  }
  update(renderer, scn, cam, hideObjects = []) {
    const u = this.material.uniforms;
    u.uTime.value = tGlobal;
    const valid = cam.position.y > this.height + 0.3;
    u.uValid.value = valid ? 1 : 0;
    u.uTexMatrix.value.copy(this._texM.copy(cam.projectionMatrix).multiply(cam.matrixWorldInverse).multiply(this._M).premultiply(this._bias));
    if (!valid) return;
    this.mirrorCam.matrixWorld.copy(this._mirrorWorld.copy(this._M).multiply(cam.matrixWorld));
    this.mirrorCam.updateMatrixWorld();
    const oldVis = this.visible;
    this.visible = false;
    const hidden = [];
    for (const o of hideObjects) {
      if (o.visible) { o.visible = false; hidden.push(o); }
    }
    const oldRT = renderer.getRenderTarget();
    const oldAuto = renderer.autoClear;
    renderer.setRenderTarget(this.target);
    renderer.clear();
    renderer.render(scn, this.mirrorCam);
    renderer.setRenderTarget(oldRT);
    renderer.autoClear = oldAuto;
    for (const o of hidden) o.visible = true;
    this.visible = oldVis;
    u.tDiffuse.value = this.target.texture;
  }
}

const instMat = toon(0xffffff, { rim: 0.22 });
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
function makeInstanced(geo, list) {
  const m = new THREE.InstancedMesh(geo, instMat, list.length);
  list.forEach((it, i) => {
    dummy.position.set(it.x, it.y, it.z);
    dummy.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
    m.setColorAt(i, tmpColor.setHex(it.c !== undefined ? it.c : productColors[(Math.random() * productColors.length) | 0]));
  });
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.castShadow = false;
  scene.add(m);
  return m;
}

function streetLight(x, z, dirX, dirZ, withLight) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  scene.add(g);
  cyl(0.2, 0.24, 0.3, toon(0x3a4450, { rim: 0.35 }), 0, 0.15, 0, 10, g);
  const pole = cyl(0.09, 0.12, 6.2, toon(0x3a4450, { rim: 0.4 }), 0, 3.1, 0, 10, g);
  addOutline(pole, 0.03);
  const hx = dirX * 2.4, hz = dirZ * 2.4;
  tubeBetween([0, 6.2, 0], [hx, 6.45, hz], 0.07, toon(0x3a4450, { rim: 0.35 }), g);
  const head = box(1.1, 0.18, 0.55, toon(0x39424e, { rim: 0.4 }), hx, 6.38, hz, g);
  head.rotation.y = Math.atan2(dirX, dirZ);
  const lampMat = new THREE.MeshBasicMaterial();
  lampMat.color.setRGB(1.9, 1.55, 1.05);
  const lamp = plane(1.0, 0.45, lampMat, hx, 6.27, hz, Math.atan2(dirX, dirZ), -Math.PI / 2, g);
  const gl = glow(new THREE.Color(1.7, 1.35, 0.9), 5, x + hx, 6.1, z + hz, 0.45);
  const pl = pool(new THREE.Color(0.95, 0.78, 0.5), 9, 9, x + hx * 1.1, z + hz * 1.1, 0.15);
  if (withLight) {
    const pt = new THREE.PointLight(0xffdfae, 60, 22, 2);
    pt.position.set(x + hx, 5.8, z + hz);
    scene.add(pt);
  }
  return { gl, pl };
}

function makeRain(n, yMax, sMin, sMax, lMin, lMax, opacity) {
  const pos = new Float32Array(n * 6);
  const data = [];
  for (let i = 0; i < n; i++) {
    data.push({
      x: (Math.random() * 2 - 1) * 64, z: (Math.random() * 2 - 1) * 64,
      y: Math.random() * yMax,
      s: sMin + Math.random() * (sMax - sMin),
      l: lMin + Math.random() * (lMax - lMin)
    });
  }
  const g = new THREE.BufferGeometry();
  const attr = new THREE.BufferAttribute(pos, 3);
  attr.setUsage(THREE.DynamicDrawUsage);
  g.setAttribute('position', attr);
  const lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xaecdea, transparent: true, opacity, depthWrite: false }));
  lines.frustumCulled = false;
  lines.renderOrder = 20;
  scene.add(lines);
  return { lines, data, attr, yMax };
}

function updateRain(r, dt) {
  const a = r.attr.array;
  for (let i = 0; i < r.data.length; i++) {
    const d = r.data[i];
    d.y -= d.s * dt;
    if (d.y < -1) {
      d.y = r.yMax + Math.random() * 5;
      d.x = (Math.random() * 2 - 1) * 64;
      d.z = (Math.random() * 2 - 1) * 64;
    }
    const o = i * 6;
    a[o] = d.x; a[o + 1] = d.y; a[o + 2] = d.z;
    a[o + 3] = d.x - d.l * 0.16; a[o + 4] = d.y - d.l; a[o + 5] = d.z + d.l * 0.05;
  }
  r.attr.needsUpdate = true;
}

/* ================= rain streaks on glass ================= */
class GlassStreaks {
  constructor(count = 26) {
    this.c = document.createElement('canvas');
    this.c.width = 256; this.c.height = 1024;
    this.ctx = this.c.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.c);
    this.tex.colorSpace = THREE.SRGBColorSpace;
    this.drops = Array.from({ length: count }, () => this.spawn(true));
  }
  spawn(anyY) {
    return { x: Math.random() * this.c.width, y: anyY ? Math.random() * this.c.height : -20, len: 30 + Math.random() * 90, sp: 14 + Math.random() * 36, r: 1 + Math.random() * 1.6 };
  }
  update(dt) {
    const ctx = this.ctx, c = this.c;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineCap = 'round';
    for (const d of this.drops) {
      d.y += d.sp * dt;
      if (d.y > c.height + 40) Object.assign(d, this.spawn(false));
      const grad = ctx.createLinearGradient(d.x, d.y - d.len, d.x, d.y);
      grad.addColorStop(0, 'rgba(190,220,240,0)');
      grad.addColorStop(1, 'rgba(200,228,245,0.28)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = d.r;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y - d.len);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(215,238,250,0.5)';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    this.tex.needsUpdate = true;
  }
}

/* ================= flicker helpers ================= */
function makeFlicker(seed, base) {
  let nextDip = 1 + Math.random() * 4, dipUntil = 0;
  return (t) => {
    if (t > nextDip) {
      nextDip = t + 3 + Math.random() * 7;
      dipUntil = t + 0.06 + Math.random() * 0.18;
    }
    let v = 0.93 + 0.05 * Math.sin(t * 8.7 + seed * 7) + 0.04 * Math.sin(t * 21.3 + seed * 3);
    if (t < dipUntil) v *= 0.45 + 0.3 * Math.sin(t * 90);
    return base * v;
  };
}
const flickSign = makeFlicker(1, 1.6);
const flickEast = makeFlicker(2, 1.6);
const flickBlade = makeFlicker(3, 1.7);
const flickOpen = makeFlicker(4, 1.5);
const flickVend = makeFlicker(5, 1.35);
const flickBentoBox = makeFlicker(6, 1.25);
const flickCofBox = makeFlicker(7, 1.25);

const easeInOut = (x) => x * x * (3 - 2 * x);
function doorAmount(t) {
  const c = t % 12;
  if (c < 6.5) return 0;
  if (c < 7.5) return easeInOut(c - 6.5);
  if (c < 9.5) return 1;
  if (c < 10.5) return 1 - easeInOut(c - 9.5);
  return 0;
}
function trafficState(t) {
  const c = (t + 2) % 9;
  if (c < 4.2) return 0;
  if (c < 5.4) return 1;
  return 2;
}

/* ================= animation loop ================= */
const clock = new THREE.Clock();
let ambientRippleT = 0;
let lastTraffic = -1;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  tGlobal += dt;
  const t = tGlobal;

  controls.update();
  camera.updateMatrixWorld();

  // rain
  updateRain(rainFar, dt);
  updateRain(rainNear, dt);

  // drips
  for (const p of dripPoints) {
    if (t >= p.next) {
      p.next = t + p.period * (0.7 + Math.random() * 0.6);
      const d = drops.find(d => !d.active);
      if (d) {
        d.active = true; d.m.visible = true;
        d.m.position.set(p.x, p.y, p.z);
        d.vy = 0; d.gy = p.gy;
        d.lx = p.x; d.lz = p.z;
      }
    }
  }
  for (const d of drops) {
    if (!d.active) continue;
    d.vy -= 25 * dt;
    d.m.position.y += d.vy * dt;
    if (d.m.position.y <= d.gy) {
      d.active = false; d.m.visible = false;
      splash(d.lx, d.lz, 0.5);
    }
  }
  for (const r of rings) {
    if (r.t >= 1) continue;
    r.t += dt / 0.45;
    if (r.t >= 1) { r.m.visible = false; continue; }
    const s = 0.1 + r.t * 0.9;
    r.m.scale.set(s, 1, s);
    r.m.material.opacity = 0.5 * (1 - r.t);
  }
  // ambient rain ripples
  ambientRippleT += dt;
  if (ambientRippleT > 0.22) {
    ambientRippleT = 0;
    let x, z;
    const r = Math.random();
    if (r < 0.4) { x = -55 + Math.random() * 110; z = 21 + Math.random() * 16; }
    else if (r < 0.75) { x = 21 + Math.random() * 16; z = -55 + Math.random() * 90; }
    else { x = -55 + Math.random() * 110; z = -55 + Math.random() * 110; }
    addRipple(x, z, 0.07 + Math.random() * 0.07);
  }

  // automatic door
  const a = doorAmount(t);
  doorL.position.x = -14.26 - 1.5 * a;
  doorR.position.x = -12.74 + 1.5 * a;

  // flicker
  signMat.color.setScalar(flickSign(t));
  signGlow.material.opacity = 0.32 * (signMat.color.r / 1.6);
  eastSignMat.color.setScalar(flickEast(t));
  bladeMat.color.setScalar(flickBlade(t));
  open24Mat.color.setScalar(flickOpen(t));
  vendMat.color.setScalar(flickVend(t));
  bentoBoxMat.color.setScalar(flickBentoBox(t));
  cofBoxMat.color.setScalar(flickCofBox(t));

  // traffic light
  const st = trafficState(t);
  if (st !== lastTraffic) {
    lastTraffic = st;
    traffic.mats.forEach((m, i) => {
      m.color.copy(i === st ? traffic.colors[st] : new THREE.Color(0x1c232b));
    });
    traffic.glow.material.color.copy(traffic.colors[st]);
    traffic.glow.material.opacity = 0.3;
  }
  traffic.glow.material.opacity = 0.22 + 0.1 * Math.sin(t * 2.2);

  // steam
  for (const st2 of steams) {
    const p = (t * 0.33 + st2.ph) % 1;
    st2.s.position.y = 1.62 + p * 1.0;
    const sc = 0.22 + p * 0.55;
    st2.s.scale.set(sc, sc, 1);
    st2.s.material.opacity = (1 - p) * 0.32;
  }

  // street lamp pools breathing
  sl1.pl.material.opacity = 0.14 + 0.02 * Math.sin(t * 3.1);
  sl2.pl.material.opacity = 0.13 + 0.02 * Math.sin(t * 2.6 + 2);

  // glass streaks
  streaksS.update(dt);
  streaksE.update(dt);

  wetGround.update(renderer, scene, camera, mirrorHide);
  composer.render();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

} catch (e) {
  const err = document.getElementById('err');

}
