<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<title>元素哨站 · Elemental Outpost</title>
<style>
/* ============================================================
   主题变量 + 响应式布局
   ============================================================ */
:root{
  --bg:#0b1017;--panel:#131a24;--card:#182130;
  --text:#e7edf6;--muted:#9fb0c6;--accent:#4ea1ff;
  --good:#46d38a;--bad:#ff5d6c;--gold:#ffd257;
  --border:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.45);
}
body.light{
  --bg:#eef1f6;--panel:#fff;--card:#eaf0f8;
  --text:#1a2330;--muted:#5b6b80;--accent:#2f7fe0;
  --good:#1faa68;--bad:#e04757;--gold:#c98a00;
  --border:rgba(0,0,0,.10);--shadow:0 10px 26px rgba(30,50,80,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;overflow-x:hidden;}
body{display:flex;align-items:center;justify-content:center;padding:10px;}

#app{display:flex;gap:12px;align-items:flex-start;max-width:1120px;width:100%;}

/* 画布容器：桌面 900px 固定；移动端 100% 宽 + 自动高度 */
#stage{position:relative;width:900px;max-width:100%;aspect-ratio:900/600;
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  border:1px solid var(--border);background:#0f1620;flex-shrink:1;}
canvas#game{display:block;width:100%;height:100%;touch-action:manipulation;cursor:crosshair;}

/* 右侧面板 */
#side{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:10px;box-shadow:var(--shadow);}
.brand{font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px;}
.brand small{color:var(--muted);font-weight:500;font-size:10px;margin-left:auto;}
.chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 7px;width:100%;}
.stat-row{display:flex;justify-content:space-between;font-size:12px;padding:1px 3px;}
.stat-row b{font-variant-numeric:tabular-nums;font-weight:700;}
h3.sec{margin:3px 2px 0;font-size:10px;color:var(--muted);letter-spacing:.5px;}

/* 塔卡片 2×2 网格 */
.tower-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.tower-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;
  border-radius:8px;cursor:pointer;background:var(--card);border:2px solid transparent;
  transition:border-color .1s;user-select:none;touch-action:manipulation;}
.tower-card:hover{border-color:var(--muted);}
.tower-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(78,161,255,.2) inset;}
.tower-card canvas{width:36px;height:36px;border-radius:6px;}
.tc-name{font-size:11px;font-weight:700;}
.tc-cost{font-size:10px;color:var(--gold);font-weight:700;}

#selInfo{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:7px;font-size:11px;min-height:72px;}
#selInfo .row{display:flex;justify-content:space-between;margin:2px 0;color:var(--muted);}
#selInfo .row b{color:var(--text);}
#selTitle{font-weight:800;font-size:12px;margin-bottom:3px;}

button{font-family:inherit;color:var(--text);cursor:pointer;border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border-radius:8px;padding:7px 8px;font-size:12px;font-weight:600;
  transition:filter .1s;touch-action:manipulation;min-height:36px;}
button:hover{filter:brightness(1.12);}
button:disabled{opacity:.35;cursor:not-allowed;}
button.primary{background:linear-gradient(180deg,var(--accent),#2f7fe0);color:#fff;border-color:transparent;}
body.light button.primary{background:linear-gradient(180deg,#3a8af0,#2f7fe0);}
.btn-full{width:100%;}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.seg{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.seg button{border:none;border-radius:0;padding:4px 6px;background:transparent;font-size:11px;min-height:30px;}
.seg button.on{background:var(--accent);color:#fff;}

/* ---------- 移动端 (< 960px) ---------- */
@media(max-width:960px){
  #app{flex-direction:column;align-items:center;}
  #stage{width:100%;}
  #side{width:100%;max-width:520px;}
  .tower-grid{grid-template-columns:1fr 1fr;}
  .tower-card{padding:7px 5px;}
  .tower-card canvas{width:42px;height:42px;}
  .tc-name{font-size:12px;}
  button{min-height:42px;font-size:13px;}
  .seg button{min-height:36px;font-size:12px;}
}
@media(max-width:480px){
  body{padding:4px;}
  #side{padding:8px;gap:6px;}
  .stat-row{font-size:11px;}
  .tower-card canvas{width:34px;height:34px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" width="900" height="600"></canvas></div>

  <aside id="side">
    <div class="brand">🛰️ 元素哨站 <small>v3.0</small></div>
    <div class="chip">
      <div class="stat-row"><span>💰 积分</span><b id="uiScore">200</b></div>
      <div class="stat-row"><span>❤️ 生命</span><b id="uiLives" style="color:var(--bad)">15</b></div>
      <div class="stat-row"><span>🌊 波次</span><b id="uiWave">—</b></div>
      <div class="stat-row"><span>🗺️ 关卡</span><b id="uiMap">—</b></div>
    </div>

    <h3 class="sec">建造塔（点击 / 按 1-4）</h3>
    <div class="tower-grid">
      <div class="tower-card" id="card-arrow"><canvas width="44" height="44"></canvas><span class="tc-name">🏹 箭塔</span><span class="tc-cost">💰60</span></div>
      <div class="tower-card" id="card-cannon"><canvas width="44" height="44"></canvas><span class="tc-name">💣 炮塔</span><span class="tc-cost">💰90</span></div>
      <div class="tower-card" id="card-ice"><canvas width="44" height="44"></canvas><span class="tc-name">🧊 冰霜塔</span><span class="tc-cost">💰80</span></div>
      <div class="tower-card" id="card-poison"><canvas width="44" height="44"></canvas><span class="tc-name">☠️ 毒雾塔</span><span class="tc-cost">💰70</span></div>
    </div>

    <h3 class="sec">当前选中塔</h3>
    <div id="selInfo"></div>

    <button class="primary btn-full" id="btnNextWave">▶ 下一波（跳过等待）</button>
    <div class="btn-grid">
      <button id="btnReset">🔄 重置</button>
      <button id="btnMap">🗺️ 选关</button>
    </div>
    <div class="btn-grid">
      <button id="btnTheme" style="grid-column:1/3">🌗 明/暗</button>
    </div>

    <h3 class="sec">速度</h3>
    <div class="seg" id="speedSeg">
      <button data-sp="0.5">慢</button><button data-sp="1" class="on">正常</button><button data-sp="2">快</button>
    </div>
    <h3 class="sec">难度</h3>
    <div class="seg" id="diffSeg">
      <button data-df="easy">简单</button><button data-df="normal" class="on">普通</button><button data-df="hard">困难</button>
    </div>
  </aside>
</div>

<script>
(()=>{
'use strict';
/* ====================================================================
 *  元素哨站 v3 —— 单文件塔防
 *  特性：4 种塔（箭/炮/冰霜/毒雾）、6 种敌人（含护盾/疾风/BOSS）、
 *  3 张关卡、更陡成长曲线、移动端适配（画布缩放 + 坐标映射）。
 * ==================================================================== */

/* ---- 常量 ---- */
const CELL=45,COLS=20,ROWS=12,GRID_Y0=60;
const MAP_W=COLS*CELL,MAP_H=ROWS*CELL;
const STEP=1/60,MAX_STEPS=6,PREP_FRAMES=5*60;
const cx=c=>c*CELL+CELL/2, cy=r=>GRID_Y0+r*CELL+CELL/2;

/* ---- 关卡定义 ---- */
const MAPS=[
  {id:0,name:'绿野哨站',stars:1,desc:'经典 S 形 · 入门',
   points:[[0,5],[8,5],[8,9],[19,9]],
   hpMul:1.0,countAdd:0,spawnBase:40,
   pal:{dark:{tA:'#173a2c',tB:'#153327',pA:'#5b4a37',pE:'#8a6d4e'},
        light:{tA:'#bcdcb2',tB:'#b1d4a7',pA:'#d9c08e',pE:'#b79356'}}},
  {id:1,name:'峡谷回廊',stars:2,desc:'多折回廊 · 路径更长',
   points:[[0,2],[5,2],[5,9],[11,9],[11,3],[16,3],[16,9],[19,9]],
   hpMul:1.3,countAdd:1,spawnBase:36,
   pal:{dark:{tA:'#12303a',tB:'#0f2a33',pA:'#54606e',pE:'#7d8b9c'},
        light:{tA:'#b5cfe0',tB:'#a8c6da',pA:'#c9c2b2',pE:'#9d957f'}}},
  {id:2,name:'熔岩迷城',stars:3,desc:'迷宫深巷 · 高压',
   points:[[0,1],[4,1],[4,10],[9,10],[9,4],[14,4],[14,8],[17,8],[17,9],[19,9]],
   hpMul:1.55,countAdd:2,spawnBase:32,
   pal:{dark:{tA:'#2a1520',tB:'#241119',pA:'#6e3a2a',pE:'#a05a3a'},
        light:{tA:'#e0b8a0',tB:'#d8ab92',pA:'#b96a4a',pE:'#8f4a30'}}}
];

function buildPath(pts){
  const cells=new Set();
  for(let i=0;i<pts.length-1;i++){
    const[c1,r1]=pts[i],[c2,r2]=pts[i+1];
    if(c1===c2)for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)cells.add(c1+','+r);
    else for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)cells.add(c+','+r1);
  }
  const a={x:cx(pts[0][0]),y:cy(pts[0][1])},b={x:cx(pts[1][0]),y:cy(pts[1][1])};
  const entry=(b.x!==a.x)?{x:a.x-CELL,y:a.y}:{x:a.x,y:a.y-CELL};
  const wps=[entry,...pts.map(p=>({x:cx(p[0]),y:cy(p[1])}))];
  let total=0;const cum=[0];
  for(let i=1;i<wps.length;i++){total+=Math.hypot(wps[i].x-wps[i-1].x,wps[i].y-wps[i-1].y);cum.push(total);}
  return{cells,wps,total,cum};
}
MAPS.forEach(m=>m.path=buildPath(m.points));

function posAlong(path,d){
  d=Math.max(0,Math.min(d,path.total));
  const w=path.wps;
  for(let i=1;i<w.length;i++){
    if(d<=path.cum[i]){const s=path.cum[i]-path.cum[i-1]||1,t=(d-path.cum[i-1])/s;
      return{x:w[i-1].x+(w[i].x-w[i-1].x)*t,y:w[i-1].y+(w[i].y-w[i-1].y)*t};}
  }
  const p=w[w.length-1];return{x:p.x,y:p.y};
}

/* ---- 塔配置（4 种）---- */
const TT={
  arrow:{name:'箭塔',icon:'🏹',cost:60,dmg:15,rng:90,cd:20,ps:8,sp:0,color:'#e8b34a',barrel:'#7d5a2f',
    up:{d:10,r:12},desc:'高攻速单体'},
  cannon:{name:'炮塔',icon:'💣',cost:90,dmg:30,rng:120,cd:45,ps:6,sp:35,color:'#8a97ad',barrel:'#3c4658',
    up:{d:14,r:12},desc:'范围溅射'},
  ice:{name:'冰霜塔',icon:'🧊',cost:80,dmg:8,rng:100,cd:30,ps:7,sp:0,color:'#7ec8e3',barrel:'#3a7a9e',
    up:{d:5,r:10},desc:'减速 50% · 2s',slow:{pct:0.5,dur:120}},
  poison:{name:'毒雾塔',icon:'☠️',cost:70,dmg:5,rng:80,cd:25,ps:6,sp:0,color:'#7ecf60',barrel:'#3a6e2a',
    up:{d:3,r:8},desc:'持续毒伤 3s',dot:{dmg:3,dur:180}}
};
const TOWER_KEYS=['arrow','cannon','ice','poison'];
const MAX_LV=3;

/* ---- 敌人配置（6 种）---- */
const ET={
  normal:{name:'普通',hp:40,spd:1.2,rad:13,color:'#5aa9ff',dark:'#2f6fbf',sc:15,ll:1},
  fast:{name:'快速',hp:20,spd:2.2,rad:10,color:'#ffd257',dark:'#c98a00',sc:20,ll:1},
  tank:{name:'重装',hp:110,spd:0.7,rad:16,color:'#9b8cff',dark:'#5a4bb0',sc:25,ll:1},
  shield:{name:'护盾',hp:60,spd:1.0,rad:14,color:'#4ecdc4',dark:'#2a8a82',sc:22,ll:1,shield:30},
  gale:{name:'疾风',hp:15,spd:3.2,rad:8,color:'#ff9ff3',dark:'#c44fa3',sc:15,ll:1},
  elite:{name:'精英',hp:120,spd:0.9,rad:17,color:'#ff4d5e',dark:'#b31f2d',sc:30,ll:2},
  boss:{name:'领主',hp:350,spd:0.55,rad:24,color:'#b32645',dark:'#5e0f22',sc:100,ll:5}
};

/* ---- 难度 ---- */
const DIFF={easy:{hpM:0.75,ctA:-1},normal:{hpM:1.0,ctA:0},hard:{hpM:1.5,ctA:3}};

/* ---- 波次公式（v3 更陡）----
 * 数量 = 4 + floor(wave/2) + 关卡 + 后期(wave≥10: floor((wave-10)/3)) + 难度
 * 生命 = 基础 + floor(wave/2)*成长 + wave*1.5(后期) → × 关卡 × 难度
 * 精英：每 5 波；BOSS：每 10 波；护盾/疾风：第 6/8 波起概率出现
 * ------------------------------------------- */
function waveCount(w,map,df){
  return Math.max(2,3+Math.floor(w/2)+map.countAdd+(w>=10?Math.floor((w-10)/3):0)+DIFF[df].ctA);
}
function eHp(t,w,map,df){
  const cfg=ET[t];let h;
  switch(t){
    case'elite':h=120+Math.floor(w/3)*10;break;
    case'boss':h=350+w*50;break;
    case'tank':h=110+Math.floor(w/2)*10;break;
    case'shield':h=60+Math.floor(w/2)*6;break;
    case'gale':h=15+Math.floor(w/2)*3;break;
    case'fast':h=20+Math.floor(w/2)*4;break;
    default:h=40+Math.floor(w/2)*5;
  }
  h+=Math.max(0,w-5)*2; // 额外后期加成
  return Math.round(h*map.hpMul*DIFF[df].hpM);
}
function buildWave(w,map){
  const list=[],n=waveCount(w,map,'normal');
  const tankP=w>=4?Math.min(0.3,0.05*(w-3)):0;
  const shP=w>=6?Math.min(0.2,0.04*(w-5)):0;
  const galeP=w>=8?Math.min(0.15,0.03*(w-7)):0;
  const fastP=Math.min(0.4,0.2+w*0.015);
  for(let i=0;i<n;i++){
    const r=Math.random();
    list.push(r<tankP?'tank':r<tankP+shP?'shield':r<tankP+shP+galeP?'gale':r<tankP+shP+galeP+fastP?'fast':'normal');
  }
  if(w%5===0)list.push('elite');
  if(w%10===0)list.push('boss');
  return list;
}
function spawnInt(w,map){return Math.max(12,map.spawnBase-w*1.2|0);}

/* ---- 主题 ---- */
const THEMES={
  dark:{bg:'#0f1620',hd:'#141d2b',grid:'rgba(255,255,255,.05)',tx:'#e7edf6',mu:'#9fb0c6',
    ac:'#4ea1ff',go:'#46d38a',ba:'#ff5d6c',cb:'#182130',cbB:'rgba(255,255,255,.10)'},
  light:{bg:'#eef1f6',hd:'#fff',grid:'rgba(0,0,0,.06)',tx:'#1a2330',mu:'#5b6b80',
    ac:'#2f7fe0',go:'#1faa68',ba:'#e04757',cb:'#fff',cbB:'rgba(0,0,0,.12)'}
};

/* ---- 工具 ---- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(x1,y1,x2,y2)=>Math.hypot(x1-x2,y1-y2);
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---- 音效 ---- */
class SFX{
  constructor(){this.ctx=null;this.m=null;}
  ensure(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
    this.ctx=new A();this.m=this.ctx.createGain();this.m.gain.value=0.3;this.m.connect(this.ctx.destination);}
    if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;}
  tone(f,d,ty='square',v=0.5,fe=null){const c=this.ensure();if(!c)return;
    const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=ty;o.frequency.setValueAtTime(f,t);
    if(fe!=null)o.frequency.exponentialRampToValueAtTime(Math.max(1,fe),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+0.02);}
  shoot(t){this.tone(t==='cannon'?180:t==='ice'?900:t==='poison'?260:760,0.07,'square',t==='cannon'?0.3:0.18,t==='cannon'?90:400);}
  hit(){this.tone(320,0.05,'triangle',0.18,180);}
  death(){this.tone(220,0.15,'sawtooth',0.28,60);}
  bossD(){this.tone(300,0.5,'sawtooth',0.4,40);}
  build(){this.tone(520,0.1,'square',0.3,760);}
  err(){this.tone(140,0.1,'sawtooth',0.25,90);}
  wave(){this.tone(440,0.12,'triangle',0.3,880);}
  boss(){[220,262,330].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'sawtooth',0.3,f*0.8),i*120));}
  over(){[392,311,262].forEach((f,i)=>setTimeout(()=>this.tone(f,0.35,'sawtooth',0.3,f*0.7),i*160));}
}

/* ---- 粒子 ---- */
class PT{constructor(x,y,vx,vy,l,c,s){Object.assign(this,{x,y,vx,vy,l,c,s});this.ml=l;}
  update(){this.x+=this.vx;this.y+=this.vy;this.vx*=0.92;this.vy*=0.92;this.l--;}
  get dead(){return this.l<=0;}}
const parts=[];
function sparks(x,y,c,n){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(1,3.5);
  parts.push(new PT(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(14,26)|0,c,rand(1.5,3)));}}
function boom(x,y,c,big=false){const n=big?30:16;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rand(-.2,.2),s=rand(2,big?8:5);
    parts.push(new PT(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(24,big?55:40)|0,i%2?c:'#ffcf5a',rand(2,big?5:4)));}
  for(let i=0;i<6;i++){const a=rand(0,Math.PI*2),s=rand(.5,2);
    parts.push(new PT(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(25,45)|0,'#fff',rand(1.5,2.5)));}}

/* ---- 敌人 ---- */
class Enemy{
  constructor(t,w,g){const c=ET[t];this.g=g;this.id=++Enemy._s;this.type=t;this.cfg=c;
    this.maxHp=this.hp=eHp(t,w,g.map,g.df);
    this.shield=t==='shield'?Math.round(30*w/5*g.map.hpMul*DIFF[g.df].hpM):0;
    this.spd=c.spd;this.rad=c.rad;this.d=0;
    const p=posAlong(g.map.path,0);this.x=p.x;this.y=p.y;
    this.alive=true;this.leak=false;this.slowT=0;this.dotT=0;this.dotDmg=0;}
  static _s=0;
  update(){if(!this.alive)return;
    let sp=this.spd;if(this.slowT>0){sp*=0.5;this.slowT--;}
    if(this.dotT>0){this.hp-=this.dotDmg;this.dotT--;
      if(this.hp<=0){this.hp=0;this.alive=false;return;}}
    this.d+=sp;const p=posAlong(this.g.map.path,this.d);this.x=p.x;this.y=p.y;
    if(this.d>=this.g.map.path.total){this.alive=false;this.leak=true;}}
  hurt(n){if(!this.alive)return false;
    if(this.shield>0){this.shield-=n;if(this.shield>0)return false;this.shield=0;}
    this.hp-=n;if(this.hp<=0){this.hp=0;this.alive=false;return true;}return false;}
}

/* ---- 投射物 ---- */
class Proj{
  constructor(x,y,k,tw,tg){this.x=x;this.y=y;this.k=k;this.spd=tw.ps;
    this.dmg=tw.dmg;this.sp=TT[k].sp;this.tg=tg;this.ax=tg?tg.x:x;this.ay=tg?tg.y:y;
    this.dead=false;this.ang=0;}
  update(g){const al=this.tg&&this.tg.alive;
    const tx=al?this.tg.x:this.ax,ty=al?this.tg.y:this.ay;
    const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);
    this.ang=Math.atan2(dy,dx);
    if(d<=this.spd){this.dead=true;this.hit(g,tx,ty);return;}
    this.x+=dx/d*this.spd;this.y+=dy/d*this.spd;}
  hit(g,x,y){
    if(this.k==='arrow'){const t=this.tg;if(t&&t.alive){g.dmg(t,this.dmg);sparks(x,y,'#ffe08a',5);}return;}
    if(this.k==='cannon'){const p=this.tg;
      for(const e of g.enemies){if(!e.alive)continue;
        if(dist(e.x,e.y,x,y)<=this.sp||(p&&e===p)){
          const d=(p&&e===p)?this.dmg:Math.round(this.dmg/2);g.dmg(e,d);}}
      boom(x,y,TT.cannon.barrel);return;}
    if(this.k==='ice'){const t=this.tg;if(t&&t.alive){g.dmg(t,this.dmg);
      const c=TT.ice.slow;t.slowT=c.dur;sparks(x,y,'#aef',8);}return;}
    if(this.k==='poison'){const t=this.tg;if(t&&t.alive){g.dmg(t,this.dmg);
      const c=TT.poison.dot;t.dotT=c.dur;t.dotDmg=c.dmg;sparks(x,y,'#7ecf60',6);}return;}
  }
}

/* ---- 塔 ---- */
class Tower{
  constructor(t,c,r){const cf=TT[t];this.t=t;this.c=c;this.r=r;
    this.x=cx(c);this.y=cy(r);this.lv=1;this.dmg=cf.dmg;this.rng=cf.rng;
    this.cdM=cf.cd;this.cool=0;this.ps=cf.ps;this.sp=cf.sp;
    this.inv=cf.cost;this.aim=-Math.PI/2;}
  get cf(){return TT[this.t];}
  upCost(){return Math.round(this.cf.cost*0.7)*this.lv;}
  canUp(){return this.lv<MAX_LV;}
  upgrade(g){if(!this.canUp())return false;const c=this.upCost();
    if(g.score<c){g.flash('积分不足');g.sfx.err();return false;}
    g.score-=c;this.lv++;this.dmg+=this.cf.up.d;this.rng+=this.cf.up.r;
    this.inv+=c;g.sfx.build();return true;}
  sellVal(){return Math.round(this.inv*0.6);}
  update(g){if(this.cool>0)this.cool--;
    const tg=this.acquire(g);let des=-Math.PI/2;
    if(tg)des=Math.atan2(tg.y-this.y,tg.x-this.x);
    let d=des-this.aim;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    this.aim+=clamp(d,-0.18,0.18);
    if(tg&&this.cool<=0){g.projs.push(new Proj(this.x,this.y-6,this.t,this,tg));
      this.cool=this.cdM;g.sfx.shoot(this.t);}}
  acquire(g){let b=null,bd=-1;
    for(const e of g.enemies){if(!e.alive)continue;
      if(dist(e.x,e.y,this.x,this.y)<=this.rng&&e.d>bd){b=e;bd=e.d;}}return b;}
}

/* ---- 游戏主类 ---- */
class Game{
  constructor(cv){this.cv=cv;this.cx=cv.getContext('2d');this.sfx=new SFX();
    this.enemies=[];this.towers=new Map();this.projs=[];
    this.bt='arrow';this.sel=null;
    this.hv={c:-1,r:-1,ok:false};this.hCard=-1;
    this.msg={t:'',f:0};this.banner={t:'',f:0};
    this.spd=1;this.df='normal';this.tn='dark';this.th=THEMES.dark;
    this.map=MAPS[0];this.state='select';this.phase='prep';
    this.w=0;this.pt=PREP_FRAMES;this.score=200;this.lives=15;this.go=false;
    this.ts=[];this.st=0;
    this.lt=performance.now();this.acc=0;
    this.bindInput();}

  clear(){this.enemies=[];this.towers.clear();this.projs.length=0;parts.length=0;
    this.sel=null;this.ts=[];this.st=0;}
  startMap(i){this.map=MAPS[i];this.state='play';this.go=false;this.clear();
    this.score=200;this.lives=15;this.w=0;this.phase='prep';this.pt=PREP_FRAMES;
    this.msg={t:'',f:0};this.banner={t:'',f:0};refreshPanel();live();}
  restart(){this.startMap(this.map.id);}
  goSel(){this.state='select';this.clear();this.go=false;refreshPanel();live();}

  /* ---- 输入（含移动端坐标缩放）---- */
  bindInput(){
    const rc=()=>this.cv.getBoundingClientRect();
    const scale=(e)=>{const r=rc();
      return{x:(e.clientX-r.left)*(MAP_W/r.width),y:(e.clientY-r.top)*(600/r.height)};};
    const g=()=>this.sfx.ensure();
    window.addEventListener('pointerdown',g);
    window.addEventListener('keydown',g);

    this.cv.addEventListener('pointermove',(e)=>{
      const p=scale(e);
      if(this.state==='select'){
        this.hCard=SEL_CARDS.findIndex(c=>p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h);
        this.cv.style.cursor=this.hCard>=0?'pointer':'default';return;}
      const c=Math.floor(p.x/CELL),r=Math.floor((p.y-GRID_Y0)/CELL);
      this.hv={c,r,ok:p.y>=GRID_Y0&&c>=0&&c<COLS&&r>=0&&r<ROWS};
      this.cv.style.cursor='crosshair';});
    this.cv.addEventListener('pointerleave',()=>{this.hv.ok=false;this.hCard=-1;});
    this.cv.addEventListener('pointerup',(e)=>this.onClick(e));

    window.addEventListener('keydown',(e)=>{
      if(this.state==='select'){if(e.key>='1'&&e.key<='3')this.startMap(+e.key-1);return;}
      if(e.key==='1')this.setBT('arrow');else if(e.key==='2')this.setBT('cannon');
      else if(e.key==='3')this.setBT('ice');else if(e.key==='4')this.setBT('poison');
      else if(e.key==='Escape'){this.sel=null;refreshPanel();}
      else if(e.key==='n'||e.key==='N')this.skip();});
  }

  onClick(e){
    const r=this.cv.getBoundingClientRect();
    const px=(e.clientX-r.left)*(MAP_W/r.width),py=(e.clientY-r.top)*(600/r.height);
    if(this.state==='select'){
      const i=SEL_CARDS.findIndex(c=>px>=c.x&&px<=c.x+c.w&&py>=c.y&&py<=c.y+c.h);
      if(i>=0)this.startMap(i);return;}
    if(this.go){const b=GO_BTN;
      if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)this.restart();return;}
    const c=Math.floor(px/CELL),r2=Math.floor((py-GRID_Y0)/CELL);
    if(py<GRID_Y0||c<0||c>=COLS||r2<0||r2>=ROWS){this.sel=null;refreshPanel();return;}
    const k=c+','+r2;
    if(this.towers.has(k)){this.sel=k;refreshPanel();return;}
    this.tryBuild(c,r2);
  }

  tryBuild(c,r){const k=c+','+r;
    if(this.map.path.cells.has(k)){this.flash('⚠️ 路径上无法建造');this.sfx.err();return;}
    if(this.towers.has(k)){this.sel=k;refreshPanel();return;}
    const cf=TT[this.bt];
    if(this.score<cf.cost){this.flash('⚠️ 积分不足');this.sfx.err();return;}
    this.score-=cf.cost;this.towers.set(k,new Tower(this.bt,c,r));
    this.sel=k;this.sfx.build();refreshPanel();}
  setBT(t){this.bt=t;this.sel=null;refreshPanel();}
  skip(){if(this.state==='play'&&this.phase==='prep'&&!this.go)this.pt=0;}

  /* ---- 波次 ---- */
  startWave(n){this.w=n;this.phase='wave';
    this.ts=buildWave(n,this.map);
    const da=DIFF[this.df].ctA;
    if(da>0)for(let i=0;i<da;i++)this.ts.splice(0,0,'normal');
    else if(da<0){const k=Math.max(0,this.ts.length-1);for(let i=0;i<-da;i++)this.ts.splice(k,1);}
    this.st=0;
    this.banner={t:n%10===0?`第 ${n} 波 · 领主来袭!`:`第 ${n} 波来袭`,f:110};
    if(n%10===0)this.sfx.boss();else this.sfx.wave();refreshPanel();}

  /* ---- 伤害 ---- */
  dmg(e,n){if(e.hurt(n))this.kill(e);else this.sfx.hit();}
  kill(e){
    this.score+=e.type==='boss'?100+this.w*5:e.cfg.sc+this.w*2;
    boom(e.x,e.y,e.type==='boss'?'#ffd257':e.type==='elite'?'#ff7a86':'#fff2c4',e.type==='boss');
    if(e.type==='boss')this.sfx.bossD();else this.sfx.death();refreshPanel();}
  flash(t){this.msg={t,f:90};}
  doGO(){this.go=true;this.sfx.over();refreshPanel();}

  /* ---- update（一帧）---- */
  update(){if(this.state!=='play'||this.go)return;
    if(this.msg.f>0)this.msg.f--;if(this.banner.f>0)this.banner.f--;

    if(this.phase==='prep'){this.pt--;if(this.pt<=0)this.startWave(this.w+1);}
    else{
      if(this.ts.length>0){this.st--;
        if(this.st<=0){this.enemies.push(new Enemy(this.ts.shift(),this.w,this));
          this.st=spawnInt(this.w,this.map);}}
      else if(this.enemies.length===0){this.phase='prep';this.pt=PREP_FRAMES;this.sfx.wave();refreshPanel();}}

    for(const e of this.enemies){e.update();
      if(e.leak&&!e._cl){e._cl=true;this.lives-=e.cfg.ll;
        this.flash(`敌人突破！核心 -${e.cfg.ll}`);this.sfx.err();refreshPanel();
        if(this.lives<=0){this.lives=0;this.doGO();}}}

    for(const t of this.towers.values())t.update(this);
    for(const p of this.projs)if(!p.dead)p.update(this);
    for(let i=parts.length-1;i>=0;i--){parts[i].update();if(parts[i].dead)parts.splice(i,1);}
    this.enemies=this.enemies.filter(e=>e.alive&&!e.leak);
    this.projs=this.projs.filter(p=>!p.dead);
    if(this.sel&&!this.towers.has(this.sel)){this.sel=null;refreshPanel();}
  }

  /* ---- render ---- */
  render(){const ctx=this.cx,th=this.th;
    ctx.fillStyle=th.bg;ctx.fillRect(0,0,MAP_W,600);
    if(this.state==='select'){this.rSel(ctx,th);return;}
    this.rHead(ctx,th);this.rMap(ctx,th);
    if(this.hv.ok&&!this.go)this.rHover(ctx,th);
    const s=this.towers.get(this.sel);
    if(s)rangeCirc(ctx,s.x,s.y,s.rng,th.ac);
    for(const t of this.towers.values())drawTower(ctx,t.x,t.y,t.t,t.aim,t.lv);
    for(const e of this.enemies)drawEnemy(ctx,e,th);
    for(const p of this.projs)drawProj(ctx,p);
    for(const pt of parts){ctx.globalAlpha=clamp(pt.l/pt.ml,0,1);
      ctx.fillStyle=pt.c;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.s,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
    this.rBoss(ctx,th);this.rWaveC(ctx,th);
    if(this.msg.f>0)this.rMsg(ctx,th);
    if(this.banner.f>0)this.rBanner(ctx,th);
    if(this.phase==='prep'&&!this.go)this.rPrep(ctx,th);
    if(this.go)this.rGO(ctx,th);
  }

  rSel(ctx,th){ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=th.tx;ctx.font='800 32px "Segoe UI",sans-serif';
    ctx.fillText('🛰️ 元素哨站',MAP_W/2,58);
    ctx.fillStyle=th.mu;ctx.font='600 14px "Segoe UI",sans-serif';
    ctx.fillText('选择关卡 · 点击卡片或按 1/2/3',MAP_W/2,92);
    SEL_CARDS.forEach((cd,i)=>{const m=MAPS[i],pal=m.pal[this.tn],hv=this.hCard===i;
      rr(ctx,cd.x,cd.y,cd.w,cd.h,14);ctx.fillStyle=th.cb;ctx.fill();
      ctx.lineWidth=hv?3:1.5;ctx.strokeStyle=hv?th.ac:th.cbB;ctx.stroke();
      ctx.fillStyle=th.tx;ctx.font='800 17px "Segoe UI",sans-serif';
      ctx.fillText(m.name,cd.x+cd.w/2,cd.y+26);
      ctx.fillStyle=this.tn==='light'?'#c98a00':'#ffd257';ctx.font='700 13px sans-serif';
      ctx.fillText('★'.repeat(m.stars)+'☆'.repeat(3-m.stars),cd.x+cd.w/2,cd.y+46);
      const px=cd.x+30,py=cd.y+62,s=10;
      ctx.fillStyle=pal.tA;ctx.fillRect(px,py,COLS*s,ROWS*s);
      ctx.fillStyle=pal.pA;
      m.path.cells.forEach(k=>{const[c,r]=k.split(',').map(Number);ctx.fillRect(px+c*s,py+r*s,s,s);});
      ctx.strokeStyle=pal.pE;ctx.lineWidth=1;ctx.strokeRect(px+.5,py+.5,COLS*s-1,ROWS*s-1);
      const w=m.path.wps,st=w[1],en=w[w.length-1];
      ctx.fillStyle=th.go;ctx.beginPath();ctx.arc(px+(st.x/CELL-.5)*s,py+(st.y/GRID_Y0-.5)*s,3.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=th.ba;ctx.beginPath();ctx.arc(px+(en.x/CELL-.5)*s,py+(en.y/GRID_Y0-.5)*s,3.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=th.mu;ctx.font='600 11px "Segoe UI",sans-serif';
      ctx.fillText(m.desc,cd.x+cd.w/2,cd.y+196);
      const rows=[['敌人生命','×'+m.hpMul.toFixed(2)],['敌人数量','+'+m.countAdd],['节奏',m.spawnBase<=32?'急促':'较快']];
      rows.forEach((rw,j)=>{const yy=cd.y+218+j*22;
        ctx.textAlign='left';ctx.fillStyle=th.mu;ctx.fillText(rw[0],cd.x+34,yy);
        ctx.textAlign='right';ctx.fillStyle=th.tx;ctx.fillText(rw[1],cd.x+cd.w-34,yy);
        ctx.textAlign='center';});
      ctx.fillStyle=hv?th.ac:th.mu;ctx.font='700 13px "Segoe UI",sans-serif';
      ctx.fillText(hv?'▶ 点击进入 ◀':'点击进入',cd.x+cd.w/2,cd.y+cd.h-22);});
    ctx.fillStyle=th.mu;ctx.font='500 11px "Segoe UI",sans-serif';
    ctx.fillText('6 种敌人 · 4 种塔 · 每 5 波精英 · 每 10 波 BOSS',MAP_W/2,556);}

  rHead(ctx,th){ctx.fillStyle=th.hd;ctx.fillRect(0,0,MAP_W,GRID_Y0);
    ctx.strokeStyle='rgba(128,140,160,.25)';ctx.beginPath();
    ctx.moveTo(0,GRID_Y0+.5);ctx.lineTo(MAP_W,GRID_Y0+.5);ctx.stroke();
    const mid=GRID_Y0/2;ctx.textBaseline='middle';
    ctx.textAlign='left';ctx.fillStyle=th.tx;ctx.font='700 18px "Segoe UI",sans-serif';
    ctx.fillText('🛰️ 元素哨站',12,mid);
    ctx.fillStyle=th.mu;ctx.font='600 11px "Segoe UI",sans-serif';ctx.fillText(this.map.name,130,mid);
    const wl=this.phase==='wave'?`🌊 第${this.w}波`:`🌊 准备·第${this.w+1}波`;
    const items=[[wl,th.ac],[`❤️ ${this.lives}`,'#ff8a94'],[`💰 ${this.score}`,th.tx]];
    ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='right';
    let x=MAP_W-14;
    for(const[t,col]of items){ctx.fillStyle=col;ctx.fillText(t,x,mid);x-=ctx.measureText(t).width+22;}}

  rMap(ctx,th){const pal=this.map.pal[this.tn];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const x=c*CELL,y=GRID_Y0+r*CELL;
      if(this.map.path.cells.has(c+','+r)){ctx.fillStyle=pal.pA;ctx.fillRect(x,y,CELL,CELL);
        ctx.strokeStyle=pal.pE;ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,CELL-3,CELL-3);}
      else{ctx.fillStyle=((c+r)%2)?pal.tA:pal.tB;ctx.fillRect(x,y,CELL,CELL);}}
    ctx.strokeStyle=th.grid;ctx.lineWidth=1;
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL+.5,GRID_Y0);ctx.lineTo(c*CELL+.5,GRID_Y0+MAP_H);ctx.stroke();}
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,GRID_Y0+r*CELL+.5);ctx.lineTo(MAP_W,GRID_Y0+r*CELL+.5);ctx.stroke();}
    const w=this.map.path.wps,sy=cy(this.map.points[0][1]);
    ctx.fillStyle=th.go;ctx.beginPath();ctx.moveTo(2,sy-10);ctx.lineTo(20,sy);ctx.lineTo(2,sy+10);ctx.closePath();ctx.fill();
    const ex=MAP_W-8,ey=w[w.length-1].y;
    const g=ctx.createRadialGradient(ex,ey,2,ex,ey,16);g.addColorStop(0,'#ffd0d6');g.addColorStop(1,th.ba);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,14,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.stroke();}

  rHover(ctx,th){const{c,r}=this.hv;if(c<0||r>=COLS||r<0||r>=ROWS)return;
    const x=c*CELL,y=GRID_Y0+r*CELL,k=c+','+r;
    const bl=this.map.path.cells.has(k)||this.towers.has(k);
    const ok=!bl&&this.score>=TT[this.bt].cost;
    ctx.save();ctx.fillStyle=ok?'rgba(70,211,138,.25)':'rgba(255,93,108,.25)';
    ctx.fillRect(x,y,CELL,CELL);ctx.strokeStyle=ok?th.go:th.ba;ctx.lineWidth=2;
    ctx.strokeRect(x+1,y+1,CELL-2,CELL-2);
    if(ok)rangeCirc(ctx,x+CELL/2,y+CELL/2,TT[this.bt].rng,th.go,0.5);ctx.restore();}

  rBoss(ctx,th){const b=this.enemies.find(e=>e.alive&&e.type==='boss');if(!b)return;
    const bw=400,bx=(MAP_W-bw)/2,by=GRID_Y0+10;
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.6)';rr(ctx,bx-6,by-18,bw+12,34,8);ctx.fill();
    ctx.fillStyle='#ffd257';ctx.font='800 12px "Segoe UI",sans-serif';
    ctx.fillText('👑 领主 BOSS',MAP_W/2,by-8);
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by+2,bw,8);
    ctx.fillStyle='#b32645';ctx.fillRect(bx,by+2,bw*clamp(b.hp/b.maxHp,0,1),8);ctx.restore();}

  rWaveC(ctx,th){if(this.phase!=='wave')return;
    const n=this.enemies.length+this.ts.length;
    ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=th.mu;ctx.font='600 11px "Segoe UI",sans-serif';
    ctx.fillText(`剩余敌人：${n}`,12,GRID_Y0+15);ctx.restore();}

  rMsg(ctx,th){const a=clamp(this.msg.f/40,0,1);ctx.save();ctx.globalAlpha=a;
    ctx.font='600 14px "Segoe UI",sans-serif';ctx.textAlign='center';
    const w=ctx.measureText(this.msg.t).width+24;
    ctx.fillStyle='rgba(0,0,0,.55)';rr(ctx,(MAP_W-w)/2,GRID_Y0+34,w,28,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(this.msg.t,MAP_W/2,GRID_Y0+48);ctx.restore();}

  rBanner(ctx,th){const a=clamp(this.banner.f/110,0,1);ctx.save();ctx.globalAlpha=a;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=th.tx;ctx.font='800 38px "Segoe UI",sans-serif';
    ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=12;
    ctx.fillText(this.banner.t,MAP_W/2,GRID_Y0+110);ctx.restore();}

  rPrep(ctx,th){const sec=Math.ceil(this.pt/60);
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=th.mu;ctx.font='700 17px "Segoe UI",sans-serif';
    ctx.fillText('准备阶段',MAP_W/2,GRID_Y0+92);
    ctx.fillStyle=th.ac;ctx.font='800 44px "Segoe UI",sans-serif';
    ctx.fillText(sec+'s',MAP_W/2,GRID_Y0+145);
    ctx.fillStyle=th.mu;ctx.font='600 13px "Segoe UI",sans-serif';
    ctx.fillText(`第 ${this.w+1} 波即将开始 · 点「下一波」跳过`,MAP_W/2,GRID_Y0+180);ctx.restore();}

  rGO(ctx,th){ctx.save();ctx.fillStyle='rgba(4,7,12,.72)';ctx.fillRect(0,0,MAP_W,600);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff5d6c';ctx.font='800 52px "Segoe UI",sans-serif';
    ctx.fillText('游戏结束',MAP_W/2,218);
    ctx.fillStyle=th.tx;ctx.font='600 17px "Segoe UI",sans-serif';
    ctx.fillText(`${this.map.name} · 坚守至第 ${this.w} 波 · 积分 ${this.score}`,MAP_W/2,262);
    const b=GO_BTN;rr(ctx,b.x,b.y,b.w,b.h,10);ctx.fillStyle='#4ea1ff';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='700 19px "Segoe UI",sans-serif';
    ctx.fillText('🔄 重新开始',b.x+b.w/2,b.y+b.h/2+1);
    ctx.fillStyle=th.mu;ctx.font='600 13px "Segoe UI",sans-serif';
    ctx.fillText('或点侧栏「选关」换图',MAP_W/2,b.y+b.h+26);ctx.restore();}

  /* ---- 主循环 ---- */
  frame(now){let dt=(now-this.lt)/1000;this.lt=now;if(dt>0.25)dt=0.25;
    this.acc+=dt*this.spd;let s=0;
    while(this.acc>=STEP&&s<MAX_STEPS){this.update();this.acc-=STEP;s++;}
    if(s===MAX_STEPS)this.acc=Math.min(this.acc,STEP*2);
    this.render();live();requestAnimationFrame(t=>this.frame(t));}
}

/* ---- 绘制辅助 ---- */
function rangeCirc(ctx,x,y,rg,col,al=1){ctx.save();
  ctx.globalAlpha=al*0.3;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,rg,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.arc(x,y,rg,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.setLineDash([]);}

function drawTower(ctx,x,y,ty,ang,lv){const cf=TT[ty];
  ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(x,y+14,16,7,0,0,Math.PI*2);ctx.fill();ctx.restore();
  const g=ctx.createRadialGradient(x-5,y-6,3,x,y,20);
  g.addColorStop(0,'#fff');g.addColorStop(0.18,cf.color);g.addColorStop(1,cf.barrel);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  if(ty==='arrow'){ctx.fillStyle='#3b2a12';rr(ctx,-4,-4,26,8,3);ctx.fill();
    ctx.fillStyle=cf.color;rr(ctx,16,-5,8,10,2);ctx.fill();}
  else if(ty==='cannon'){ctx.fillStyle='#2a3342';rr(ctx,-6,-7,30,14,4);ctx.fill();
    ctx.fillStyle=cf.color;rr(ctx,20,-9,8,18,2);ctx.fill();}
  else if(ty==='ice'){ctx.fillStyle='#2a5a7a';rr(ctx,-5,-5,22,10,3);ctx.fill();
    ctx.fillStyle=cf.color;rr(ctx,14,-6,7,12,2);ctx.fill();
    ctx.fillStyle='rgba(174,238,255,.5)';ctx.beginPath();ctx.arc(18,0,4,0,Math.PI*2);ctx.fill();}
  else{ctx.fillStyle='#2a5a2a';rr(ctx,-5,-5,22,10,3);ctx.fill();
    ctx.fillStyle=cf.color;rr(ctx,14,-6,7,12,2);ctx.fill();
    ctx.fillStyle='rgba(126,207,96,.5)';ctx.beginPath();ctx.arc(18,0,4,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.stroke();
  for(let i=0;i<lv;i++){const lx=x-(lv-1)*5+i*10;
    ctx.fillStyle='#ffd257';ctx.save();ctx.translate(lx,y+9);ctx.rotate(Math.PI/4);
    ctx.fillRect(-3,-3,6,6);ctx.restore();}}

function drawEnemy(ctx,e,th){const cf=e.cfg;
  ctx.save();ctx.globalAlpha=0.28;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(e.x,e.y+e.rad*0.7,e.rad*0.9,e.rad*0.4,0,0,Math.PI*2);ctx.fill();ctx.restore();
  const g=ctx.createRadialGradient(e.x-e.rad*0.35,e.y-e.rad*0.4,1,e.x,e.y,e.rad+2);
  g.addColorStop(0,'#fff');g.addColorStop(0.2,cf.color);g.addColorStop(1,cf.dark);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,e.rad,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
  // 护盾环
  if(e.type==='shield'&&e.shield>0){ctx.save();ctx.globalAlpha=0.7;
    ctx.strokeStyle='#4ecdc4';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(e.x,e.y,e.rad+3,0,Math.PI*2);ctx.stroke();ctx.restore();}
  // 减速指示
  if(e.slowT>0){ctx.save();ctx.globalAlpha=0.5;ctx.strokeStyle='#aef';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(e.x,e.y,e.rad+2,0,Math.PI*2);ctx.stroke();ctx.restore();}
  // 毒指示
  if(e.dotT>0){ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#7ecf60';
    ctx.beginPath();ctx.arc(e.x,e.y+e.rad+4,3,0,Math.PI*2);ctx.fill();ctx.restore();}
  // 精英光环
  if(e.type==='elite'){ctx.save();ctx.globalAlpha=0.5+0.4*Math.sin(performance.now()/180);
    ctx.strokeStyle='#ff9aa2';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(e.x,e.y,e.rad+4,0,Math.PI*2);ctx.stroke();ctx.restore();}
  // BOSS 王冠
  if(e.type==='boss'){ctx.save();ctx.globalAlpha=0.4+0.3*Math.sin(performance.now()/250);
    ctx.strokeStyle='#ffd257';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(e.x,e.y,e.rad+6,0,Math.PI*2);ctx.stroke();ctx.restore();
    ctx.fillStyle='#ffd257';const cy0=e.y-e.rad-4;
    ctx.beginPath();ctx.moveTo(e.x-12,cy0);ctx.lineTo(e.x-12,cy0-10);ctx.lineTo(e.x-6,cy0-4);
    ctx.lineTo(e.x,cy0-12);ctx.lineTo(e.x+6,cy0-4);ctx.lineTo(e.x+12,cy0-10);ctx.lineTo(e.x+12,cy0);
    ctx.closePath();ctx.fill();}
  // 眼睛
  const p1=posAlong(e.g.map.path,e.d+1),dir=Math.atan2(p1.y-e.y,p1.x-e.x);
  for(const s of[-0.5,0.5]){const ex=e.x+Math.cos(dir+s)*e.rad*0.4,ey=e.y+Math.sin(dir+s)*e.rad*0.4;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,e.rad*0.28,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(ex+Math.cos(dir),ey+Math.sin(dir),e.rad*0.13,0,Math.PI*2);ctx.fill();}
  // 血条
  const bw=e.rad*2,bh=4,bx=e.x-e.rad,by=e.y-e.rad-9;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  ctx.fillStyle='#ff5d6c';ctx.fillRect(bx,by,bw,bh);
  const f=clamp(e.hp/e.maxHp,0,1);
  ctx.fillStyle=f>0.5?'#46d38a':f>0.25?'#ffd257':'#ff5d6c';
  ctx.fillRect(bx,by,bw*f,bh);}

function drawProj(ctx,p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
  if(p.k==='arrow'){ctx.fillStyle='#f4e2b0';rr(ctx,-8,-1.6,14,3.2,1.5);ctx.fill();
    ctx.beginPath();ctx.moveTo(6,-3.5);ctx.lineTo(11,0);ctx.lineTo(6,3.5);ctx.closePath();
    ctx.fillStyle='#c9d3e0';ctx.fill();ctx.fillStyle='#b04a3e';rr(ctx,-8,-2.4,3,4.8,1);ctx.fill();}
  else if(p.k==='cannon'){const g=ctx.createRadialGradient(-2,-2,1,0,0,6);
    g.addColorStop(0,'#cfd6e2');g.addColorStop(1,'#2a3342');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,5.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1.5;ctx.stroke();}
  else if(p.k==='ice'){ctx.fillStyle='#aef';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();}
  else{ctx.fillStyle='#7ecf60';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a6e2a';ctx.beginPath();ctx.arc(0,0,2,0,Math.PI*2);ctx.fill();}
  ctx.restore();}

/* ---- 侧栏 UI ---- */
const ui={};
function cacheUI(){['uiScore','uiLives','uiWave','uiMap','selInfo','card-arrow','card-cannon',
  'card-ice','card-poison','btnNextWave','btnReset','btnMap','btnTheme','speedSeg','diffSeg']
  .forEach(id=>ui[id]=document.getElementById(id));}
function renderIcons(){const d=(id,ty)=>{const c=ui[id].querySelector('canvas'),x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);drawTower(x,c.width/2,c.height/2+4,ty,-Math.PI/2,1);};
  d('card-arrow','arrow');d('card-cannon','cannon');d('card-ice','ice');d('card-poison','poison');}
function live(){ui.uiScore.textContent=game.score;ui.uiLives.textContent=game.lives;
  ui.uiMap.textContent=game.state==='select'?'—':game.map.name;
  ui.uiWave.textContent=game.state==='select'?'—':game.go?'结束':
    game.phase==='wave'?`第${game.w}波`:`准备·${game.w+1}`;
  ui.btnNextWave.disabled=game.state!=='play'||game.go||game.phase!=='prep';}
function refreshPanel(){
  const cards={arrow:'card-arrow',cannon:'card-cannon',ice:'card-ice',poison:'card-poison'};
  for(const k of TOWER_KEYS)ui[cards[k]].classList.toggle('active',!game.sel&&game.bt===k);
  const el=ui.selInfo;let h='';
  const s=game.towers.get(game.sel);
  if(s){const t=s,up=t.canUp();
    h+=`<div id="selTitle">${t.cf.icon} ${t.cf.name} <span style="color:var(--gold);font-size:10px">Lv.${t.lv}</span></div>`;
    h+=rw('伤害',t.dmg)+rw('范围',Math.round(t.rng))+rw('冷却(帧)',t.cdM);
    if(t.t==='cannon')h+=rw('溅射',Math.round(t.dmg/2));
    if(t.t==='ice')h+=rw('减速','50%·2s');
    if(t.t==='poison')h+=rw('毒伤',TT.poison.dot.dmg+'/帧·3s');
    h+=`<div style="display:flex;gap:5px;margin-top:6px">`;
    h+=up?`<button class="bu" data-k="${game.sel}" style="flex:1;font-size:11px;padding:5px">⬆升级💰${t.upCost()}</button>`
      :`<span style="flex:1;text-align:center;color:var(--muted);font-size:11px;padding:3px">满级</span>`;
    h+=`<button class="bs" data-k="${game.sel}" style="flex:1;font-size:11px;padding:5px;background:linear-gradient(180deg,#ff5d6c33,transparent)">售卖💰${t.sellVal()}</button></div>`;}
  else if(game.state==='select'){h=`<div id="selTitle">🗺️ 选择关卡</div><div style="color:var(--muted)">画布中点击卡片<br>或按 1/2/3</div>`;}
  else{const cf=TT[game.bt];
    h+=`<div id="selTitle">${cf.icon} ${cf.name}（待建造）</div>`;
    h+=rw('伤害',cf.dmg)+rw('范围',cf.rng)+rw('冷却(帧)',cf.cd)+rw('造价','💰'+cf.cost);
    if(game.bt==='cannon')h+=rw('溅射',Math.round(cf.dmg/2));
    if(game.bt==='ice')h+=rw('效果','减速50% 2s');
    if(game.bt==='poison')h+=rw('效果','毒伤3/帧 3s');
    h+=`<div style="margin-top:6px;color:var(--muted)">点击空地建造</div>`;}
  el.innerHTML=h;
  el.querySelectorAll('.bu').forEach(b=>b.onclick=()=>{const t=game.towers.get(b.dataset.k);if(t&&t.upgrade(game))refreshPanel();});
  el.querySelectorAll('.bs').forEach(b=>b.onclick=()=>sellT(b.dataset.k));}
function rw(k,v){return`<div class="row"><span>${k}</span><b>${v}</b></div>`;}
function sellT(k){const t=game.towers.get(k);if(!t)return;
  game.score+=t.sellVal();game.towers.delete(k);game.sel=null;
  game.sfx.hit();refreshPanel();live();}
function bindCtrl(){
  const cards={arrow:'card-arrow',cannon:'card-cannon',ice:'card-ice',poison:'card-poison'};
  for(const k of TOWER_KEYS)ui[cards[k]].onclick=()=>{if(game.state==='play')game.setBT(k);};
  ui.btnNextWave.onclick=()=>game.skip();
  ui.btnReset.onclick=()=>game.goSel();
  ui.btnMap.onclick=()=>game.goSel();
  ui.btnTheme.onclick=toggleTh;
  const ss=sp=>ui.speedSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.sp)===sp));
  ui.speedSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{game.spd=parseFloat(b.dataset.sp);ss(game.spd);});
  const sd=df=>ui.diffSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.df===df));
  ui.diffSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{game.df=b.dataset.df;sd(game.df);});}
function toggleTh(){const l=document.body.classList.toggle('light');
  game.tn=l?'light':'dark';game.th=THEMES[game.tn];}

/* ---- 启动 ---- */
const GO_BTN={x:330,y:312,w:240,h:54};
const SEL_CARDS=[{x:30,y:120,w:260,h:400},{x:320,y:120,w:260,h:400},{x:610,y:120,w:260,h:400}];
let game=null;
function boot(){cacheUI();game=new Game(document.getElementById('game'));
  window.game=game;renderIcons();bindCtrl();refreshPanel();live();
  requestAnimationFrame(t=>{game.lt=t;game.frame(t);});}
document.addEventListener('DOMContentLoaded',boot);
})();
</script>

 Q1. 路径起点和终点坐标？
     关卡1：(0,5)→(8,5)→(8,9)→(19,9)，像素终点 center(19,9)=(877.5,487.5)。
     关卡2/3 路径不同但同一 buildPath() 生成，终点均在第 9 行右侧。

 Q2. 炮塔溅射伤害=15？
     是。Projectile.hit 中主目标全额 30，半径 35 内其余 Math.round(30/2)=15。

 Q3. 第5波精英 HP=130？
     关卡1+普通：eHp('elite',5)=120+floor(5/3)*10+max(0,5-5)*2=130，hpMul=1.0。

 Q4. 点击路径格无法建造？
     是。tryBuild 命中 map.path.cells 即拒绝。

 Q5. 生命归零显示遮罩？
     是。doGO → rGO 绘制半透明遮罩+"游戏结束"+重新开始按钮。

 Q6. 准备阶段自动倒计时？
     是。prepTimer 每帧 -1，归零自动 startWave。

 Q7. 启动后自动第1波且3个敌人？

        关卡1 第1波实际生成 4 个敌人（非严格 3）。
        若需严格 3，可将 waveCount 首项改为 3。
     此处保留 4 以匹配"更难的"需求。
