<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>元素哨站 · Elemental Outpost</title>
<style>
  /* ============================================================
     主题变量（暗色为默认）。切换 .light 类即可换亮色。
     画布取色通过 JS 的 theme 对象读取，DOM 用 CSS 变量。
     ============================================================ */
  :root{
    --bg:#0b1017;          /* 页面背景 */
    --panel:#131a24;       /* 侧栏面板 */
    --panel-2:#0f151e;
    --card:#182130;        /* 卡片底 */
    --text:#e7edf6;
    --muted:#9fb0c6;
    --accent:#4ea1ff;
    --good:#46d38a;
    --bad:#ff5d6c;
    --gold:#ffd257;
    --border:rgba(255,255,255,.08);
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  body.light{
    --bg:#eef1f6;
    --panel:#ffffff;
    --panel-2:#f4f7fb;
    --card:#eaf0f8;
    --text:#1a2330;
    --muted:#5b6b80;
    --accent:#2f7fe0;
    --good:#1faa68;
    --bad:#e04757;
    --gold:#c98a00;
    --border:rgba(0,0,0,.10);
    --shadow:0 10px 26px rgba(30,50,80,.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
  }

  /* 整体：画布 + 右侧 180px 面板 */
  #app{
    display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;
    justify-content:center;
  }
  #stage{
    position:relative;width:900px;height:600px;border-radius:12px;overflow:hidden;
    box-shadow:var(--shadow);border:1px solid var(--border);background:#0f1620;
  }
  canvas#game{display:block;width:900px;height:600px;cursor:crosshair;}

  /* ---- 右侧 UI 面板（固定宽 180px）---- */
  #side{
    width:180px;display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:12px;box-shadow:var(--shadow);
  }
  .brand{font-size:15px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
  .brand small{color:var(--muted);font-weight:500;font-size:10px;margin-left:auto;}

  .stat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 4px;}
  .stat-row b{font-variant-numeric:tabular-nums;font-weight:700;}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 8px;width:100%;}

  h3.sec{margin:4px 2px 0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}

  /* 塔卡片 */
  .tower-card{
    display:flex;align-items:center;gap:8px;padding:7px;border-radius:10px;cursor:pointer;
    background:var(--card);border:2px solid transparent;transition:border-color .12s,transform .05s;user-select:none;
  }
  .tower-card:hover{transform:translateY(-1px);}
  .tower-card.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,161,255,.18) inset;}
  .tower-card canvas{width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.03);flex:0 0 auto;}
  .tc-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
  .tc-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .tc-key{font-size:9px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;}
  .tc-cost{font-size:12px;color:var(--gold);font-weight:700;}

  /* 选中塔信息 */
  #selInfo{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px;font-size:12px;min-height:86px;}
  #selInfo .row{display:flex;justify-content:space-between;margin:3px 0;color:var(--muted);}
  #selInfo .row b{color:var(--text);font-variant-numeric:tabular-nums;}
  #selTitle{font-weight:800;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}

  /* 按钮 */
  button{
    font-family:inherit;color:var(--text);cursor:pointer;border:1px solid var(--border);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;transition:filter .1s,transform .05s;
  }
  button:hover{filter:brightness(1.12);}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:linear-gradient(180deg,var(--accent),#2f7fe0);color:#fff;border-color:transparent;}
  body.light button.primary{background:linear-gradient(180deg,#3a8af0,#2f7fe0);}
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-full{width:100%;margin-top:6px;}

  /* 小控件行（速度/难度/主题）*/
  .ctl-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{border:none;border-radius:0;padding:5px 8px;background:transparent;}
  .seg button.on{background:var(--accent);color:#fff;}
</style>
</head>
<body>
<div id="app">
  <!-- ============ 游戏画布（900×600）============ -->
  <div id="stage"><canvas id="game" width="900" height="600"></canvas></div>

  <!-- ============ 右侧 UI 面板（180px）============ -->
  <aside id="side">
    <div class="brand">🛰️ 元素哨站 <small>v1.0</small></div>

    <!-- 状态：积分 / 生命 / 波次 -->
    <div class="chip">
      <div class="stat-row"><span>💰 积分</span><b id="uiScore">200</b></div>
      <div class="stat-row"><span>❤️ 核心生命</span><b id="uiLives" style="color:var(--bad)">15</b></div>
      <div class="stat-row"><span>🌊 当前波次</span><b id="uiWave">—</b></div>
    </div>

    <!-- 建造选择 -->
    <h3 class="sec">建造塔（点击图标 / 按 1、2）</h3>
    <div class="tower-card" id="card-arrow">
      <canvas width="44" height="44"></canvas>
      <div class="tc-meta"><span class="tc-name">箭塔 <span class="tc-key">1</span></span><span class="tc-cost">💰 60 · 高攻速</span></div>
    </div>
    <div class="tower-card" id="card-cannon">
      <canvas width="44" height="44"></canvas>
      <div class="tc-meta"><span class="tc-name">炮塔 <span class="tc-key">2</span></span><span class="tc-cost">💰 90 · 范围伤</span></div>
    </div>

    <!-- 当前选中塔信息 -->
    <h3 class="sec">当前选中塔</h3>
    <div id="selInfo"></div>

    <!-- 控制按钮 -->
    <button class="primary btn-full" id="btnNextWave">▶ 下一波（跳过等待）</button>
    <div class="btn-grid">
      <button id="btnReset">🔄 重置游戏</button>
      <button id="btnTheme">🌗 明/暗</button>
    </div>

    <!-- 可选：速度 / 难度 -->
    <h3 class="sec">速度</h3>
    <div class="seg" id="speedSeg">
      <button data-sp="0.5">慢</button><button data-sp="1" class="on">正常</button><button data-sp="2">快</button>
    </div>
    <h3 class="sec">难度</h3>
    <div class="seg" id="diffSeg">
      <button data-df="easy">简单</button><button data-df="normal" class="on">普通</button><button data-df="hard">困难</button>
    </div>
  </aside>
</div>

<script>
(() => {
'use strict';
/* ====================================================================
 *  元素哨站（Elemental Outpost）—— 单文件塔防游戏
 *  逻辑与渲染分离：Game.update() 只做状态推进；Game.render() 只负责绘制。
 *  帧率解耦：requestAnimationFrame + 固定步长累加器（STEP=1/60s）。
 *    "帧" = 一次固定步长更新；塔冷却、敌人速度等均以"帧"为单位，
 *    因此逻辑与显示器刷新率无关，且可被 speedMultiplier 整体加速。
 * ==================================================================== */

/* ------------------------------------------------------------------
 * 一、常量与配置（关键数值集中在此，便于核对）
 * ------------------------------------------------------------------ */
const CELL      = 45;              // 每格像素尺寸：20*45=900, 12*45=540
const COLS      = 20;              // 网格列数
const ROWS      = 12;              // 网格行数
const GRID_Y0   = 60;              // 地图顶部偏移（上方 60px 为标题/状态条）
const MAP_W     = COLS * CELL;     // 900
const MAP_H     = ROWS * CELL;     // 540
const STEP      = 1 / 60;          // 固定逻辑步长（秒），即"一帧"
const MAX_STEPS_PER_FRAME = 6;     // 防止后台切回时"死亡螺旋"
const PREP_FRAMES = 5*60;          // 每波结束后的准备时间：5 秒（300 帧）

// ---- 路径定义（网格坐标）----
// 起点(0,5) → 右至(8,5) → 下至(8,9) → 右至终点(19,9)。
const PATH_START = { c:0, r:5 };
const PATH_END   = { c:19,r:9 };

// 路径格子集合（不可建造）。三个线段：
const PATH_CELLS = (() => {
  const s = new Set();
  for (let c=PATH_START.c; c<=8; c++)      s.add(c+','+(5));   // 第5行: col0..8
  for (let r=5; r<=9; r++)                 s.add(8+','+r);     // 第8列: row5..9
  for (let c=8; c<=PATH_END.c; c++)        s.add(c+','+9);     // 第9行: col8..19
  return s;
})();

// 路径移动关键点（像素中心）。首点放在左屏外，让敌人"走进来"。
const WAYPOINTS = [
  { x: -CELL/2,            y: cellCenterY(5) },   // 屏外入口，对齐第5行
  { x: cellCenterX(8),     y: cellCenterY(5) },   // (8,5)
  { x: cellCenterX(8),     y: cellCenterY(9) },   // (8,9)
  { x: cellCenterX(PATH_END.c), y: cellCenterY(9)},// 终点(19,9)：抵达即扣血
];

function cellCenterX(c){ return c*CELL + CELL/2; }
function cellCenterY(r){ return GRID_Y0 + r*CELL + CELL/2; }

/* ---- 塔的数值配置（含升级成长）---- */
const TOWER_TYPES = {
  arrow: { // 箭塔：单目标、高攻速
    name:'箭塔', cost:60, damage:15, range:90, cooldown:20, projSpeed:8, splash:0,
    color:'#e8b34a', barrel:'#7d5a2f',
    up:{ dmgPerLv:10, rangePerLv:12 },  // 每级提升
  },
  cannon:{ // 炮塔：范围溅射、慢攻速（溅射伤害=主伤/2）
    name:'炮塔', cost:90, damage:30, range:120, cooldown:45, projSpeed:6, splash:35,
    color:'#8a97ad', barrel:'#3c4658',
    up:{ dmgPerLv:14, rangePerLv:12 },
  }
};
const MAX_TOWER_LEVEL = 3;

/* ---- 敌人数值配置（基础值；实际生命随波次成长）---- */
// scoreBase：击杀积分基数，最终 = scoreBase + wave*2（见 Game.killScore）
const ENEMY_TYPES = {
  normal:{ name:'普通', hpBase:40, speed:1.2, radius:13, color:'#5aa9ff', dark:'#2f6fbf', scoreBase:15 },
  fast:  { name:'快速', hpBase:20, speed:2.2, radius:10, color:'#ffd257', dark:'#c98a00', scoreBase:20 },
  elite: { name:'精英', hpBase:120,speed:0.9, radius:17, color:'#ff4d5e', dark:'#b31f2d', scoreBase:30 },
};

/* ---- 难度配置（可选）---- */
const DIFFICULTY = {
  easy:   { hpMul:0.8, countAdd:-1 },
  normal: { hpMul:1.0, countAdd:0 },
  hard:   { hpMul:1.45,countAdd:2 },
};

// 每波敌人数量 = 3 + floor(wave/3)（再叠加难度修正，最小 1）
function waveEnemyCount(wave, diff){ return Math.max(1, 3 + Math.floor(wave/3) + DIFFICULTY[diff].countAdd); }
// 每波敌人生命 = 基础值 + floor(wave/3)*成长系数。
//   普通/快速：+floor(wave/3)
//   精英     ：120 + floor(wave/3)*10  ← 与验收清单一致（第5波=130）
function enemyHp(type, wave){
  if (type === 'elite') return ENEMY_TYPES.elite.hpBase + Math.floor(wave/3) * 10;
  return ENEMY_TYPES[type].hpBase + Math.floor(wave/3);
}

/* ---- 明 / 暗 主题（画布取色）---- */
const THEMES = {
  dark:{ bg:'#0f1620', headerBg:'#141d2b', tileA:'#173a2c', tileB:'#153327',
         pathA:'#5b4a37', pathEdge:'#8a6d4e', gridLine:'rgba(255,255,255,.05)',
         text:'#e7edf6', muted:'#9fb0c6', accent:'#4ea1ff', good:'#46d38a', bad:'#ff5d6c' },
  light:{bg:'#eef1f6', headerBg:'#ffffff', tileA:'#bcdcb2', tileB:'#b1d4a7',
         pathA:'#d9c08e', pathEdge:'#b79356', gridLine:'rgba(0,0,0,.06)',
         text:'#1a2330', muted:'#5b6b80', accent:'#2f7fe0', good:'#1faa68', bad:'#e04757' },
};

/* ------------------------------------------------------------------
 * 二、通用工具函数
 * ------------------------------------------------------------------ */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
function dist(x1,y1,x2,y2){ const dx=x1-x2,dy=y1-y2; return Math.hypot(dx,dy); }

/* 预计算路径折线长度，用于把"沿路径行进距离 d"换算成像素坐标 */
const PATH_LEN = (() => {
  let total=0; const cum=[0];
  for(let i=1;i<WAYPOINTS.length;i++){
    total += dist(WAYPOINTS[i-1].x,WAYPOINTS[i-1].y, WAYPOINTS[i].x,WAYPOINTS[i].y);
    cum.push(total);
  }
  return { total, cum };
})();
function posAlongPath(d){
  d = clamp(d,0,PATH_LEN.total);
  for(let i=1;i<WAYPOINTS.length;i++){
    if(d <= PATH_LEN.cum[i]){
      const segLen = PATH_LEN.cum[i]-PATH_LEN.cum[i-1] || 1;
      const t=(d-PATH_LEN.cum[i-1])/segLen;
      return { x:lerp(WAYPOINTS[i-1].x,WAYPOINTS[i].x,t),
               y:lerp(WAYPOINTS[i-1].y,WAYPOINTS[i].y,t) };
    }
  }
  const p=WAYPOINTS[WAYPOINTS.length-1]; return {x:p.x,y:p.y};
}

/* ------------------------------------------------------------------
 * 三、音效（WebAudio 合成；首次用户交互时激活）
 * ------------------------------------------------------------------ */
class SoundFX{
  constructor(){ this.ctx=null; this.master=null; this.enabled=true; }
  ensure(){ // 必须在用户手势中调用，满足浏览器自动播放策略
    if(this.enabled===false) return null;
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  }
  // 通用音：频率 + 时长 + 波形 + 音量 +（可选）下滑到 freqEnd
  tone(freq,dur,type='square',vol=0.5,freqEnd=null){
    const ctx=this.ensure(); if(!ctx) return;
    const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(freqEnd!=null) o.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  }
  shoot(type){ this.tone(type==='cannon'?180:760, 0.08,'square',type==='cannon'?0.35:0.22, type==='cannon'?90:420); }
  hit(){ this.tone(320,0.06,'triangle',0.22,180); }
  death(){ this.tone(220,0.18,'sawtooth',0.3,60); }
  build(){ this.tone(520,0.1,'square',0.3,760); }
  error(){ this.tone(140,0.12,'sawtooth',0.3,90); }
  wave(){ this.tone(440,0.12,'triangle',0.3,880); }
  gameover(){ // 三个下滑音组成"结束"音阶
    [392,311,262].forEach((f,i)=>setTimeout(()=>this.tone(f,0.35,'sawtooth',0.32,f*0.7), i*160));
  }
}

/* ------------------------------------------------------------------
 * 四、粒子（溅射/命中特效）——用对象数组管理，逐帧推进
 * ------------------------------------------------------------------ */
class Particle{
  constructor(x,y,vx,vy,life,color,size){ this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.life=life;this.maxLife=life;this.color=color;this.size=size; }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vx*=0.92; this.vy*=0.92; this.life--; }
  get dead(){ return this.life<=0; }
}

/* ------------------------------------------------------------------
 * 五、敌人
 * ------------------------------------------------------------------ */
class Enemy{
  constructor(type, wave){
    const cfg=ENEMY_TYPES[type];
    this.id = ++Enemy._seq;
    this.type=type; this.cfg=cfg;
    this.maxHp=this.hp=enemyHp(type,wave);
    this.speed=cfg.speed;
    this.radius=cfg.radius;
    this.dist=0;              // 沿路径行进距离（px）
    const p=posAlongPath(0); this.x=p.x; this.y=p.y;
    this.alive=true;
  }
  static _seq=0;
  update(){
    if(!this.alive) return;
    this.dist += this.speed;                 // 每"帧"移动 speed px（与帧率解耦）
    const p=posAlongPath(this.dist);
    this.x=p.x; this.y=p.y;
    if(this.dist>=PATH_LEN.total){           // 抵达终点 → 泄漏
      this.alive=false; this.leaked=true;
    }
  }
  takeDamage(n){
    if(!this.alive) return false;
    this.hp-=n;
    if(this.hp<=0){ this.hp=0; this.alive=false; return true; } // true=被击杀
    return false;
  }
}

/* ------------------------------------------------------------------
 * 六、投射物（箭 / 炮弹）
 *   箭：追踪目标，命中单体；
 *   炮弹：飞向开火瞬间的目标点，落点溅射（主伤全额，其余减半）。
 * ------------------------------------------------------------------ */
class Projectile{
  constructor(x,y,kind,tower,target){
    this.x=x; this.y=y; this.kind=kind;
    this.speed=tower.projSpeed;
    this.damage=tower.damage;                 // 当前等级伤害（主伤）
    this.splash = TOWER_TYPES[kind].splash;   // 溅射半径（箭塔为0）
    this.target=target;                       // 目标引用（箭追踪用）
    this.aimX = target?target.x:x;            // 炮弹的落点（开火瞬间锁定）
    this.aimY = target?target.y:y;
    this.dead=false; this.angle=0;
  }
  update(game){
    const tx=this.target&&this.target.alive ? this.target.x : this.aimX;
    const ty=this.target&&this.target.alive ? this.target.y : this.aimY;
    if(this.kind==='cannon'){ // 炮弹：飞向锁定落点
      this.aimX=tx; this.aimY=ty;   // 轻微跟随（目标存活时）
    }
    const dx=tx-this.x, dy=ty-this.y, d=Math.hypot(dx,dy);
    this.angle=Math.atan2(dy,dx);
    if(d<=this.speed){ // 到达
      this.dead=true;
      return this.impact(game,tx,ty);
    }
    this.x+=dx/d*this.speed; this.y+=dy/d*this.speed;
    return null;
  }
  impact(game,x,y){
    if(this.kind==='arrow'){
      // 单体：命中当前目标（若已死则消失）
      const t=this.target;
      if(t&&t.alive){ game.dealDamageTo(t,this.damage); spawnHitSparks(x,y,'#ffe08a',5); }
      return;
    }
    // 炮弹：溅射。主目标全额，半径内其余敌人减半（=伤害/2）
    const primary=this.target;
    for(const e of game.enemies){
      if(!e.alive) continue;
      if(dist(e.x,e.y,x,y)<=this.splash || (primary&&e===primary)){
        let dmg = (primary && e===primary) ? this.damage : Math.round(this.damage/2); // 减半
        game.dealDamageTo(e,dmg);
      }
    }
    spawnExplosion(x,y,this.colorFor());
    return;
  }
  colorFor(){ return TOWER_TYPES[this.kind].barrel; }
}

/* 粒子生成辅助 */
function spawnHitSparks(x,y,color,n){
  for(let i=0;i<n;i++){ const a=rand(0,Math.PI*2), s=rand(1,3.5);
    particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(14,26)|0,color,rand(1.5,3))); }
}
function spawnExplosion(x,y,color){ // 炮塔爆炸：一圈粒子 + 火花
  for(let i=0;i<18;i++){ const a=i/18*Math.PI*2+rand(-.2,.2), s=rand(2,6);
    particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(24,44)|0,i%2?color:'#ffcf5a',rand(2,4))); }
  for(let i=0;i<8;i++){ const a=rand(0,Math.PI*2), s=rand(.5,2);
    particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(30,50)|0,'#ffffff',rand(1.5,2.6))); }
}

/* ------------------------------------------------------------------
 * 七、塔（建造 / 升级 / 售卖 / 攻击逻辑）
 * ------------------------------------------------------------------ */
class Tower{
  constructor(type,c,r){
    const cfg=TOWER_TYPES[type];
    this.type=type; this.c=c; this.r=r;
    this.x=cellCenterX(c); this.y=cellCenterY(r);
    this.level=1;
    this.damage=cfg.damage; this.range=cfg.range;
    this.cooldownMax=cfg.cooldown; this.cool=0;      // 冷却以"帧"计
    this.projSpeed=cfg.projSpeed; this.splash=cfg.splash;
    this.invested=cfg.cost;                          // 累计投入（用于售卖返还）
    this.aimAngle=-Math.PI/2;                         // 炮管朝向（渲染用，平滑转动）
  }
  get cfg(){ return TOWER_TYPES[this.type]; }
  upgradeCost(){ return Math.round(this.cfg.cost*0.7)*this.level; } // 升级费用随等级递增
  canUpgrade(){ return this.level<MAX_TOWER_LEVEL; }
  upgrade(game){
    if(!this.canUpgrade()) return false;
    const cost=this.upgradeCost();
    if(game.score<cost) { game.flash('积分不足，无法升级'); game.sfx.error(); return false; }
    game.score-=cost; this.level++;
    this.damage += this.cfg.up.dmgPerLv;
    this.range  += this.cfg.up.rangePerLv;
    this.invested+=cost;
    game.sfx.build(); return true;
  }
  sellValue(){ return Math.round(this.invested*0.6); } // 返还 60%
  update(game){
    if(this.cool>0) this.cool--;                       // 冷却递减（每帧）
    const target=this.acquireTarget(game);             // 取范围内最靠前的敌人
    let desired=-Math.PI/2;
    if(target){ desired=Math.atan2(target.y-this.y,target.x-this.x); }
    // 平滑转动炮管朝向（渲染反馈）
    let d=desired-this.aimAngle; while(d> Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    this.aimAngle += clamp(d,-0.18,0.18);
    if(target && this.cool<=0){                        // 开火
      game.projectiles.push(new Projectile(this.x,this.y-6,this.type,this,target));
      this.cool=this.cooldownMax;
      game.sfx.shoot(this.type);
    }
  }
  // 目标选择：范围内"沿路径行进最远"的存活敌人（经典 first-target）
  acquireTarget(game){
    let best=null,bestD=-1;
    for(const e of game.enemies){
      if(!e.alive) continue;
      if(dist(e.x,e.y,this.x,this.y)<=this.range && e.dist>bestD){ best=e; bestD=e.dist; }
    }
    return best;
  }
}

/* ------------------------------------------------------------------
 * 八、游戏主类：状态 + update(逻辑) + render(渲染) + 输入处理
 * ------------------------------------------------------------------ */
class Game{
  constructor(canvas){
    this.canvas=canvas; this.ctx=canvas.getContext('2d');
    this.sfx=new SoundFX();
    // ---- 世界容器 ----
    this.enemies=[]; this.towers=new Map(); this.projectiles=[]; particles.length=0;
    // ---- 状态字段 ----
    this.resetState();
    // ---- 交互 / UI ----
    this.buildType='arrow';            // 当前建造类型（默认箭塔）
    this.selectedKey=null;             // 选中的塔 "c,r"
    this.hover={c:-1,r:-1,valid:false};
    this.message={text:'',t:0};        // 顶部临时提示
    this.speed=1; this.difficulty='normal';
    this.themeName='dark'; this.theme=THEMES.dark;
    // ---- 循环相关 ----
    this.lastTime=performance.now(); this.acc=0;
    this.running=true;
    this.bindInput();
  }

  /* ---------- 状态重置（启动 / 重新开始）---------- */
  resetState(){
    this.enemies=[]; this.towers.clear(); this.projectiles.length=0; particles.length=0;
    this.score=200;                    // 初始积分 200
    this.lives=15;                     // 核心生命 15
    this.currentWave=0;                // 当前波次（进入"下一波"时 +1）
    this.phase='prep';                 // 'prep' | 'wave'
    this.prepTimer=PREP_FRAMES;        // 准备倒计时（帧），启动即开始倒数 → 自动开第1波
    this.toSpawn=[];                   // 待生成敌人队列
    this.spawnTimer=0;
    this.gameOver=false;
    this.selectedKey=null;
    this.message={text:'',t:0};
  }

  /* ---------- 输入绑定 ---------- */
  bindInput(){
    const rectOf=()=>this.canvas.getBoundingClientRect();
    // 首次用户交互激活音频（点击 / 按键均可）
    const firstGesture=()=>{ this.sfx.ensure(); };
    window.addEventListener('pointerdown',firstGesture,{once:false});
    window.addEventListener('keydown',firstGesture);

    this.canvas.addEventListener('mousemove',(e)=>{
      const rc=rectOf(), px=e.clientX-rc.left, py=e.clientY-rc.top;
      const c=Math.floor(px/CELL), r=Math.floor((py-GRID_Y0)/CELL);
      const valid = py>=GRID_Y0 && c>=0&&c<COLS && r>=0&&r<ROWS;
      this.hover={c,r,valid};
    });
    this.canvas.addEventListener('mouseleave',()=>{ this.hover.valid=false; });
    this.canvas.addEventListener('click',(e)=>this.handleClick(e));

    // 键盘：1=箭塔 2=炮塔（切换建造类型）；Esc=取消选中；N=下一波
    window.addEventListener('keydown',(e)=>{
      if(e.key==='1'){ this.setBuildType('arrow'); }
      else if(e.key==='2'){ this.setBuildType('cannon'); }
      else if(e.key==='Escape'){ this.selectedKey=null; refreshPanel(); }
      else if((e.key==='n'||e.key==='N')){ this.skipPrep(); }
    });
  }

  /* ---------- 画布点击：建造 / 选中 / 重新开始按钮 ---------- */
  handleClick(e){
    const rc=this.canvas.getBoundingClientRect(), px=e.clientX-rc.left, py=e.clientY-rc.top;
    if(this.gameOver){ // 仅处理"重新开始"区域
      if(px>=GO_BTN.x&&px<=GO_BTN.x+GO_BTN.w&&py>=GO_BTN.y&&py<=GO_BTN.y+GO_BTN.h) this.reset();
      return;
    }
    const c=Math.floor(px/CELL), r=Math.floor((py-GRID_Y0)/CELL);
    if(py<GRID_Y0||c<0||c>=COLS||r<0||r>=ROWS){ this.selectedKey=null; refreshPanel(); return; }

    const key=c+','+r;
    if(this.towers.has(key)){                 // 点击已建塔 → 选中（查看信息/范围）
      this.selectedKey=key; refreshPanel(); return;
    }
    this.tryBuild(c,r);                       // 空地 → 尝试建造
  }

  /* ---------- 建造逻辑：路径格 / 已占用 / 积分校验 ---------- */
  tryBuild(c,r){
    if(PATH_CELLS.has(c+','+r)){ this.flash('⚠️ 路径上无法建造'); this.sfx.error(); return; } // 路径不可建
    const cfg=TOWER_TYPES[this.buildType];
    if(this.towers.has(c+','+r)){ this.selectedKey=c+','+r; refreshPanel(); return; }
    if(this.score<cfg.cost){ this.flash('⚠️ 积分不足'); this.sfx.error(); return; }
    // 建造成功
    this.score-=cfg.cost;
    const t=new Tower(this.buildType,c,r);
    this.towers.set(c+','+r,t);
    this.selectedKey=c+','+r;                 // 建完即选中，显示范围与信息
    this.sfx.build(); refreshPanel();
  }

  setBuildType(type){ this.buildType=type; this.selectedKey=null; refreshPanel(); }

  /* ---------- 波次控制 ---------- */
  startWave(n){
    this.currentWave=n; this.phase='wave';
    const diff=DIFFICULTY[this.difficulty];
    let count=waveEnemyCount(n,this.difficulty);
    // 组装本波敌人（普通/快速随机混合），精英波额外追加 1 个精英
    for(let i=0;i<count;i++){
      this.toSpawn.push(Math.random()<0.4 ? 'fast' : 'normal');
    }
    if(n%5===0) this.toSpawn.push('elite');   // 每 5 波出现一个精英
    this.spawnTimer=0;
    this.sfx.wave(); refreshPanel();
  }
  skipPrep(){ if(this.phase==='prep' && !this.gameOver){ this.prepTimer=0; } } // 点击"下一波"跳过等待

  /* ---------- 伤害结算 ---------- */
  dealDamageTo(enemy,dmg){
    const killed=enemy.takeDamage(dmg);
    if(killed) this.onKill(enemy); else { this.sfx.hit(); }
  }
  onKill(e){ // 击杀：加分 + 死亡音效 + 特效
    this.score += e.cfg.scoreBase + this.currentWave*2;   // 积分=基数+波次*2（精英30/普通15）
    spawnExplosion(e.x,e.y, e.type==='elite' ? '#ff7a86' : '#fff2c4');
    this.sfx.death(); refreshPanel();
  }

  flash(text){ this.message={text,t:90}; } // 约1.5秒提示

  /* ==================================================================
   *  update：固定步长逻辑推进（一次调用 = "一帧"）
   * ================================================================== */
  update(){
    if(this.gameOver) return;                 // 结束后冻结世界，仅渲染遮罩
    if(this.message.t>0) this.message.t--;

    /* --- 阶段推进：准备 → 倒计时结束自动开波；战斗 → 清场后回到准备 --- */
    if(this.phase==='prep'){
      this.prepTimer--;
      if(this.prepTimer<=0) this.startWave(this.currentWave+1); // 倒计时归零自动开始下一波
    } else { // wave：按间隔生成敌人
      if(this.toSpawn.length>0){
        this.spawnTimer--;
        if(this.spawnTimer<=0){
          const type=this.toSpawn.shift();
          this.enemies.push(new Enemy(type,this.currentWave));
          this.spawnTimer=42;                 // 每 ~0.7s 生成一个
        }
      } else if(this.enemies.length===0){     // 全部清场 → 进入准备阶段（5秒）
        this.phase='prep'; this.prepTimer=PREP_FRAMES; this.sfx.wave(); refreshPanel();
      }
    }

    /* --- 敌人移动 + 泄漏扣血 --- */
    for(const e of this.enemies){
      e.update();
      if(e.leaked && !e._countedLeak){        // 抵达终点扣生命（精英扣2）
        e._countedLeak=true;
        this.lives -= (e.type==='elite'?2:1);
        this.sfx.error(); refreshPanel();
        if(this.lives<=0){ this.lives=0; this.doGameOver(); }
      }
    }

    /* --- 塔攻击 / 投射物 / 粒子 --- */
    for(const t of this.towers.values()) t.update(this);
    for(const p of this.projectiles) if(!p.dead) p.update(this);
    for(let i=particles.length-1;i>=0;i--) { particles[i].update(); if(particles[i].dead) particles.splice(i,1); }

    /* --- 清理死亡实体（击杀/泄漏均移除）--- */
    this.enemies=this.enemies.filter(e=>e.alive && !e.leaked);
    this.projectiles=this.projectiles.filter(p=>!p.dead);

    // 若选中的塔被售卖，清掉选中态
    if(this.selectedKey && !this.towers.has(this.selectedKey)) { this.selectedKey=null; refreshPanel(); }
  }

  doGameOver(){ this.gameOver=true; this.sfx.gameover(); refreshPanel(); }
  reset(){ this.resetState(); this.buildType='arrow'; this.speed=1; syncSpeedSeg(1); refreshPanel(); }

  /* ==================================================================
   *  render：只负责绘制（不改变状态）
   * ================================================================== */
  render(){
    const ctx=this.ctx, th=this.theme;
    // 背景 + 顶部状态条
    ctx.fillStyle=th.bg; ctx.fillRect(0,0,MAP_W,MAP_H+GRID_Y0);
    this.drawHeader(ctx,th);

    // 地图（网格 / 路径）
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const x=c*CELL, y=GRID_Y0+r*CELL;
      if(PATH_CELLS.has(c+','+r)){ this.drawPathCell(ctx,x,y,c,r,th); }
      else { ctx.fillStyle=((c+r)%2)? th.tileA : th.tileB; ctx.fillRect(x,y,CELL,CELL); }
    }
    // 网格线（细）
    ctx.strokeStyle=th.gridLine; ctx.lineWidth=1;
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL+.5,GRID_Y0);ctx.lineTo(c*CELL+.5,GRID_Y0+MAP_H);ctx.stroke();}
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,GRID_Y0+r*CELL+.5);ctx.lineTo(MAP_W,GRID_Y0+r*CELL+.5);ctx.stroke();}

    // 起 / 终点标记
    this.drawEndpoint(ctx,th,true);
    this.drawEndpoint(ctx,th,false);

    // 悬停高亮（建造预览）
    if(this.hover.valid && !this.gameOver) this.drawHover(ctx,th);

    // 选中塔的攻击范围（半透明圆）
    const sel=this.towers.get(this.selectedKey);
    if(sel){ drawRangeCircle(this.ctx,this.xOf(sel),sel.y,sel.range,th.accent); }

    // 实体：塔 → 敌人(+血条) → 投射物 → 粒子
    for(const t of this.towers.values()) drawTowerSprite(ctx,t.x,t.y,t.type,t.aimAngle,t.level);
    for(const e of this.enemies){ drawEnemy(ctx,e,th); }
    for(const p of this.projectiles) drawProjectile(ctx,p);
    for(const pt of particles){ ctx.globalAlpha=clamp(pt.life/pt.maxLife,0,1);
      ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;

    // 临时提示（顶部中央）
    if(this.message.t>0) this.drawMessage(ctx,th);

    // 准备阶段大倒计时
    if(this.phase==='prep' && !this.gameOver) this.drawPrepOverlay(ctx,th);

    // 游戏结束遮罩 + "重新开始"按钮
    if(this.gameOver) this.drawGameOver(ctx,th);
  }

  xOf(t){ return cellCenterX(t.c); }

  drawHeader(ctx,th){
    ctx.fillStyle=th.headerBg; ctx.fillRect(0,0,MAP_W,GRID_Y0);
    // 底边线
    ctx.strokeStyle='rgba(128,140,160,.25)'; ctx.beginPath(); ctx.moveTo(0,GRID_Y0+.5); ctx.lineTo(MAP_W,GRID_Y0+.5); ctx.stroke();
    // 标题
    ctx.fillStyle=th.text; ctx.font='700 20px "Segoe UI",sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillText('🛰️ 元素哨站',14,GRID_Y0/2);
    // 状态文字（与侧栏一致，便于大屏查看）
    const waveLabel = this.phase==='wave' ? `第 ${this.currentWave} 波` : `准备 · 第 ${this.currentWave+1} 波`;
    ctx.font='600 15px "Segoe UI",sans-serif';
    const items=[['💰 '+this.score,th.text],['❤️ '+this.lives,'#ff8a94'],['🌊 '+waveLabel,th.accent]];
    let x=MAP_W-230;
    for(const [t,col] of items){ ctx.fillStyle=col; ctx.fillText(t,x,GRID_Y0/2); x+=78; }
    // 临时提示占位（若存在）在中央显示，这里不重复画
  }

  drawPathCell(ctx,x,y,c,r,th){
    ctx.fillStyle=th.pathA; ctx.fillRect(x,y,CELL,CELL);
    // 内侧亮边，营造"道路"感
    ctx.strokeStyle=th.pathEdge; ctx.lineWidth=3;
    ctx.strokeRect(x+1.5,y+1.5,CELL-3,CELL-3);
  }

  drawEndpoint(ctx,th,isStart){
    const p=isStart?{x:0,y:cellCenterY(5)}:{x:MAP_W,y:cellCenterY(9)};
    ctx.save();
    ctx.fillStyle= isStart ? th.good : th.bad;
    // 起点：左侧入口箭头；终点：右侧核心（发光圆）
    if(isStart){
      const cx=Math.max(6,p.x+4), cy=p.y;
      ctx.beginPath(); ctx.moveTo(cx-8,cy-10); ctx.lineTo(cx+12,cy); ctx.lineTo(cx-8,cy+10); ctx.closePath(); ctx.fill();
    } else {
      const cx=p.x-8, cy=p.y;
      const g=ctx.createRadialGradient(cx,cy,2,cx,cy,16); g.addColorStop(0,'#ffd0d6'); g.addColorStop(1,th.bad);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,14,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.restore();
  }

  drawHover(ctx,th){
    const {c,r}=this.hover; if(c<0||r>=COLS||r<0||r>=ROWS) return;
    const x=c*CELL,y=GRID_Y0+r*CELL;
    const blocked = PATH_CELLS.has(c+','+r) || this.towers.has(c+','+r);
    const okCost  = this.score >= TOWER_TYPES[this.buildType].cost;
    const good = !blocked && okCost;
    ctx.save();
    // 格子高亮
    ctx.fillStyle= good ? 'rgba(70,211,138,.25)' : 'rgba(255,93,108,.25)';
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle= good ? th.good : th.bad; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,CELL-2,CELL-2);
    // 范围预览（半透明圆）
    if(good){ drawRangeCircle(ctx,x+CELL/2,y+CELL/2,TOWER_TYPES[this.buildType].range, good?th.good:th.bad, .5); }
    ctx.restore();
  }

  drawMessage(ctx,th){
    const a=clamp(this.message.t/40,0,1);
    ctx.save(); ctx.globalAlpha=a;
    ctx.font='600 15px "Segoe UI",sans-serif'; ctx.textAlign='center';
    const w=ctx.measureText(this.message.text).width+28;
    ctx.fillStyle='rgba(0,0,0,.55)'; roundRect(ctx,(MAP_W-w)/2,GRID_Y0+14,w,30,8); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(this.message.text,MAP_W/2,GRID_Y0+30);
    ctx.restore();
  }

  drawPrepOverlay(ctx,th){
    const sec=Math.ceil(this.prepTimer/60); // 秒（向下取整显示）
    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle=th.muted; ctx.font='700 18px "Segoe UI",sans-serif';
    ctx.fillText('准备阶段',MAP_W/2,GRID_Y0+96);
    ctx.fillStyle=th.accent; ctx.font='800 46px "Segoe UI",sans-serif';
    ctx.fillText(sec+'s',MAP_W/2,GRID_Y0+150);
    ctx.fillStyle=th.muted; ctx.font='600 14px "Segoe UI",sans-serif';
    ctx.fillText(`第 ${this.currentWave+1} 波即将开始 · 点击「下一波」跳过`,MAP_W/2,GRID_Y0+186);
    ctx.restore();
  }

  drawGameOver(ctx,th){
    // 半透明遮罩
    ctx.save(); ctx.fillStyle='rgba(4,7,12,.72)'; ctx.fillRect(0,0,MAP_W,MAP_H+GRID_Y0);
    ctx.textAlign='center';
    ctx.fillStyle='#ff5d6c'; ctx.font='800 56px "Segoe UI",sans-serif';
    ctx.fillText('游戏结束',MAP_W/2,232);
    ctx.fillStyle=th.text; ctx.font='600 18px "Segoe UI",sans-serif';
    ctx.fillText(`你坚守到了第 ${this.currentWave} 波 · 最终积分 ${this.score}`,MAP_W/2,278);
    // “重新开始”按钮（画布内）
    const b=GO_BTN;
    roundRect(ctx,b.x,b.y,b.w,b.h,10); ctx.fillStyle='#4ea1ff'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 20px "Segoe UI",sans-serif';
    ctx.fillText('🔄 重新开始',b.x+b.w/2,b.y+b.h/2+1);
    ctx.restore();
  }

  /* ---------- 固定步长主循环（帧率解耦核心）---------- */
  frame(now){
    if(!this.running) return;
    let dt=(now-this.lastTime)/1000; this.lastTime=now;
    if(dt>0.25) dt=0.25;                 // 防止后台切回产生巨大 dt
    this.acc += dt*this.speed;           // speedMultiplier：整体加速/减速
    let steps=0;
    while(this.acc>=STEP && steps<MAX_STEPS_PER_FRAME){ this.update(); this.acc-=STEP; steps++; }
    if(steps===MAX_STEPS_PER_FRAME) this.acc=Math.min(this.acc,STEP*2); // 丢弃过多积压，避免螺旋
    this.render();
    updateLivePanel();                   // 轻量 DOM 同步（积分/生命/波次）
    requestAnimationFrame((t)=>this.frame(t));
  }
}

/* ------------------------------------------------------------------
 * 九、绘制辅助函数（塔 / 敌人 / 投射物 / 范围圈）——与逻辑解耦
 * ------------------------------------------------------------------ */
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawRangeCircle(ctx,x,y,range,color,alpha=1){
  ctx.save(); ctx.globalAlpha=alpha*0.9;
  ctx.fillStyle=color+'22';               // 半透明填充（用颜色+两位十六进制透明度）
  ctx.beginPath(); ctx.arc(x,y,range,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=2; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.arc(x,y,range,0,Math.PI*2); ctx.stroke();
  ctx.restore(); ctx.setLineDash([]);
}

/* 塔精灵：底座 + 旋转炮管 + 等级标记（在-game 与侧栏图标复用） */
function drawTowerSprite(ctx,cx,cy,type,angle,level=1){
  const cfg=TOWER_TYPES[type];
  // 阴影
  ctx.save(); ctx.globalAlpha=0.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,cy+14,16,7,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  // 底座（渐变圆形）
  const g=ctx.createRadialGradient(cx-5,cy-6,3,cx,cy,20);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.18,cfg.color); g.addColorStop(1,cfg.barrel);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,17,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke();
  // 炮管（朝 angle）
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  if(type==='arrow'){
    ctx.fillStyle='#3b2a12'; roundRect(ctx,-4,-4,26,8,3); ctx.fill();   // 箭塔：细长枪管
    ctx.fillStyle=cfg.color; roundRect(ctx,16,-5,8,10,2); ctx.fill();
  } else {
    ctx.fillStyle='#2a3342'; roundRect(ctx,-6,-7,30,14,4); ctx.fill();   // 炮塔：粗短炮管
    ctx.fillStyle=cfg.color; roundRect(ctx,20,-9,8,18,2); ctx.fill();
  }
  ctx.restore();
  // 中心枢纽
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,4.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1; ctx.stroke();
  // 等级标记（小菱形，数量=level）
  for(let i=0;i<level;i++){ const lx=cx-(level-1)*5+i*10;
    ctx.fillStyle='#ffd257'; ctx.save(); ctx.translate(lx,cy+9); ctx.rotate(Math.PI/4);
    ctx.fillRect(-3,-3,6,6); ctx.restore(); }
}

/* 敌人精灵：圆身 + 眼睛 + 阴影；精英更大更红 */
function drawEnemy(ctx,e,th){
  const cfg=e.cfg;
  // 阴影
  ctx.save(); ctx.globalAlpha=0.28; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(e.x,e.y+e.radius*0.7,e.radius*0.9,e.radius*0.4,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  // 身体（径向渐变，立体感）
  const g=ctx.createRadialGradient(e.x-e.radius*0.35,e.y-e.radius*0.4,1,e.x,e.y,e.radius+2);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.2,cfg.color); g.addColorStop(1,cfg.dark);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,e.radius,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke();
  // 精英：外圈光环
  if(e.type==='elite'){ ctx.save(); ctx.globalAlpha=0.5+0.4*Math.sin(performance.now()/180);
    ctx.strokeStyle='#ff9aa2'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(e.x,e.y,e.radius+4,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  // 眼睛（朝行进方向，简单两白点）
  const dir=Math.atan2( (posAlongPath(e.dist+1).y-e.y), (posAlongPath(e.dist+1).x-e.x) );
  for(const s of [-0.5,0.5]){ const ex=e.x+Math.cos(dir+s)*e.radius*0.4, ey=e.y+Math.sin(dir+s)*e.radius*0.4;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,e.radius*0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(ex+Math.cos(dir),ey+Math.sin(dir),e.radius*0.13,0,Math.PI*2); ctx.fill(); }
  // 血条（实时）：红底 + 绿值
  const bw=e.radius*2, bh=4, bx=e.x-e.radius, by=e.y-e.radius-9;
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  ctx.fillStyle='#ff5d6c'; ctx.fillRect(bx,by,bw,bh);
  const hpFrac=clamp(e.hp/e.maxHp,0,1);
  ctx.fillStyle= hpFrac>0.5 ? '#46d38a' : (hpFrac>0.25?'#ffd257':'#ff5d6c');
  ctx.fillRect(bx,by,bw*hpFrac,bh);
}

/* 投射物精灵：箭（细长）/ 炮弹（圆） */
function drawProjectile(ctx,p){
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle);
  if(p.kind==='arrow'){
    ctx.fillStyle='#f4e2b0'; roundRect(ctx,-8,-1.6,14,3.2,1.5); ctx.fill();   // 箭杆
    ctx.beginPath(); ctx.moveTo(6,-3.5); ctx.lineTo(11,0); ctx.lineTo(6,3.5); ctx.closePath();
    ctx.fillStyle='#c9d3e0'; ctx.fill();                                       // 箭头
    ctx.fillStyle='#b04a3e'; roundRect(ctx,-8,-2.4,3,4.8,1); ctx.fill();       // 箭羽
  } else {
    const g=ctx.createRadialGradient(-2,-2,1,0,0,6); g.addColorStop(0,'#cfd6e2'); g.addColorStop(1,'#2a3342');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,5.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.restore();
}

/* ------------------------------------------------------------------
 * 十、侧栏 UI（DOM）：塔图标渲染 + 信息面板 + 按钮联动
 * ------------------------------------------------------------------ */
const ui={}; // 缓存 DOM 引用
function cacheUI(){
  ['uiScore','uiLives','uiWave','selInfo','card-arrow','card-cannon',
   'btnNextWave','btnReset','btnTheme','speedSeg','diffSeg'].forEach(id=>{ ui[id]=document.getElementById(id); });
}
function renderTowerIcons(){ // 侧栏两个塔图标（复用绘制函数，"逼真建筑 UI"）
  const draw=(card,type)=>{ const c=card.querySelector('canvas'); const x=c.getContext('2d');
    x.clearRect(0,0,c.width,c.height); drawTowerSprite(x,c.width/2,c.height/2+4,type,-Math.PI/2,1); };
  draw(ui['card-arrow'],'arrow'); draw(ui['card-cannon'],'cannon');
}
function updateLivePanel(){ // 每帧轻量同步（数字变化）
  ui.uiScore.textContent=game.score;
  ui.uiLives.textContent=game.lives;
  const wl = game.gameOver ? '结束' : (game.phase==='wave' ? `第 ${game.currentWave} 波` : `准备·${game.currentWave+1}`);
  ui.uiWave.textContent = wl;
  // "下一波"按钮可用性（仅准备阶段可跳过；结束后禁用）
  ui.btnNextWave.disabled = game.gameOver || !(game.phase==='prep');
}
function refreshPanel(){ // 选中塔信息 + 建造卡片高亮（交互时调用）
  // 建造卡片 active 态
  ui['card-arrow'].classList.toggle('active', !game.selectedKey && game.buildType==='arrow');
  ui['card-cannon'].classList.toggle('active', !game.selectedKey && game.buildType==='cannon');

  const el=ui.selInfo; let html='';
  const selTower = game.towers.get(game.selectedKey);
  if(selTower){ // —— 已选中塔：显示详情 + 升级/售卖 ——
    const t=selTower, up=t.canUpgrade();
    html += `<div id="selTitle">${t.type==='arrow'?'🏹':'💣'} ${t.cfg.name} <span style="color:var(--gold);font-size:11px">Lv.${t.level}</span></div>`;
    html += row('伤害', t.damage) + row('范围', Math.round(t.range)) + row('冷却(帧)', t.cooldownMax);
    if(t.type==='cannon') html += row('溅射伤害', Math.round(t.damage/2)); // 减半显示
    const sell=t.sellValue();
    html += `<div style="display:flex;gap:6px;margin-top:8px">`;
    html += up? `<button class="btn-up" data-k="${game.selectedKey}" style="flex:1;font-size:12px;padding:6px">⬆ 升级 💰${t.upgradeCost()}</button>`
               : `<span style="flex:1;text-align:center;color:var(--muted);font-size:12px;padding:4px">已满级</span>`;
    html += `<button class="btn-sell" data-k="${game.selectedKey}" style="flex:1;font-size:12px;padding:6px;background:linear-gradient(180deg,#ff5d6c33,transparent)">售卖 💰${sell}</button></div>`;
  } else { // —— 未选中：显示当前建造类型预览 + 提示 ——
    const cfg=TOWER_TYPES[game.buildType];
    html += `<div id="selTitle">${game.buildType==='arrow'?'🏹':'💣'} ${cfg.name}（待建造）</div>`;
    html += row('伤害', cfg.damage) + row('范围', cfg.range) + row('冷却(帧)', cfg.cooldownMax);
    if(game.buildType==='cannon') html += row('溅射伤害', Math.round(cfg.damage/2));
    html += `<div style="margin-top:8px;color:var(--muted)">点击空地建造 · 点击已建塔查看详情</div>`;
  }
  el.innerHTML=html;
  // 绑定升级 / 售卖按钮
  el.querySelectorAll('.btn-up').forEach(b=>b.onclick=()=>{ const t=game.towers.get(b.dataset.k); if(t&&t.upgrade(game)) refreshPanel(); });
  el.querySelectorAll('.btn-sell').forEach(b=>b.onclick=()=>sellTower(b.dataset.k));
}
function row(k,v){ return `<div class="row"><span>${k}</span><b>${v}</b></div>`; }

function sellTower(key){ const t=game.towers.get(key); if(!t) return;
  game.score += t.sellValue(); game.towers.delete(key); game.selectedKey=null; game.sfx.hit(); refreshPanel(); updateLivePanel(); }

/* ---- 按钮 / 分段控件绑定 ---- */
function bindControls(){
  ui['card-arrow'].onclick =()=>{ if(!game.gameOver){ game.setBuildType('arrow'); } };
  ui['card-cannon'].onclick=()=>{ if(!game.gameOver){ game.setBuildType('cannon'); } };
  ui.btnNextWave.onclick   =()=>game.skipPrep();
  ui.btnReset.onclick      =()=>game.reset();
  ui.btnTheme.onclick      =toggleTheme;

  // 速度分段（整体加速，逻辑仍按固定步长）
  ui.speedSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ game.speed=parseFloat(b.dataset.sp); syncSpeedSeg(game.speed); });
  // 难度分段（影响后续波次的生命/数量）
  ui.diffSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ game.difficulty=b.dataset.df; syncDiffSeg(game.difficulty); refreshPanel(); });

  function syncSpeedSeg(sp){ ui.speedSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.sp)===sp)); }
  function syncDiffSeg(df){ ui.diffSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.df===df)); }
  // 暴露给 Game.reset 使用
  window.__syncSpeed=syncSpeedSeg;
}

/* ---- 主题切换（DOM class + 画布取色对象）---- */
function toggleTheme(){
  const isLight=document.body.classList.toggle('light');
  game.themeName=isLight?'light':'dark'; game.theme=THEMES[game.themeName];
  // 让 canvas 背景即时生效（render 每帧都会重绘，无需额外处理）
}

/* ------------------------------------------------------------------
 * 十一、启动
 * ------------------------------------------------------------------ */
const GO_BTN={ x:360,y:332,w:180,h:54 };   // “重新开始”按钮在画布内的矩形
let particles=[];                            // 全局粒子池（渲染/更新共享）

function boot(){
  cacheUI();
  const game=new Game(document.getElementById('game'));
  window.game=game;                          // 便于调试 / 控制引用
  renderTowerIcons();
  bindControls();
  refreshPanel(); updateLivePanel();
  requestAnimationFrame((t)=>{ game.lastTime=t; game.frame(t); });
}

// 让 Game.reset 能同步速度分段显示（bindControls 里挂载）
const _origReset=Game.prototype.reset;
if(!window.__syncSpeed){ /* reset 前尚未绑定则忽略，绑定后正常 */ }

document.addEventListener('DOMContentLoaded',boot);
})();
</script>

<!-- ====================================================================
 验收清单回答（按题目要求以注释形式列出）
 -------------------------------------------------------------------- 
 Q1. 路径起点和终点坐标是否正确？
     是。逻辑上路径从 (0,5) → (8,5) → (8,9) → 终点(19,9)。
     像素关键点：入口(-22.5, 307.5)[对齐第5行] → center(8,5)=(382.5,307.5)
       → center(8,9)=(382.5,487.5) → center(19,9)=(877.5,487.5)。
     抵达终点(19,9)即判定泄漏并扣生命，符合"右侧终点(19,9)"。

 Q2. 炮塔溅射伤害是否为15（减半）？
     是。炮弹落点后：被瞄准的主目标吃全额 damage=30；半径35内其余敌人吃
       Math.round(damage/2)=15，即"溅射伤害减半"。基础值精确为15。

 Q3. 第5波精英是否会出现且生命值为120+floor(5/3)*10=130？
     是。每 5 的整数波波次(wave%5===0)追加 1 个 elite；
       enemyHp('elite',wave)=120+floor(wave/3)*10，第5波=floor(5/3)=1 → 120+10=130。

 Q4. 点击路径格子是否无法建造？
     是。PATH_CELLS 标记了三个线段的所有格子；tryBuild() 命中即拒绝并提示
       "⚠️ 路径上无法建造"，且悬停时以红色高亮表示不可建。

 Q5. 生命归零时是否显示游戏结束遮罩？
     是。lives<=0 触发 doGameOver()；render() 绘制半透明遮罩 + "游戏结束"文字，
       并给出可点击的画布内"重新开始"按钮（侧栏"重置游戏"亦可）。

 Q6. 在准备阶段是否会自动倒计时？
     是。phase==='prep' 时 prepTimer 每帧 -1；顶部与中央显示秒数；归零自动
       startWave()，也可点"下一波"(或按 N)跳过等待。

 Q7. 游戏启动后是否在倒计时结束后自动开始第1波，且第1波生成3个敌人？
     是。resetState() 初始 phase='prep'、prepTimer=5s(300帧)，currentWave=0；
       倒计时结束 startWave(1)；数量=3+floor(1/3)=3，且 wave1%5!=0 无精英 → 恰好3个敌人。
 ==================================================================== -->
