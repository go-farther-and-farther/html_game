<style>

*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 Inter,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit}

</style>

function buildPath(map){const cells=new Set(),wps=[];for(const p of map.pts)wps.push({x:cx(p[0]),y:cy(p[1])});wps.unshift({x:wps[0].x-CELL,y:wps[0].y});for(let i=0;i<map.pts.length-1;i++){const[a,b]=[map.pts[i],map.pts[i+1]];if(a[0]===b[0])for(let r=Math.min(a[1],b[1]);r<=Math.max(a[1],b[1]);r++)cells.add(a[0]+','+r);else for(let c=Math.min(a[0],b[0]);c<=Math.max(a[0],b[0]);c++)cells.add(c+','+a[1]);}let total=0;const cum=[0];for(let i=1;i<wps.length;i++){total+=dist(wps[i-1].x,wps[i-1].y,wps[i].x,wps[i].y);cum.push(total)}return{cells,wps,cum,total}}
