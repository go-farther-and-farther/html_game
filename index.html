<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 游戏合集</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    padding: 32px 16px;
    color: #fff;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h1 {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #f5af19, #f12711);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .actions button {
    padding: 10px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-history {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
  }

  .btn-history:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(102,126,234,0.4);
  }

  .btn-clear {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.15) !important;
  }

  .btn-clear:hover {
    background: rgba(255,0,0,0.2);
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin: 32px 0 16px;
    padding-left: 12px;
    border-left: 4px solid #f5af19;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .game-card {
    display: block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 22px 16px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    transition: all 0.25s;
  }

  .game-card:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(245,175,25,0.5);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  .game-card .icon {
    font-size: 36px;
    margin-bottom: 10px;
  }

  .game-card .name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .game-card .desc {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    line-height: 1.5;
  }

  .game-card .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    background: linear-gradient(135deg, #f5af19, #f12711);
    color: #fff;
  }

  .game-card .last-play {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    margin-top: 8px;
  }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>HTML 游戏合集</h1>
    <p>纯 HTML / CSS / JavaScript 实现 · 浏览器直接打开即玩</p>
  </div>

  <div class="actions">
    <button class="btn-history" onclick="location.href='history.html'">📊 历史记录</button>
    <button class="btn-clear" onclick="clearAllHistory()">🗑️ 清空记录</button>
  </div>

  <!-- 卡片全部由下方 GAMES 清单生成 -->
  <div id="catalog"></div>

  <footer>HTML 游戏合集 · 本地运行 · 数据存储在本机 · MIT License</footer>
</div>

<script src="js/history.js"></script>
<script>
  /* ============================================================
     游戏清单 —— 新增游戏只改这里
     section : 分组标题，按首次出现的顺序生成分组
     id      : 历史记录用的游戏 ID，留空则不显示「最近游玩」
     tag     : 可选角标，如 推荐 / 导航
     ============================================================ */
  const GAMES = [
    // ---------- 经典小游戏 ----------
    { section: '🎮 经典小游戏', id: '2048',         icon: '🔢', name: '2048',          href: '2048/2048.HTML',             desc: '经典 4×4 数字合并' },
    { section: '🎮 经典小游戏', id: '2048-5x5',     icon: '🔢', name: '2048 5×5',      href: '2048/2048-5x5.html',         desc: '大棋盘版 · 更容易' },
    { section: '🎮 经典小游戏', id: '2048-ai',      icon: '🤖', name: '2048 AI',       href: '2048/2048-ai.html',          desc: '4×4 AI 自动对战' },
    { section: '🎮 经典小游戏', id: '2048-ai-5x5',  icon: '🤖', name: '2048 AI 5×5',   href: '2048/2048-ai-5x5.html',      desc: '5×5 更容易冲 4096' },
    { section: '🎮 经典小游戏', id: '2048-auto',    icon: '⚡', name: '2048 自动化',   href: '2048/2048-auto.html',        desc: '一直右下 · 纪律至上' },
    { section: '🎮 经典小游戏', id: 'tetris',       icon: '🧱', name: '俄罗斯方块',    href: '俄罗斯方块/俄罗斯方块.html', desc: '经典方块消除' },
    { section: '🎮 经典小游戏', id: 'snake',        icon: '🐍', name: '贪吃蛇',        href: '贪吃蛇/贪吃蛇.html',         desc: '基础版贪吃蛇' },

    // ---------- 人机贪吃蛇系列 ----------
    { section: '🤖 人机贪吃蛇系列', id: 'snake-ai1',        icon: '⚔️', name: '人机版贪吃蛇',     href: '贪吃蛇/人机版贪吃蛇.html',      desc: 'AI 对战 · 初版' },
    { section: '🤖 人机贪吃蛇系列', id: 'snake-ai2',        icon: '🧠', name: '人机版贪吃蛇2',    href: '贪吃蛇/人机版贪吃蛇2.html',     desc: 'AI 进阶版' },
    { section: '🤖 人机贪吃蛇系列', id: 'snake-ai3',        icon: '⭐', name: '人机版贪吃蛇3',    href: '贪吃蛇/人机版贪吃蛇3.html',     desc: '完整版 · 队友/猎杀模式', tag: '推荐' },
    { section: '🤖 人机贪吃蛇系列', id: 'snake-ai35',       icon: '🌟', name: '人机版贪吃蛇3.5',  href: '贪吃蛇/人机版贪吃蛇3.5.html',   desc: '增强版' },
    { section: '🤖 人机贪吃蛇系列', id: 'snake-ai4',        icon: '🔥', name: '人机版贪吃蛇4',    href: '贪吃蛇/人机版贪吃蛇4.html',     desc: '高级 AI 版' },
    { section: '🤖 人机贪吃蛇系列', id: 'snake-ai5',        icon: '💎', name: '人机版贪吃蛇5',    href: '贪吃蛇/人机版贪吃蛇5.html',     desc: '终极 AI 版' },
    { section: '🤖 人机贪吃蛇系列', id: 'snake-adventure',  icon: '🗺️', name: '贪吃蛇大冒险V6',   href: '贪吃蛇/贪吃蛇大冒险V6.html',    desc: '冒险模式' },

    // ---------- 3D 与大项目（这些游戏不接 HistoryManager，故无 id） ----------
    { section: '🌌 3D 与大项目', icon: '🚢', name: '泰坦尼克号',        href: '泰坦尼克号/titanic.html',                    desc: '3D 泰坦尼克号体验 · three.js' },
    { section: '🌌 3D 与大项目', icon: '🏪', name: '雨夜便利店',        href: '雨夜便利店/index.html',                      desc: '3D 雨夜便利店场景 · three.js' },
    { section: '🌌 3D 与大项目', icon: '⛽', name: '雨夜加油站',        href: '雨夜加油站/index.html',                      desc: '3D 雨夜加油站场景' },
    { section: '🌌 3D 与大项目', icon: '🚲', name: '鹈鹕骑车 · 版本导航', href: '鹈鹕骑车3D/versions.html',                 desc: '10 个版本 · 正式迭代与模型测试分组', tag: '导航' },
    { section: '🌌 3D 与大项目', icon: '🏹', name: '塔防 · 元素前哨',   href: '塔防游戏/elemental_outpostV7.html',          desc: '元素塔防 V7 · 附设计文档与测试' },
    { section: '🌌 3D 与大项目', icon: '⛏️', name: '我的世界',          href: '我的世界/minicraft3.html',                   desc: 'minicraft 类沙盒 · 第 3 版' },
    { section: '🌌 3D 与大项目', icon: '🔮', name: '修仙天赋模拟器',    href: '修仙天赋模拟器/修仙天赋模拟器-v2.html',      desc: '修仙天赋随机模拟 · v2' },

    // ---------- 实用工具 ----------
    { section: '🛠 实用工具', icon: '✅', name: '人生已完成清单', href: '人生清单_v2.html', desc: '打卡你已完成的人生成就' },
  ];

  function makeCard(game) {
    const card = document.createElement('a');
    card.className = 'game-card';
    card.href = game.href;

    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = game.icon;

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = game.name;

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = game.desc;

    card.append(icon, name, desc);

    if (game.tag) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = game.tag;
      card.append(tag);
    }

    if (game.id) {
      card.dataset.game = game.id;
      const last = document.createElement('div');
      last.className = 'last-play';
      last.id = 'last-' + game.id;
      card.append(last);
    }

    return card;
  }

  function renderCatalog() {
    const root = document.getElementById('catalog');
    let currentSection = null;
    let grid = null;

    GAMES.forEach(game => {
      if (game.section !== currentSection) {
        currentSection = game.section;
        const title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = currentSection;
        root.append(title);

        grid = document.createElement('div');
        grid.className = 'game-grid';
        root.append(grid);
      }
      grid.append(makeCard(game));
    });
  }

  // 显示每个游戏的最近游玩时间（游戏 ID 直接来自 GAMES 清单）
  function showLastPlayTimes() {
    const games = HistoryManager.getAllGames();

    GAMES.filter(game => game.id).forEach(game => {
      const el = document.getElementById('last-' + game.id);
      if (!el) return;
      const records = games[game.id] || [];
      if (records.length === 0) return;

      const last = records[records.length - 1];
      const d = new Date(last.time);
      const dateStr = (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
                      d.getHours().toString().padStart(2, '0') + ':' +
                      d.getMinutes().toString().padStart(2, '0');
      el.textContent = '最近: ' + dateStr + ' · 最高 ' + (last.bestScore || last.score || '-') + '分';
    });
  }

  function clearAllHistory() {
    if (confirm('确定清空所有游戏历史记录？')) {
      HistoryManager.clearAll();
      location.reload();
    }
  }

  renderCatalog();
  showLastPlayTimes();
</script>
</body>
</html>
