<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 AI 自动对战</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #faf8ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
  }

  .container {
    width: min(90vw, 90vh, 500px);
    max-width: 500px;
  }

  /* ---------- 顶栏 ---------- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .title {
    font-size: 48px;
    font-weight: 800;
    color: #776e65;
  }

  .title .ai-tag {
    font-size: 16px;
    background: #f65e3b;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #bbada0;
    color: #fff;
    border-radius: 6px;
    padding: 8px 16px;
    text-align: center;
    min-width: 70px;
  }

  .score-box .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.85;
  }

  .score-box .value {
    font-size: 20px;
    font-weight: 700;
  }

  /* ---------- 控制栏 ---------- */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn:active {
    background: #9f8b77;
  }

  .btn.running {
    background: #f65e3b;
  }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #776e65;
  }

  .speed-control input {
    width: 80px;
  }

  /* ---------- 棋盘 ---------- */
  .board-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    background: #bbada0;
    border-radius: 12px;
    overflow: hidden;
  }

  .board {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    padding: 12px;
  }

  .cell-bg {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }

  .tile-layer {
    position: absolute;
    inset: 0;
    padding: 12px;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    border-radius: 6px;
    transition: top 0.08s ease, left 0.08s ease;
    z-index: 10;
  }

  .tile[data-value="2"]    { background: #eee4da; color: #776e65; }
  .tile[data-value="4"]    { background: #ede0c8; color: #776e65; }
  .tile[data-value="8"]    { background: #f2b179; color: #f9f6f2; }
  .tile[data-value="16"]   { background: #f59563; color: #f9f6f2; }
  .tile[data-value="32"]   { background: #f67c5f; color: #f9f6f2; }
  .tile[data-value="64"]   { background: #f65e3b; color: #f9f6f2; }
  .tile[data-value="128"]  { background: #edcf72; color: #f9f6f2; }
  .tile[data-value="256"]  { background: #edcc61; color: #f9f6f2; }
  .tile[data-value="512"]  { background: #edc850; color: #f9f6f2; }
  .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; }
  .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; }
  .tile[data-value="4096"] { background: #3c3a32; color: #f9f6f2; }

  /* ---------- 统计面板 ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
    background: rgba(187, 173, 160, 0.2);
    border-radius: 8px;
    padding: 12px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-item .stat-label {
    font-size: 11px;
    color: #776e65;
    opacity: 0.7;
  }

  .stat-item .stat-value {
    font-size: 16px;
    font-weight: 700;
    color: #776e65;
  }

  /* ---------- 多局统计 ---------- */
  .batch-stats {
    margin-top: 12px;
    background: rgba(187, 173, 160, 0.2);
    border-radius: 8px;
    padding: 12px;
  }

  .batch-stats h3 {
    font-size: 14px;
    color: #776e65;
    margin-bottom: 8px;
  }

  .batch-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .batch-item {
    text-align: center;
    background: rgba(255,255,255,0.5);
    border-radius: 6px;
    padding: 8px;
  }

  .batch-item .batch-label {
    font-size: 11px;
    color: #776e65;
    opacity: 0.7;
  }

  .batch-item .batch-value {
    font-size: 18px;
    font-weight: 700;
    color: #776e65;
  }

  .hint {
    text-align: center;
    margin-top: 12px;
    color: #776e65;
    font-size: 12px;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">2048<span class="ai-tag">AI</span></div>
    <div class="scores">
      <div class="score-box">
        <div class="label">分数</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">最大</div>
        <div class="value" id="maxTile">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="startBtn">▶ 开始AI</button>
    <button class="btn" id="resetBtn">🔄 重置</button>
    <button class="btn" id="batchBtn">📊 跑10局</button>
    <div class="speed-control">
      <span>速度</span>
      <input type="range" id="speedSlider" min="1" max="100" value="50">
      <span id="speedLabel">50</span>
    </div>
  </div>

  <div class="controls" style="margin-top: 8px;">
    <div class="speed-control">
      <span>AI辅助步数</span>
      <input type="number" id="aiStepsInput" value="0" min="0" style="width:60px; padding:4px; border:1px solid #ccc; border-radius:4px;">
      <span>(0=无限)</span>
    </div>
    <button class="btn" id="manualBtn" style="display:none;">🎮 手动模式</button>
  </div>

  <div class="board-wrapper" id="boardWrapper">
    <div class="board" id="boardBg"></div>
    <div class="tile-layer" id="tileLayer"></div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-label">步数</div>
      <div class="stat-value" id="moves">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">搜索深度</div>
      <div class="stat-value" id="depth">3</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">耗时</div>
      <div class="stat-value" id="elapsed">0s</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">状态</div>
      <div class="stat-value" id="status">就绪</div>
    </div>
  </div>

  <div class="batch-stats" id="batchPanel" style="display:none;">
    <h3>📊 批量测试结果</h3>
    <div class="batch-grid">
      <div class="batch-item">
        <div class="batch-label">平均分</div>
        <div class="batch-value" id="avgScore">-</div>
      </div>
      <div class="batch-item">
        <div class="batch-label">最高分</div>
        <div class="batch-value" id="highScore">-</div>
      </div>
      <div class="batch-item">
        <div class="batch-label">平均最大</div>
        <div class="batch-value" id="avgMax">-</div>
      </div>
    </div>
  </div>

  <div class="hint">AI: Expectimax + 蛇形角落策略 (最大值固定左下角)</div>
</div>

<!-- 游戏结束弹窗 -->
<div id="gameOverModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center;">
  <div style="background:#faf8ef; border-radius:12px; padding:24px; max-width:400px; width:90%; text-align:center;">
    <h2 style="color:#776e65; margin-bottom:16px;">游戏结束!</h2>
    <div id="finalStats" style="margin-bottom:16px; font-size:16px; color:#776e65;"></div>
    <div id="boardSnapshot" style="margin-bottom:16px;"></div>
    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <button class="btn" onclick="downloadSnapshot()">📸 下载截图</button>
      <button class="btn" onclick="downloadText()">📄 保存文本</button>
      <button class="btn" onclick="downloadReplay()">🎬 导出回放</button>
      <button class="btn" onclick="startReplay()">▶️ 回放</button>
      <button class="btn" onclick="closeModal()">✖ 关闭</button>
    </div>
    <div id="replayInfo" style="margin-top:12px; font-size:12px; color:#776e65; opacity:0.7;"></div>
  </div>
</div>

<script>
/* ======================================
   2048 AI 自动对战
   算法: Expectimax + 多维启发式评估
   ====================================== */

const SIZE = 4;
let grid, score, moving, gameRunning, gameEnded;
let moveCount, startTime, aiTimer, timeInterval;
let batchResults = [];
let isBatching = false;

// 每步记录
let moveHistory = [];

// 批量测试中最好的一次
let bestBatchGame = null;

// AI辅助步数控制
let aiStepsLimit = 0; // 0=无限
let aiStepsRemaining = 0;
let isManualMode = false;

// 速度控制
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
speedSlider.addEventListener('input', () => {
  speedLabel.textContent = speedSlider.value;
});

function getDelay() {
  const v = parseInt(speedSlider.value);
  // 1=500ms, 50=50ms, 100=0ms
  return Math.max(0, Math.round(500 - (v / 100) * 500));
}

// ---- DOM ----
const scoreEl = document.getElementById('score');
const maxTileEl = document.getElementById('maxTile');
const movesEl = document.getElementById('moves');
const depthEl = document.getElementById('depth');
const elapsedEl = document.getElementById('elapsed');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const batchBtn = document.getElementById('batchBtn');
const tileLayer = document.getElementById('tileLayer');
const boardBg = document.getElementById('boardBg');
const batchPanel = document.getElementById('batchPanel');

/* ---------- 初始化 ---------- */
function initBoardBg() {
  boardBg.innerHTML = '';
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell-bg';
    boardBg.appendChild(cell);
  }
}

function newGame() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0;
  moveCount = 0;
  gameEnded = false;
  moveHistory = []; // 清空历史
  scoreEl.textContent = '0';
  maxTileEl.textContent = '0';
  movesEl.textContent = '0';
  elapsedEl.textContent = '0s';
  statusEl.textContent = '就绪';
  addRandomTile();
  addRandomTile();

  // 记录初始状态
  recordMove('init');

  renderTiles();
}

// 记录每一步
function recordMove(direction) {
  moveHistory.push({
    step: moveHistory.length,
    direction: direction,
    grid: grid.map(r => [...r]),
    score: score,
    maxTile: getMaxTile(),
    emptyCount: emptyScore(grid),
    timestamp: Date.now()
  });
}

function emptyCells() {
  const cells = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === 0) cells.push({ r, c });
  return cells;
}

function addRandomTile() {
  const cells = emptyCells();
  if (!cells.length) return;
  const { r, c } = cells[Math.floor(Math.random() * cells.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function getMaxTile() {
  let max = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] > max) max = grid[r][c];
  return max;
}

/* ---------- 渲染 ---------- */
function renderTiles() {
  tileLayer.innerHTML = '';
  const wrapper = document.getElementById('boardWrapper');
  const boardPx = wrapper.offsetWidth;
  const padding = boardPx * (12 / 500);
  const gap = boardPx * (12 / 500);
  const cellSize = (boardPx - padding * 2 - gap * (SIZE - 1)) / SIZE;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const val = grid[r][c];
      if (!val) continue;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.setAttribute('data-value', val);
      tile.textContent = val;
      const left = padding + c * (cellSize + gap);
      const top = padding + r * (cellSize + gap);
      tile.style.left = left + 'px';
      tile.style.top = top + 'px';
      tile.style.width = cellSize + 'px';
      tile.style.height = cellSize + 'px';
      const fontSize = val >= 1000 ? cellSize * 0.30
                     : val >= 100  ? cellSize * 0.36
                     :               cellSize * 0.48;
      tile.style.fontSize = fontSize + 'px';
      tileLayer.appendChild(tile);
    }
  }

  scoreEl.textContent = score;
  maxTileEl.textContent = getMaxTile();
  movesEl.textContent = moveCount;
  if (startTime) {
    elapsedEl.textContent = Math.round((Date.now() - startTime) / 1000) + 's';
  }
}

/* ======================================
   游戏逻辑 (与渲染分离，用于AI搜索)
   ====================================== */

// 克隆网格
function cloneGrid(g) {
  return g.map(r => [...r]);
}

// 滑动一行
function slideRow(row, size) {
  let arr = row.filter(v => v);
  let sc = 0;
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i + 1]) {
      arr[i] *= 2;
      sc += arr[i];
      arr.splice(i + 1, 1);
    }
  }
  while (arr.length < size) arr.push(0);
  return { row: arr, score: sc };
}

// 移动并返回新状态 (不修改全局)
function simulateMove(g, sc, direction) {
  let newGrid = cloneGrid(g);
  let newScore = sc;
  let moved = false;

  if (direction === 0) { // left
    for (let r = 0; r < SIZE; r++) {
      const result = slideRow(newGrid[r], SIZE);
      newGrid[r] = result.row;
      newScore += result.score;
    }
  } else if (direction === 1) { // right
    for (let r = 0; r < SIZE; r++) {
      const result = slideRow(newGrid[r].reverse(), SIZE);
      newGrid[r] = result.row.reverse();
      newScore += result.score;
    }
  } else if (direction === 2) { // up
    for (let c = 0; c < SIZE; c++) {
      let col = [];
      for (let r = 0; r < SIZE; r++) col.push(newGrid[r][c]);
      const result = slideRow(col, SIZE);
      for (let r = 0; r < SIZE; r++) newGrid[r][c] = result.row[r];
      newScore += result.score;
    }
  } else if (direction === 3) { // down
    for (let c = 0; c < SIZE; c++) {
      let col = [];
      for (let r = 0; r < SIZE; r++) col.push(newGrid[r][c]);
      const result = slideRow(col.reverse(), SIZE);
      const newRow = result.row.reverse();
      for (let r = 0; r < SIZE; r++) newGrid[r][c] = newRow[r];
      newScore += result.score;
    }
  }

  // 检测是否有变化
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (newGrid[r][c] !== g[r][c]) moved = true;

  return moved ? { grid: newGrid, score: newScore } : null;
}

function canMoveOnGrid(g) {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (g[r][c] === 0) return true;
      if (c < SIZE - 1 && g[r][c] === g[r][c + 1]) return true;
      if (r < SIZE - 1 && g[r][c] === g[r + 1][c]) return true;
    }
  return false;
}

/* ======================================
   AI 评估函数 (强化版 - 角落策略)
   ====================================== */

// 蛇形权重矩阵 - 从左下角向外递减
// 策略: 最大值固定在左下角，蛇形排列
// [  15,  14,  13,  12 ]
// [   8,   9,  10,  11 ]
// [   7,   6,   5,   4 ]
// [   0,   1,   2,   3 ]  ← 最大值在左下角(0,0)
const WEIGHT_MATRIX = [
  [0,  1,  2,  3],
  [7,  6,  5,  4],
  [8,  9,  10, 11],
  [15, 14, 13, 12]
];

// 蛇形权重评分 - 数字按权重矩阵排列得分高
function snakeWeightScore(g) {
  let score = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (g[r][c] === 0) continue;
      // 权重越大位置，数字应该越大
      score += g[r][c] * WEIGHT_MATRIX[r][c];
    }
  }
  return score;
}

// 严格单调性 - 从左下角向外递减
function strictMonotonicity(g) {
  let violations = 0;

  // 行单调性 (左->右递减)
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE - 1; c++) {
      if (g[r][c] < g[r][c + 1]) {
        violations += (g[r][c + 1] - g[r][c]) * 2; // 违反惩罚
      }
    }
  }

  // 列单调性 (下->上递减，因为最大值在左下角)
  for (let c = 0; c < SIZE; c++) {
    for (let r = SIZE - 1; r > 0; r--) {
      if (g[r][c] < g[r - 1][c]) {
        violations += (g[r - 1][c] - g[r][c]) * 2;
      }
    }
  }

  return -violations;
}

// 空格数量 (越高越好)
function emptyScore(g) {
  let count = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (g[r][c] === 0) count++;
  return count;
}

// 最大值位置奖励 - 鼓励在角落
function cornerPenalty(g) {
  let maxVal = 0, maxR = 0, maxC = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (g[r][c] > maxVal) {
        maxVal = g[r][c];
        maxR = r;
        maxC = c;
      }
    }
  }

  // 左下角是最佳位置 (3,0)
  const targetR = SIZE - 1, targetC = 0;

  if (maxR === targetR && maxC === targetC) {
    return maxVal * 5; // 在目标角落，大奖
  }

  // 其他角落
  if ((maxR === 0 || maxR === SIZE - 1) && (maxC === 0 || maxC === SIZE - 1)) {
    return maxVal * 2; // 在其他角落，小奖
  }

  // 在边缘 - 不惩罚，只是没奖励
  if (maxR === 0 || maxR === SIZE - 1 || maxC === 0 || maxC === SIZE - 1) {
    return 0;
  }

  // 在中间 - 轻微惩罚
  return -maxVal * 1;
}

// 大数字连续性 - 大数字必须紧挨着形成蛇形
function bigTileContinuity(g) {
  let score = 0;
  const threshold = 32; // 降低阈值，考虑更多数字

  // 找到所有大数字的位置
  const bigTiles = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (g[r][c] >= threshold) {
        bigTiles.push({ r, c, val: g[r][c] });
      }
    }
  }

  // 按值排序，从大到小
  bigTiles.sort((a, b) => b.val - a.val);

  if (bigTiles.length < 2) return 0;

  // 检查每对相邻的大数字是否在棋盘上也相邻
  for (let i = 0; i < bigTiles.length - 1; i++) {
    const curr = bigTiles[i];
    const next = bigTiles[i + 1];

    // 计算曼哈顿距离
    const dist = Math.abs(curr.r - next.r) + Math.abs(curr.c - next.c);

    if (dist === 1) {
      // 相邻，大奖
      score += next.val * 5;
    } else if (dist === 2) {
      // 距离2，小奖
      score += next.val * 1;
    } else {
      // 距离太远，重罚
      score -= next.val * 3;
    }
  }

  // 额外奖励：最大值在角落
  const maxTile = bigTiles[0];
  const isCorner = (maxTile.r === 0 || maxTile.r === SIZE - 1) &&
                   (maxTile.c === 0 || maxTile.c === SIZE - 1);
  if (isCorner) {
    score += maxTile.val * 10;
  }

  return score;
}

// 合并潜力 - 相邻相同数字
function mergePotential(g) {
  let merges = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (g[r][c] === 0) continue;
      if (c < SIZE - 1 && g[r][c] === g[r][c + 1]) merges += g[r][c];
      if (r < SIZE - 1 && g[r][c] === g[r + 1][c]) merges += g[r][c];
    }
  }
  return merges;
}

// 大数字连贯性 - 大数字应该形成连续路径
function bigTileClustering(g) {
  let score = 0;
  const threshold = 64; // 只考虑64以上的数字

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (g[r][c] < threshold) continue;

      // 检查与大数字邻居的连贯性
      const neighbors = [
        [r-1, c], [r+1, c], [r, c-1], [r, c+1]
      ];

      for (const [nr, nc] of neighbors) {
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
        if (g[nr][nc] >= threshold) {
          // 相邻大数字应该有序
          if (g[r][c] >= g[nr][nc]) score += g[nr][nc];
          else score -= g[r][c]; // 顺序错误惩罚
        }
      }
    }
  }
  return score;
}

// 综合评估函数 - 冲4096版
function evaluate(g, sc) {
  const empty = emptyScore(g);
  const snake = snakeWeightScore(g);
  const mono = strictMonotonicity(g);
  const corner = cornerPenalty(g);
  const merge = mergePotential(g);
  const continuity = bigTileContinuity(g);

  // 空格数量权重 - 空格越少权重越高
  let emptyWeight;
  if (empty <= 2) emptyWeight = 50000;      // 极度危险
  else if (empty <= 4) emptyWeight = 25000;  // 很危险
  else if (empty <= 6) emptyWeight = 10000;  // 一般
  else emptyWeight = 5000;                   // 安全

  return sc * 0.05
       + snake * 4.0          // 蛇形排列
       + mono * 8.0           // 单调性（更重要）
       + corner * 15.0        // 角落策略（最关键）
       + continuity * 12.0    // 大数字连续性（关键）
       + empty * emptyWeight  // 空格数量
       + merge * 800;         // 合并潜力
}

/* ======================================
   Expectimax 搜索
   ====================================== */

// AI搜索深度（玩家节点）- 4层冲4096
const SEARCH_DEPTH = 4;

// 玩家节点 - 选择最优方向
function playerNode(g, sc, depth) {
  if (depth <= 0) return evaluate(g, sc);

  let best = -Infinity;
  for (let dir = 0; dir < 4; dir++) {
    const result = simulateMove(g, sc, dir);
    if (!result) continue;

    // 移动后进入随机节点
    const val = chanceNode(result.grid, result.score, depth);
    if (val > best) best = val;
  }

  // 如果没有可行移动，返回当前评估
  return best === -Infinity ? evaluate(g, sc) : best;
}

// 随机节点 - 智能采样
function chanceNode(g, sc, depth) {
  const empties = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (g[r][c] === 0) empties.push({ r, c });

  if (empties.length === 0) {
    return canMoveOnGrid(g) ? playerNode(g, sc, depth - 1) : -1e9;
  }

  // 智能采样：优先采样靠近大数字的空格
  let samples = empties;
  if (empties.length > 6) {
    // 找到最大值位置
    let maxVal = 0, maxR = 0, maxC = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] > maxVal) {
          maxVal = g[r][c];
          maxR = r;
          maxC = c;
        }
      }
    }

    // 按距离排序，优先采样靠近大数字的位置
    empties.sort((a, b) => {
      const distA = Math.abs(a.r - maxR) + Math.abs(a.c - maxC);
      const distB = Math.abs(b.r - maxR) + Math.abs(b.c - maxC);
      return distA - distB;
    });

    // 只取前6个最近的
    samples = empties.slice(0, 6);
  }

  let totalVal = 0;
  for (const { r, c } of samples) {
    // 90% 概率出现 2
    g[r][c] = 2;
    totalVal += playerNode(g, sc, depth - 1) * 0.9;

    // 10% 概率出现 4
    g[r][c] = 4;
    totalVal += playerNode(g, sc, depth - 1) * 0.1;

    g[r][c] = 0;
  }

  return totalVal / samples.length;
}

// AI 选择最佳方向
function aiChooseDirection() {
  let bestDir = -1;
  let bestVal = -Infinity;

  for (let dir = 0; dir < 4; dir++) {
    const result = simulateMove(grid, score, dir);
    if (!result) continue;

    // 使用 chanceNode 评估这个方向
    const val = chanceNode(result.grid, result.score, SEARCH_DEPTH - 1);

    if (val > bestVal) {
      bestVal = val;
      bestDir = dir;
    }
  }

  return bestDir;
}

/* ---------- AI 执行 ---------- */
function aiStep() {
  if (gameEnded || !gameRunning) return;

  // 选择最佳方向
  const dir = aiChooseDirection();

  // 没有可用方向，游戏结束
  if (dir === -1) {
    gameEnded = true;
    gameRunning = false;
    statusEl.textContent = '结束';
    startBtn.textContent = '▶ 开始AI';
    startBtn.classList.remove('running');

    // 停止计时器
    clearInterval(timeInterval);
    timeInterval = null;

    // 单局游戏结束时，只有达到2048才显示弹窗
    if (!isBatching) {
      if (getMaxTile() >= 2048) {
        showGameOverModal();
      }
    } else {
      onGameEnd();
    }
    return;
  }

  // 执行移动
  const result = simulateMove(grid, score, dir);
  if (result) {
    grid = result.grid;
    score = result.score;
    moveCount++;
    addRandomTile();

    // 记录这一步
    const dirNames = ['left', 'right', 'up', 'down'];
    recordMove(dirNames[dir]);

    renderTiles();

    // 更新AI辅助步数
    if (aiStepsLimit > 0) {
      aiStepsRemaining--;
      statusEl.textContent = `AI ${aiStepsRemaining}步`;

      // AI辅助步数用完，自动暂停
      if (aiStepsRemaining <= 0) {
        gameRunning = false;
        startBtn.textContent = '▶ 继续';
        startBtn.classList.remove('running');
        statusEl.textContent = 'AI完成，手动继续';
        clearTimeout(aiTimer);
        clearInterval(timeInterval);
        timeInterval = null;
        return;
      }
    }
  }

  // 继续下一步
  if (gameRunning && !isManualMode) {
    aiTimer = setTimeout(aiStep, getDelay());
  }
}

/* ---------- 控制 ---------- */
function startAI() {
  if (gameEnded) {
    newGame();
  }

  // 读取AI辅助步数
  aiStepsLimit = parseInt(document.getElementById('aiStepsInput').value) || 0;
  aiStepsRemaining = aiStepsLimit;

  gameRunning = !gameRunning;
  isManualMode = false;

  if (gameRunning) {
    startBtn.textContent = '⏸ 暂停';
    startBtn.classList.add('running');
    statusEl.textContent = aiStepsLimit > 0 ? `AI ${aiStepsRemaining}步` : '运行中';
    startTime = startTime || Date.now();

    // 显示手动模式按钮
    document.getElementById('manualBtn').style.display = 'inline-block';

    // 启动独立计时器
    if (!timeInterval) {
      timeInterval = setInterval(() => {
        if (startTime && gameRunning) {
          elapsedEl.textContent = Math.round((Date.now() - startTime) / 1000) + 's';
        }
      }, 1000);
    }

    aiStep();
  } else {
    startBtn.textContent = '▶ 继续';
    startBtn.classList.remove('running');
    statusEl.textContent = '暂停';
    clearTimeout(aiTimer);
    clearInterval(timeInterval);
    timeInterval = null;
  }
}

// 手动模式切换
function toggleManualMode() {
  isManualMode = !isManualMode;
  const manualBtn = document.getElementById('manualBtn');

  if (isManualMode) {
    manualBtn.textContent = '🤖 AI模式';
    manualBtn.classList.add('running');
    statusEl.textContent = '手动模式';
    clearTimeout(aiTimer);
  } else {
    manualBtn.textContent = '🎮 手动模式';
    manualBtn.classList.remove('running');
    statusEl.textContent = 'AI模式';
    if (gameRunning && !gameEnded) {
      aiStep();
    }
  }
}

// 手动移动
function manualMove(direction) {
  // 允许在手动模式或游戏暂停时手动移动
  if (gameEnded || isBatching) return;
  if (!isManualMode && gameRunning) return;

  const result = simulateMove(grid, score, direction);
  if (result) {
    grid = result.grid;
    score = result.score;
    moveCount++;
    addRandomTile();

    // 记录这一步
    const dirNames = ['left', 'right', 'up', 'down'];
    recordMove('manual-' + dirNames[direction]);

    renderTiles();

    // 检查游戏是否结束
    if (!canMoveOnGrid(grid)) {
      gameEnded = true;
      gameRunning = false;
      statusEl.textContent = '结束';
      startBtn.textContent = '▶ 开始AI';
      startBtn.classList.remove('running');

      // 停止计时器
      clearInterval(timeInterval);
      timeInterval = null;

      // 单局游戏结束时，只有达到2048才显示弹窗
      if (!isBatching) {
        if (getMaxTile() >= 2048) {
          showGameOverModal();
        }
      }
    }
  }
}

function resetGame() {
  gameRunning = false;
  gameEnded = false;
  isBatching = false;
  clearTimeout(aiTimer);
  clearInterval(timeInterval);
  timeInterval = null;
  startBtn.textContent = '▶ 开始AI';
  startBtn.classList.remove('running');
  startTime = null;
  newGame();
}

/* ---------- 批量测试 ---------- */
function startBatch() {
  if (isBatching) return;
  isBatching = true;
  batchResults = [];
  bestBatchGame = null; // 重置最佳游戏
  batchPanel.style.display = 'block';
  batchBtn.disabled = true;
  batchBtn.textContent = '测试中...';

  // 清除旧的最佳游戏信息
  const oldBest = document.getElementById('bestGameInfo');
  if (oldBest) oldBest.remove();

  // 速度调到最快
  speedSlider.value = 100;
  speedLabel.textContent = '100';

  runBatchGame();
}

function runBatchGame() {
  newGame();
  moveHistory = []; // 重置回放数据
  gameRunning = true;
  startTime = Date.now();
  statusEl.textContent = `第${batchResults.length + 1}/10局`;
  aiStep();
}

function onGameEnd() {
  const gameResult = {
    score: score,
    maxTile: getMaxTile(),
    moves: moveCount,
    time: Math.round((Date.now() - startTime) / 1000),
    grid: grid.map(r => [...r]),
    moveHistory: moveHistory.map(m => ({...m, grid: m.grid.map(r => [...r])}))
  };

  batchResults.push(gameResult);

  // 记录最好的一次
  if (!bestBatchGame || gameResult.score > bestBatchGame.score) {
    bestBatchGame = gameResult;
  }

  updateBatchStats();

  if (batchResults.length < 10) {
    setTimeout(runBatchGame, 300);
  } else {
    isBatching = false;
    batchBtn.disabled = false;
    batchBtn.textContent = '📊 跑10局';
    statusEl.textContent = '完成';
    speedSlider.value = 50;
    speedLabel.textContent = '50';

    // 显示最好的一次
    showBestGameInfo();
  }
}

function updateBatchStats() {
  const n = batchResults.length;
  if (n === 0) return;

  const avgScore = Math.round(batchResults.reduce((a, b) => a + b.score, 0) / n);
  const highScore = Math.max(...batchResults.map(b => b.score));
  const avgMax = Math.round(batchResults.reduce((a, b) => a + b.maxTile, 0) / n);

  document.getElementById('avgScore').textContent = avgScore;
  document.getElementById('highScore').textContent = highScore;
  document.getElementById('avgMax').textContent = avgMax;
}

function showBestGameInfo() {
  if (!bestBatchGame) return;

  // 在批量测试面板显示最好的一次
  const bestInfo = document.createElement('div');
  bestInfo.style.cssText = 'margin-top:12px; padding:12px; background:rgba(76,175,80,0.1); border:1px solid rgba(76,175,80,0.3); border-radius:8px;';
  bestInfo.innerHTML = `
    <h4 style="color:#4CAF50; margin-bottom:8px;">🏆 最佳一局</h4>
    <div style="font-size:14px; color:#776e65;">
      <div>分数: <strong>${bestBatchGame.score}</strong></div>
      <div>最大方块: <strong>${bestBatchGame.maxTile}</strong></div>
      <div>步数: <strong>${bestBatchGame.moves}</strong></div>
      <div>耗时: <strong>${bestBatchGame.time}秒</strong></div>
    </div>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button class="btn" style="padding:8px 12px; font-size:12px;" onclick="downloadBestReplay()">🎬 导出最佳回放</button>
      <button class="btn" style="padding:8px 12px; font-size:12px;" onclick="viewBestReplay()">▶️ 查看最佳回放</button>
    </div>
  `;

  // 移除旧的最佳游戏信息
  const oldBest = document.getElementById('bestGameInfo');
  if (oldBest) oldBest.remove();

  bestInfo.id = 'bestGameInfo';
  batchPanel.appendChild(bestInfo);
}

function downloadBestReplay() {
  if (!bestBatchGame) return;

  const replayData = {
    version: '1.0',
    game: '2048-ai',
    result: {
      score: bestBatchGame.score,
      maxTile: bestBatchGame.maxTile,
      moves: bestBatchGame.moves,
      totalFrames: bestBatchGame.moveHistory.length
    },
    frames: bestBatchGame.moveHistory
  };

  const blob = new Blob([JSON.stringify(replayData, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.download = `2048-ai-best-${bestBatchGame.score}.json`;
  link.href = URL.createObjectURL(blob);
  link.click();
}

function viewBestReplay() {
  if (!bestBatchGame) return;

  // 使用最佳游戏的数据进行回放
  moveHistory = bestBatchGame.moveHistory;
  grid = bestBatchGame.grid.map(r => [...r]);
  score = bestBatchGame.score;

  // 开始回放
  startReplay();
}

/* ---------- 截图和保存功能 ---------- */
let lastGameOverGrid = null;
let lastGameOverScore = 0;
let lastGameOverMoves = 0;
let lastGameOverMaxTile = 0;

function showGameOverModal() {
  lastGameOverGrid = grid.map(r => [...r]);
  lastGameOverScore = score;
  lastGameOverMoves = moveCount;
  lastGameOverMaxTile = getMaxTile();

  // 显示统计信息
  const statsHtml = `
    <div>分数: <strong>${lastGameOverScore}</strong></div>

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const val = lastGameOverGrid[r][c];
      const bg = val === 0 ? 'rgba(238,228,218,0.35)' : getTileColor(val);
      boardHtml += `<div style="background:${bg}; color:${val > 4 ? '#f9f6f2' : '#776e65'}; padding:8px 4px; border-radius:4px; font-weight:700; font-size:${val >= 100 ? '12px' : '14px'};">${val || ''}</div>`;

}

function getTileColor(val) {
  const colors = {
    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
    32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
    512: '#edc850', 1024: '#edc53f', 2048: '#edc22e', 4096: '#3c3a32'
  };
  return colors[val] || '#3c3a32';
}

function closeModal() {
  document.getElementById('gameOverModal').style.display = 'none';
}

function downloadSnapshot() {
  // 创建canvas绘制棋盘
  const canvas = document.createElement('canvas');
  const size = 400;
  canvas.width = size;
  canvas.height = size + 80;
  const ctx = canvas.getContext('2d');

  // 背景
  ctx.fillStyle = '#bbada0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制标题
  ctx.fillStyle = '#776e65';
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`2048 AI - 分数: ${lastGameOverScore}`, size / 2, 30);

  // 绘制棋盘
  const padding = 10;
  const gap = 8;
  const cellSize = (size - padding * 2 - gap * 3) / 4;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const val = lastGameOverGrid[r][c];
      const x = padding + c * (cellSize + gap);
      const y = 50 + padding + r * (cellSize + gap);

      // 背景
      ctx.fillStyle = val === 0 ? 'rgba(238,228,218,0.35)' : getTileColor(val);
      ctx.beginPath();
      ctx.roundRect(x, y, cellSize, cellSize, 6);
      ctx.fill();

      // 数字
      if (val > 0) {
        ctx.fillStyle = val > 4 ? '#f9f6f2' : '#776e65';
        ctx.font = `bold ${val >= 100 ? 16 : 24}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val.toString(), x + cellSize / 2, y + cellSize / 2);
      }
    }
  }

  // 绘制统计信息
  ctx.fillStyle = '#776e65';
  ctx.font = '14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`最大方块: ${lastGameOverMaxTile} | 步数: ${lastGameOverMoves}`, size / 2, size + 50);

  // 下载
  const link = document.createElement('a');
  link.download = `2048-ai-${lastGameOverScore}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

function downloadText() {

  text += `==================\n`;
  text += `分数: ${lastGameOverScore}\n`;
  text += `最大方块: ${lastGameOverMaxTile}\n`;

}

// 回放功能
let replayIndex = 0;
let replayTimer = null;
let isReplaying = false;

function startReplay() {
  if (moveHistory.length === 0) {
    alert('没有回放数据');
    return;
  }

  closeModal();
  isReplaying = true;
  replayIndex = 0;

  // 显示回放控制条
  showReplayControls();

  // 开始回放
  playNextFrame();
}

function showReplayControls() {
  // 移除旧的控制条
  const old = document.getElementById('replayControls');
  if (old) old.remove();

  const controls = document.createElement('div');
  controls.id = 'replayControls';
  controls.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:12px 20px; border-radius:8px; z-index:1000; display:flex; align-items:center; gap:12px;';

  controls.innerHTML = `
    <button class="btn" style="padding:8px 12px; font-size:12px;" onclick="replayPrev()">⏮</button>
    <button class="btn" style="padding:8px 12px; font-size:12px;" onclick="replayTogglePause()">⏸</button>
    <button class="btn" style="padding:8px 12px; font-size:12px;" onclick="replayNext()">⏭</button>
    <span style="color:#fff; font-size:14px; min-width:80px;" id="replayProgress">0 / ${moveHistory.length}</span>
    <input type="range" id="replaySlider" min="0" max="${moveHistory.length - 1}" value="0" style="width:150px;" oninput="replaySeek(this.value)">
    <button class="btn" style="padding:8px 12px; font-size:12px; background:#f65e3b;" onclick="stopReplay()">✖</button>
  `;

  document.body.appendChild(controls);
}

function playNextFrame() {
  if (!isReplaying || replayIndex >= moveHistory.length) {
    stopReplay();
    return;
  }

  renderReplayFrame(replayIndex);
  replayIndex++;

  document.getElementById('replayProgress').textContent = `${replayIndex} / ${moveHistory.length}`;
  document.getElementById('replaySlider').value = replayIndex;

  replayTimer = setTimeout(playNextFrame, 200); // 200ms per frame
}

function renderReplayFrame(index) {
  const frame = moveHistory[index];
  if (!frame) return;

  // 更新grid和score用于渲染
  grid = frame.grid.map(r => [...r]);
  score = frame.score;
  renderTiles();
}

function replayTogglePause() {
  if (replayTimer) {
    clearTimeout(replayTimer);
    replayTimer = null;
    // 更新按钮文字
  } else {
    playNextFrame();
  }
}

function replayPrev() {
  if (replayIndex > 0) {
    replayIndex--;
    renderReplayFrame(replayIndex);
    document.getElementById('replayProgress').textContent = `${replayIndex} / ${moveHistory.length}`;
    document.getElementById('replaySlider').value = replayIndex;
  }
}

function replayNext() {
  if (replayIndex < moveHistory.length - 1) {
    replayIndex++;
    renderReplayFrame(replayIndex);
    document.getElementById('replayProgress').textContent = `${replayIndex} / ${moveHistory.length}`;
    document.getElementById('replaySlider').value = replayIndex;
  }
}

function replaySeek(value) {
  replayIndex = parseInt(value);
  renderReplayFrame(replayIndex);
  document.getElementById('replayProgress').textContent = `${replayIndex} / ${moveHistory.length}`;
}

function stopReplay() {
  isReplaying = false;
  if (replayTimer) {
    clearTimeout(replayTimer);
    replayTimer = null;
  }

  // 移除控制条
  const controls = document.getElementById('replayControls');
  if (controls) controls.remove();

  // 恢复显示最终状态
  grid = lastGameOverGrid.map(r => [...r]);
  score = lastGameOverScore;
  renderTiles();
}

/* ---------- 事件 ---------- */
startBtn.addEventListener('click', startAI);
resetBtn.addEventListener('click', resetGame);
batchBtn.addEventListener('click', startBatch);
document.getElementById('manualBtn').addEventListener('click', toggleManualMode);
window.addEventListener('resize', renderTiles);

// 键盘事件 - 支持手动操作
document.addEventListener('keydown', (e) => {
  const keyMap = {
    'ArrowLeft': 0,   // left
    'ArrowRight': 1,  // right
    'ArrowUp': 2,     // up
    'ArrowDown': 3,   // down
    'a': 0,           // left
    'd': 1,           // right
    'w': 2,           // up
    's': 3            // down
  };

  const direction = keyMap[e.key];
  if (direction !== undefined) {
    e.preventDefault();

    // 如果在手动模式，执行手动移动
    if (isManualMode && gameRunning && !gameEnded) {
      manualMove(direction);
    }
    // 如果游戏暂停且不在手动模式，也可以手动移动
    else if (!gameRunning && !gameEnded && !isBatching) {
      manualMove(direction);
    }
  }
});

/* ---------- 启动 ---------- */
initBoardBg();
newGame();
</script>
<script src="../js/history.js"></script>
<script>
  HistoryManager.injectBackButton();
</script>
