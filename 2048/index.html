<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048 · 合集</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: #faf8ef;
    color: #776e65;
  }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 14px 12px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  [hidden] {
    display: none !important;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .container {
    width: min(94vw, 520px);
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .back {
    flex: 0 0 auto;
    padding: 8px 10px;
    border-radius: 8px;
    background: #eee4da;
    color: #776e65;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
  }

  .back:active {
    background: #e6d9cb;
  }

  .title {
    font-size: 38px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1.5px;
  }

  .lb-btn {
    flex: 0 0 auto;
    padding: 8px 11px;
    border: 0;
    border-radius: 8px;
    background: #eee4da;
    color: #776e65;
    font-size: 13px;
    font-weight: 700;
  }

  .lb-btn:active {
    background: #e6d9cb;
  }

  /* ---------- 模式 / 盘子 ---------- */
  .switch-row {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border-radius: 10px;
    background: #eee4da;
  }

  .seg button {
    flex: 1;
    min-width: 0;
    padding: 8px 4px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #8f7a66;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.2;
    transition: background 0.15s, color 0.15s;
  }

  .seg button.active {
    background: #8f7a66;
    color: #fff;
    box-shadow: 0 2px 6px rgba(119, 110, 101, 0.2);
  }

  /* ---------- 分数 ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    margin-bottom: 10px;
  }

  .stat {
    min-width: 0;
    padding: 7px 3px;
    border-radius: 8px;
    background: #bbada0;
    color: #fff;
    text-align: center;
  }

  .stat .label {
    margin-bottom: 2px;
    font-size: 10px;
    letter-spacing: 0.04em;
    opacity: 0.86;
  }

  .stat .value {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- 棋盘 ---------- */
  .board-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    border-radius: 12px;
    background: #bbada0;
    overflow: hidden;
    touch-action: none;
  }

  .board {
    position: absolute;
    inset: 0;
    display: grid;
  }

  .cell-bg {
    min-width: 0;
    min-height: 0;
    border-radius: 6px;
    background: rgba(238, 228, 218, 0.35);
  }

  .tile-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 800;
    line-height: 1;
    z-index: 10;
    transition: left 0.1s ease, top 0.1s ease, transform 0.1s ease;
  }

  .tile[data-value="2"]    { background: #eee4da; color: #776e65; }
  .tile[data-value="4"]    { background: #ede0c8; color: #776e65; }
  .tile[data-value="8"]    { background: #f2b179; color: #f9f6f2; }
  .tile[data-value="16"]   { background: #f59563; color: #f9f6f2; }
  .tile[data-value="32"]   { background: #f67c5f; color: #f9f6f2; }
  .tile[data-value="64"]   { background: #f65e3b; color: #f9f6f2; }
  .tile[data-value="128"]  { background: #edcf72; color: #f9f6f2; }
  .tile[data-value="256"]  { background: #edcc61; color: #f9f6f2; }
  .tile[data-value="512"]  { background: #edc850; color: #f9f6f2; }
  .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; }
  .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; }
  .tile[data-value="4096"] { background: #3c3a32; color: #f9f6f2; }
  .tile[data-value="8192"] { background: #2f2b27; color: #f9f6f2; }
  .tile[data-value="16384"] { background: #252220; color: #f9f6f2; }
  .tile[data-value="32768"] { background: #1c1a18; color: #f9f6f2; }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    border-radius: 12px;
    background: rgba(238, 228, 218, 0.9);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-msg {
    margin-bottom: 6px;
    color: #776e65;
    font-size: 36px;
    font-weight: 900;
    text-align: center;
  }

  .overlay-score {
    margin-bottom: 16px;
    color: #8f7a66;
    font-size: 14px;
    text-align: center;
  }

  .overlay-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  /* ---------- 控制 ---------- */
  .play-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    margin-top: 10px;
  }

  .btn {
    padding: 11px 15px;
    border: 0;
    border-radius: 8px;
    background: #8f7a66;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.2;
    transition: background 0.15s, transform 0.1s;
  }

  .btn:active {
    transform: scale(0.97);
    background: #9f8b77;
  }

  .btn.primary {
    background: #f2b179;
  }

  .btn.primary:active {
    background: #f59563;
  }

  .btn.secondary {
    background: #eee4da;
    color: #776e65;
  }

  .speed {
    display: flex;
    flex: 1;
    align-items: center;
    gap: 7px;
    min-width: 0;
    color: #8f7a66;
    font-size: 12px;
    font-weight: 700;
  }

  .speed input {
    flex: 1;
    min-width: 0;
    accent-color: #f2b179;
  }

  .speed b {
    min-width: 22px;
    text-align: right;
  }

  .status-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    color: #8f7a66;
    font-size: 12px;
    line-height: 1.5;
  }

  .hint {
    margin-top: 8px;
    color: #776e65;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    opacity: 0.65;
  }

  .old-links {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #eee4da;
    color: #bbada0;
    font-size: 11px;
    line-height: 1.8;
    text-align: center;
  }

  .old-links a {
    color: #8f7a66;
    text-decoration: none;
  }

  .old-links a:hover {
    text-decoration: underline;
  }

  /* ---------- 排行榜 ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: rgba(60, 50, 40, 0.55);
  }

  .modal-card {
    display: flex;
    flex-direction: column;
    width: min(94vw, 520px);
    max-height: 88vh;
    overflow: hidden;
    border-radius: 16px;
    background: #faf8ef;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 13px 15px;
    border-bottom: 1px solid #eee4da;
    font-size: 16px;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: #eee4da;
    color: #776e65;
    font-size: 20px;
    line-height: 1;
  }

  .lb-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 9px 12px;
    border-bottom: 1px solid #eee4da;
  }

  .lb-tab {
    flex: 0 0 auto;
    padding: 6px 9px;
    border: 0;
    border-radius: 999px;
    background: #eee4da;
    color: #8f7a66;
    font-size: 11px;
    font-weight: 800;
  }

  .lb-tab.active {
    background: #8f7a66;
    color: #fff;
  }

  .lb-table-wrap {
    flex: 1;
    overflow: auto;
    padding: 0 6px;
  }

  .lb-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .lb-table th,
  .lb-table td {
    padding: 8px 5px;
    border-bottom: 1px solid #f0e9df;
    text-align: right;
    white-space: nowrap;
  }

  .lb-table th:first-child,
  .lb-table td:first-child {
    text-align: left;
    color: #bbada0;
    font-weight: 800;
  }

  .lb-table th {
    position: sticky;
    top: 0;
    background: #faf8ef;
    color: #bbada0;
    font-size: 10px;
    font-weight: 800;
  }

  .lb-table td.score {
    color: #8f7a66;
    font-weight: 800;
  }

  .lb-table .empty-row td {
    padding: 28px 8px;
    text-align: center;
    color: #bbada0;
    white-space: normal;
  }

  .modal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid #eee4da;
    color: #bbada0;
    font-size: 11px;
  }

  .link-btn {
    padding: 4px 0;
    border: 0;
    background: none;
    color: #d9825f;
    font-size: 11px;
    font-weight: 700;
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 300;
    transform: translateX(-50%);
    padding: 9px 15px;
    border-radius: 999px;
    background: rgba(60, 50, 40, 0.88);
    color: #fff;
    font-size: 12px;
    white-space: nowrap;
  }

  @media (max-width: 380px) {
    .title { font-size: 33px; }
    .stat .value { font-size: 15px; }
    .btn { padding: 10px 12px; font-size: 13px; }
    .seg button { font-size: 12px; padding: 7px 2px; }
    .overlay-msg { font-size: 30px; }
  }

  @media (min-width: 641px) {
    body { padding-top: 24px; }
    .container { width: min(90vw, 500px); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <a class="back" href="../index.html">← 合集</a>
    <div class="title">2048</div>
    <button class="lb-btn" id="lbBtn" type="button">🏆 排行榜</button>
  </div>

  <div class="switch-row">
    <div class="seg" id="modeSeg" role="tablist" aria-label="模式">
      <button data-mode="manual" class="active" type="button">手动</button>
      <button data-mode="ai" type="button">AI</button>
      <button data-mode="auto" type="button">自动</button>
    </div>
    <div class="seg" id="sizeSeg" role="tablist" aria-label="盘子大小">
      <button data-size="4" class="active" type="button">4×4</button>
      <button data-size="5" type="button">5×5</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">最高</div><div class="value" id="best">0</div></div>
    <div class="stat"><div class="label">最大</div><div class="value" id="maxTile">0</div></div>
    <div class="stat"><div class="label">步数</div><div class="value" id="moves">0</div></div>
  </div>

  <div class="board-wrapper" id="boardWrapper">
    <div class="board" id="boardBg"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-msg" id="overlayMsg">游戏结束</div>
      <div class="overlay-score" id="overlayScore"></div>
      <div class="overlay-actions">
        <button class="btn" id="againBtn" type="button">再来一局</button>
        <button class="btn secondary" id="overlayLbBtn" type="button">排行榜</button>
        <button class="btn secondary" id="keepBtn" type="button" hidden>继续挑战</button>
      </div>
    </div>
  </div>

  <div class="play-row">
    <button class="btn" id="newBtn" type="button">新游戏</button>
    <button class="btn primary" id="runBtn" type="button" hidden>▶ 开始</button>
    <div class="speed" id="speedWrap" hidden>
      <span>速度</span>
      <input type="range" id="speed" min="1" max="100" value="60" aria-label="速度">
      <b id="speedLabel">60</b>
    </div>
  </div>

  <div class="status-line">
    <span id="status">手动模式 · 自动保存</span>
    <span id="timer">00:00</span>
  </div>
  <div class="hint" id="hint">滑动或方向键移动；退出后重新打开会继续上局</div>

  <div class="old-links">
    旧版入口：
    <a href="2048.html">经典</a> ·
    <a href="2048-5x5.html">5×5</a> ·
    <a href="2048-ai.html">AI</a> ·
    <a href="2048-ai-5x5.html">AI 5×5</a> ·
    <a href="2048-auto.html">自动</a>
  </div>
</div>

<div class="modal" id="lbModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <strong>🏆 本机排行榜</strong>
      <button class="modal-close" id="lbClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="lb-tabs" id="lbTabs"></div>
    <div class="lb-table-wrap">
      <table class="lb-table">
        <thead>
          <tr><th>#</th><th>分数</th><th>最大</th><th>步数</th><th>日期</th></tr>
        </thead>
        <tbody id="lbBody"></tbody>
      </table>
    </div>
    <div class="modal-foot">
      <span id="lbHint">本机记录 · 前 10 名</span>
      <button class="link-btn" id="lbClear" type="button">清空本榜</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="../js/history.js"></script>
<script>
  /* ============================================================
     2048 统一版：手动 / AI / 自动 × 4×4 / 5×5
     - 本机排行榜：6 个分类，前 10 名
     - 自动保存：每个模式/盘子独立存档，退出后可继续
     ============================================================ */

  const SIZES = [4, 5];
  const LB_KEY = '2048_unified_lb_v1';
  const LAST_KEY = '2048_unified_last_v1';
  const SAVE_PREFIX = '2048_unified_save_v1_';

  const LB_TABS = [
    { key: 'manual4', mode: 'manual', size: 4, label: '手动 4×4' },
    { key: 'manual5', mode: 'manual', size: 5, label: '手动 5×5' },
    { key: 'ai4', mode: 'ai', size: 4, label: 'AI 4×4' },
    { key: 'ai5', mode: 'ai', size: 5, label: 'AI 5×5' },
    { key: 'auto4', mode: 'auto', size: 4, label: '自动 4×4' },
    { key: 'auto5', mode: 'auto', size: 5, label: '自动 5×5' },
  ];

  const HISTORY_IDS = {
    manual4: '2048',
    manual5: '2048-5x5',
    ai4: '2048-ai',
    ai5: '2048-ai-5x5',
    auto4: '2048-auto',
    auto5: '2048-auto-5x5',
  };

  const AI_PROFILES = {
    4: {
      depth: 4,
      weights: [
        [0, 1, 2, 3],
        [7, 6, 5, 4],
        [8, 9, 10, 11],
        [15, 14, 13, 12],
      ],
      emptyTiers: [[2, 50000], [4, 25000], [6, 10000], [Infinity, 5000]],
      coeff: { score: 0.05, snake: 4, mono: 8, corner: 15, continuity: 12, merge: 800 },
    },
    5: {
      depth: 3,
      weights: [
        [0, 1, 2, 3, 4],
        [9, 8, 7, 6, 5],
        [10, 11, 12, 13, 14],
        [19, 18, 17, 16, 15],
        [20, 21, 22, 23, 24],
      ],
      emptyTiers: [[3, 30000], [6, 15000], [10, 6000], [Infinity, 2000]],
      coeff: { score: 0.1, snake: 3, mono: 6, corner: 12, continuity: 10, merge: 800 },
    },
  };

  /* ---------- 状态 ---------- */
  let mode = 'manual';
  let SIZE = 4;
  let grid = [];
  let score = 0;
  let moves = 0;
  let best = 0;
  let won = false;
  let keepPlaying = false;
  let gameOver = false;
  let recorded = false;
  let elapsed = 0;
  let running = false;
  let speed = 60;
  let stepTimer = null;
  let clockTimer = null;
  let aiDeadline = 0;
  let lbSelectedKey = 'manual4';
  let touchStartX = null;
  let touchStartY = null;

  /* ---------- DOM ---------- */
  const $ = (id) => document.getElementById(id);
  const scoreEl = $('score');
  const bestEl = $('best');
  const maxEl = $('maxTile');
  const movesEl = $('moves');
  const timerEl = $('timer');
  const statusEl = $('status');
  const hintEl = $('hint');
  const boardWrapper = $('boardWrapper');
  const boardBg = $('boardBg');
  const tileLayer = $('tileLayer');
  const overlay = $('overlay');
  const overlayMsg = $('overlayMsg');
  const overlayScore = $('overlayScore');
  const keepBtn = $('keepBtn');
  const runBtn = $('runBtn');
  const speedWrap = $('speedWrap');
  const speedEl = $('speed');
  const speedLabel = $('speedLabel');
  const newBtn = $('newBtn');
  const modeSeg = $('modeSeg');
  const sizeSeg = $('sizeSeg');
  const lbModal = $('lbModal');
  const lbTabs = $('lbTabs');
  const lbBody = $('lbBody');
  const lbHint = $('lbHint');
  const toastEl = $('toast');

  /* ---------- 存储 ---------- */
  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (err) {
      return fallback;
    }
  }

  function writeJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (err) {
      /* 忽略隐私模式/空间不足 */
    }
  }

  function lbKey(m, s) {
    return m + s;
  }

  function getLB() {
    const data = readJSON(LB_KEY, {});
    return data && typeof data === 'object' && !Array.isArray(data) ? data : {};
  }

  function bestFromLB() {
    const list = getLB()[lbKey(mode, SIZE)];
    return Array.isArray(list) && list[0] ? Number(list[0].score) || 0 : 0;
  }

  // 兼容旧版 2048 的最高分记录（旧页面还在，不迁移到排行榜，只用于「最高」显示）
  function legacyBest() {
    if (mode !== 'manual') return 0;
    try {
      if (SIZE === 4) return parseInt(localStorage.getItem('2048_best') || '0', 10) || 0;
      if (SIZE === 5) return parseInt(localStorage.getItem('2048_5x5_hard_best') || '0', 10) || 0;
    } catch (err) {
      return 0;
    }
    return 0;
  }

  function currentBest() {
    return Math.max(bestFromLB(), legacyBest());
  }

  function stateKey() {
    return SAVE_PREFIX + mode + SIZE;
  }

  function saveState() {
    if (!Array.isArray(grid) || grid.length !== SIZE) return;
    writeJSON(stateKey(), {
      v: 1,
      mode: mode,
      size: SIZE,
      grid: grid,
      score: score,
      moves: moves,
      won: won,
      keepPlaying: keepPlaying,
      gameOver: gameOver,
      recorded: recorded,
      elapsed: elapsed,
      savedAt: Date.now(),
    });
  }

  function loadState(m, s) {
    const data = readJSON(SAVE_PREFIX + m + s, null);
    if (!data || data.size !== s || data.mode !== m) return null;
    if (!Array.isArray(data.grid) || data.grid.length !== s) return null;
    for (let r = 0; r < s; r++) {
      const row = data.grid[r];
      if (!Array.isArray(row) || row.length !== s) return null;
      for (let c = 0; c < s; c++) {
        if (!Number.isFinite(row[c]) || row[c] < 0) return null;
      }
    }
    return data;
  }

  function saveLast() {
    writeJSON(LAST_KEY, { mode: mode, size: SIZE });
  }

  /* ---------- 排行榜 ---------- */
  function addScore() {
    const key = lbKey(mode, SIZE);
    const data = getLB();
    const list = Array.isArray(data[key]) ? data[key] : [];
    list.push({
      score: score,
      max: getMaxTile(),
      moves: moves,
      date: Date.now(),
      duration: elapsed,
    });
    list.sort((a, b) => (b.score - a.score) || (b.max - a.max) || (b.moves - a.moves));
    data[key] = list.slice(0, 10);
    writeJSON(LB_KEY, data);
  }

  function recordResult() {
    if (recorded) return;
    recorded = true;
    best = Math.max(best, score);
    addScore();

    // 同步旧版最高分键，保证从旧页面回来时「最高」不会倒退
    if (mode === 'manual') {
      try {
        localStorage.setItem(SIZE === 4 ? '2048_best' : '2048_5x5_hard_best', String(best));
      } catch (err) {
        /* 忽略存储失败 */
      }
    }

    if (typeof HistoryManager !== 'undefined' && HistoryManager.record) {
      HistoryManager.record(HISTORY_IDS[lbKey(mode, SIZE)], {
        score: score,
        bestScore: best,
        result: won ? 'win' : 'lose',
        duration: Math.round(elapsed / 1000),
      });
    }

    saveState();
  }

  function formatDate(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '-';
    return String(d.getMonth() + 1).padStart(2, '0') + '/' +
           String(d.getDate()).padStart(2, '0') + ' ' +
           String(d.getHours()).padStart(2, '0') + ':' +
           String(d.getMinutes()).padStart(2, '0');
  }

  function buildLBTabs() {
    lbTabs.innerHTML = '';
    LB_TABS.forEach((tab) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lb-tab';
      btn.dataset.key = tab.key;
      btn.textContent = tab.label;
      btn.addEventListener('click', () => {
        lbSelectedKey = tab.key;
        renderLB();
      });
      lbTabs.append(btn);
    });
  }

  function renderLB() {
    const active = LB_TABS.find((tab) => tab.key === lbSelectedKey) || LB_TABS[0];
    lbSelectedKey = active.key;

    lbTabs.querySelectorAll('.lb-tab').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.key === lbSelectedKey);
    });

    const data = getLB();
    const list = Array.isArray(data[lbSelectedKey]) ? data[lbSelectedKey] : [];

    lbBody.innerHTML = '';
    if (list.length === 0) {
      const tr = document.createElement('tr');
      tr.className = 'empty-row';
      const td = document.createElement('td');
      td.colSpan = 5;
      td.textContent = '这个榜还没有记录，先玩一局吧。';
      tr.append(td);
      lbBody.append(tr);
    } else {
      list.forEach((entry, index) => {
        const tr = document.createElement('tr');
        const cells = [
          String(index + 1),
          String(entry.score),
          String(entry.max),
          String(entry.moves),
          formatDate(entry.date),
        ];
        cells.forEach((text, i) => {
          const td = document.createElement('td');
          td.textContent = text;
          if (i === 1) td.className = 'score';
          tr.append(td);
        });
        lbBody.append(tr);
      });
    }

    lbHint.textContent = '本机记录 · 前 10 名 · ' + active.label;
  }

  function openLB() {
    lbSelectedKey = lbKey(mode, SIZE);
    renderLB();
    lbModal.hidden = false;
  }

  function closeLB() {
    lbModal.hidden = true;
  }

  /* ---------- 工具 ---------- */
  function getMaxTile() {
    let max = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r] && grid[r][c] > max) max = grid[r][c];
      }
    }
    return max;
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) cells.push({ r: r, c: c });
      }
    }
    return cells;
  }

  function addRandomTile() {
    const cells = emptyCells();
    if (cells.length === 0) return;
    const { r, c } = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function slideRow(row) {
    const arr = row.filter((v) => v);
    let gained = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        gained += arr[i];
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return { row: arr, gained: gained };
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function canMoveOnGrid(g) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] === 0) return true;
        if (c < SIZE - 1 && g[r][c] === g[r][c + 1]) return true;
        if (r < SIZE - 1 && g[r][c] === g[r + 1][c]) return true;
      }
    }
    return false;
  }

  function formatTime(ms) {
    const total = Math.floor(ms / 1000);
    const mm = Math.floor(total / 60);
    const ss = total % 60;
    return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  }

  /* ---------- 渲染 ---------- */
  function initBoardBg() {
    boardBg.innerHTML = '';
    const total = SIZE * SIZE;
    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell-bg';
      boardBg.append(cell);
    }
  }

  function layoutBoard() {
    const width = boardWrapper.clientWidth;
    const pad = SIZE === 4 ? 12 : 10;
    const gap = SIZE === 4 ? 12 : 10;

    boardBg.style.padding = pad + 'px';
    boardBg.style.gap = gap + 'px';
    boardBg.style.gridTemplateColumns = 'repeat(' + SIZE + ', minmax(0, 1fr))';
    boardBg.style.gridTemplateRows = 'repeat(' + SIZE + ', minmax(0, 1fr))';
    tileLayer.style.padding = pad + 'px';

    return { width: width, pad: pad, gap: gap };
  }

  function render() {
    if (boardBg.children.length !== SIZE * SIZE) initBoardBg();
    const layout = layoutBoard();
    const boardPx = layout.width;
    const pad = layout.pad;
    const gap = layout.gap;
    const cellSize = (boardPx - pad * 2 - gap * (SIZE - 1)) / SIZE;

    tileLayer.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (!val) continue;

        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.setAttribute('data-value', val);
        tile.textContent = val;

        tile.style.left = (pad + c * (cellSize + gap)) + 'px';
        tile.style.top = (pad + r * (cellSize + gap)) + 'px';
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';

        let ratio = 0.46;
        if (val >= 1000) ratio = SIZE === 5 ? 0.25 : 0.29;
        else if (val >= 100) ratio = SIZE === 5 ? 0.31 : 0.34;
        else if (SIZE === 5) ratio = 0.4;
        tile.style.fontSize = (cellSize * ratio) + 'px';

        tileLayer.append(tile);
      }
    }
  }

  function updateTimer() {
    timerEl.textContent = formatTime(elapsed);
  }

  function updateStatus() {
    if (gameOver) {
      statusEl.textContent = '本局结束';
    } else if (running) {
      statusEl.textContent = mode === 'ai' ? 'AI 运行中…' : '自动运行中…';
    } else if (mode === 'manual') {
      statusEl.textContent = '手动模式 · 自动保存';
    } else {
      statusEl.textContent = '已暂停 · 点开始继续';
    }
  }

  function updateAll() {
    if (score > best) best = score;
    scoreEl.textContent = score;
    bestEl.textContent = best;
    maxEl.textContent = getMaxTile();
    movesEl.textContent = moves;
    updateTimer();
    updateStatus();
  }

  function updateRunUI() {
    if (mode === 'manual') {
      runBtn.hidden = true;
      speedWrap.hidden = true;
      hintEl.textContent = '滑动或方向键移动；退出后重新打开会继续上局';
    } else {
      runBtn.hidden = false;
      speedWrap.hidden = false;
      runBtn.textContent = running
        ? '⏸ 暂停'
        : (mode === 'ai' ? '▶ 开始 AI' : '▶ 开始自动');
      hintEl.textContent = mode === 'ai'
        ? 'AI 使用 expectimax 搜索；可以随时暂停，进度会自动保存'
        : '自动模式一直往右下走，卡住时用左/上救场';
    }
  }

  function setActiveSegments() {
    modeSeg.querySelectorAll('button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    sizeSeg.querySelectorAll('button').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.size) === SIZE);
    });
  }

  /* ---------- 游戏流程 ---------- */
  function newGame(force) {
    if (!force && moves > 0 && !gameOver) {
      if (!confirm('当前对局还没结束，开始新游戏会丢掉本局进度。继续？')) return;
    }

    stopRun();
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    moves = 0;
    won = false;
    keepPlaying = false;
    gameOver = false;
    recorded = false;
    elapsed = 0;
    best = currentBest();

    addRandomTile();
    addRandomTile();

    hideOverlay();
    render();
    updateAll();
    saveState();
    startClock();
    updateRunUI();
  }

  function restoreState(data) {
    stopRun();

    grid = data.grid.map((row) => row.slice());
    score = Number(data.score) || 0;
    moves = Number(data.moves) || 0;
    won = !!data.won;
    keepPlaying = !!data.keepPlaying;
    gameOver = !!data.gameOver;
    recorded = !!data.recorded;
    elapsed = Number(data.elapsed) || 0;
    best = Math.max(currentBest(), score);

    hideOverlay();
    render();
    updateAll();
    startClock();
    updateRunUI();

    if (gameOver) {
      if (!recorded) recordResult();
      showOverlay('游戏结束', '本局得分 ' + score + ' · 最大 ' + getMaxTile(), false);
    } else if (won && !keepPlaying) {
      showOverlay('你赢了！🎉', '本局得分 ' + score + ' · 最大 ' + getMaxTile(), true);
    } else if (!canMove()) {
      gameOver = true;
      recordResult();
      showOverlay('游戏结束', '本局得分 ' + score + ' · 最大 ' + getMaxTile(), false);
    }

    showToast('已恢复上次对局');
  }

  function move(direction) {
    if (gameOver) return false;
    if (won && !keepPlaying) return false;

    let moved = false;
    let gained = 0;
    const old = grid.map((row) => row.slice());

    if (direction === 'left') {
      for (let r = 0; r < SIZE; r++) {
        const result = slideRow(grid[r]);
        grid[r] = result.row;
        gained += result.gained;
      }
    } else if (direction === 'right') {
      for (let r = 0; r < SIZE; r++) {
        const result = slideRow(grid[r].slice().reverse());
        grid[r] = result.row.reverse();
        gained += result.gained;
      }
    } else if (direction === 'up') {
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
        const result = slideRow(col);
        for (let r = 0; r < SIZE; r++) grid[r][c] = result.row[r];
        gained += result.gained;
      }
    } else if (direction === 'down') {
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
        const result = slideRow(col.slice().reverse());
        const newRow = result.row.reverse();
        for (let r = 0; r < SIZE; r++) grid[r][c] = newRow[r];
        gained += result.gained;
      }
    }

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] !== old[r][c]) moved = true;
      }
    }

    if (!moved) return false;

    score += gained;
    moves++;
    addRandomTile();

    if (!won && getMaxTile() >= 2048) {
      won = true;
      if (mode === 'manual' && !keepPlaying) {
        stopRun();
        render();
        updateAll();
        saveState();
        showOverlay('你赢了！🎉', '本局得分 ' + score + ' · 最大 ' + getMaxTile(), true);
        return true;
      }
      keepPlaying = true;
    }

    if (score > best) best = score;
    render();
    updateAll();
    saveState();

    if (!canMove()) endGame();
    return true;
  }

  function endGame() {
    if (gameOver) return;
    gameOver = true;
    stopRun();
    recordResult();
    updateAll();
    showOverlay('游戏结束', '本局得分 ' + score + ' · 最大 ' + getMaxTile(), false);
    showToast('已记录到排行榜');
    saveState();
  }

  /* ---------- 覆盖层 ---------- */
  function showOverlay(title, sub, showKeep) {
    overlayMsg.textContent = title;
    overlayScore.textContent = sub || '';
    keepBtn.hidden = !showKeep;
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
    keepBtn.hidden = true;
  }

  /* ---------- 计时 / 暂停 ---------- */
  function startClock() {
    clearInterval(clockTimer);
    clockTimer = setInterval(() => {
      if (document.hidden || gameOver) return;
      elapsed += 1000;
      updateTimer();
      if (elapsed % 5000 === 0) saveState();
    }, 1000);
  }

  function stopRun() {
    running = false;
    clearTimeout(stepTimer);
    stepTimer = null;
    updateRunUI();
  }

  function startStop() {
    if (mode === 'manual') return;

    if (gameOver) {
      newGame(true);
    }

    running = !running;

    if (running) {
      if (won && !keepPlaying) keepPlaying = true;
      hideOverlay();
      updateRunUI();
      updateStatus();
      if (mode === 'ai') aiStep();
      else autoStep();
    } else {
      clearTimeout(stepTimer);
      stepTimer = null;
      updateRunUI();
      updateStatus();
    }
  }

  function getDelay() {
    return Math.max(0, Math.round(600 - speed * 5.6));
  }

  /* ---------- 自动模式 ---------- */
  function autoStep() {
    if (!running || gameOver) return;

    const dirs = ['down', 'right', 'left', 'up'];
    let dir = null;
    for (const d of dirs) {
      if (simulateMove(grid, score, d)) {
        dir = d;
        break;
      }
    }

    if (!dir) {
      endGame();
      return;
    }

    move(dir);
    if (!running || gameOver) return;
    updateStatus();
    stepTimer = setTimeout(autoStep, getDelay());
  }

  /* ---------- AI 模式 ---------- */
  function cloneGrid(g) {
    return g.map((row) => row.slice());
  }

  function simulateMove(g, sc, direction) {
    const newGrid = cloneGrid(g);
    let newScore = sc;

    if (direction === 'left') {
      for (let r = 0; r < SIZE; r++) {
        const result = slideRow(newGrid[r]);
        newGrid[r] = result.row;
        newScore += result.gained;
      }
    } else if (direction === 'right') {
      for (let r = 0; r < SIZE; r++) {
        const result = slideRow(newGrid[r].slice().reverse());
        newGrid[r] = result.row.reverse();
        newScore += result.gained;
      }
    } else if (direction === 'up') {
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(newGrid[r][c]);
        const result = slideRow(col);
        for (let r = 0; r < SIZE; r++) newGrid[r][c] = result.row[r];
        newScore += result.gained;
      }
    } else if (direction === 'down') {
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(newGrid[r][c]);
        const result = slideRow(col.slice().reverse());
        const newRow = result.row.reverse();
        for (let r = 0; r < SIZE; r++) newGrid[r][c] = newRow[r];
        newScore += result.gained;
      }
    }

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (newGrid[r][c] !== g[r][c]) {
          return { grid: newGrid, score: newScore };
        }
      }
    }
    return null;
  }

  function emptyScore(g) {
    let count = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] === 0) count++;
      }
    }
    return count;
  }

  function snakeScore(g) {
    const weights = AI_PROFILES[SIZE].weights;
    let total = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c]) total += g[r][c] * weights[r][c];
      }
    }
    return total;
  }

  function monotonicity(g) {
    if (SIZE === 4) {
      let violations = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE - 1; c++) {
          if (g[r][c] < g[r][c + 1]) violations += (g[r][c + 1] - g[r][c]) * 2;
        }
      }
      for (let c = 0; c < SIZE; c++) {
        for (let r = SIZE - 1; r > 0; r--) {
          if (g[r][c] < g[r - 1][c]) violations += (g[r - 1][c] - g[r][c]) * 2;
        }
      }
      return -violations;
    }

    let total = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE - 1; c++) {
        if (g[r][c] >= g[r][c + 1]) total += g[r][c + 1];
        else total -= (g[r][c + 1] - g[r][c]) * 2;
      }
    }
    for (let c = 0; c < SIZE; c++) {
      for (let r = 0; r < SIZE - 1; r++) {
        if (g[r][c] >= g[r + 1][c]) total += g[r + 1][c];
        else total -= (g[r + 1][c] - g[r][c]) * 2;
      }
    }
    return total;
  }

  function cornerScore(g) {
    let maxVal = 0;
    let maxR = 0;
    let maxC = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] > maxVal) {
          maxVal = g[r][c];
          maxR = r;
          maxC = c;
        }
      }
    }

    const targetR = SIZE - 1;
    const targetC = SIZE === 4 ? 0 : SIZE - 1;

    if (maxR === targetR && maxC === targetC) {
      return maxVal * (SIZE === 4 ? 5 : 10);
    }
    if ((maxR === 0 || maxR === SIZE - 1) && (maxC === 0 || maxC === SIZE - 1)) {
      return maxVal * (SIZE === 4 ? 2 : 4);
    }
    if (maxR === 0 || maxR === SIZE - 1 || maxC === 0 || maxC === SIZE - 1) {
      return SIZE === 4 ? 0 : maxVal;
    }
    return -maxVal * (SIZE === 4 ? 1 : 2);
  }

  function mergeScore(g) {
    let total = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] === 0) continue;
        if (c < SIZE - 1 && g[r][c] === g[r][c + 1]) total += g[r][c];
        if (r < SIZE - 1 && g[r][c] === g[r + 1][c]) total += g[r][c];
      }
    }
    return total;
  }

  function continuityScore(g) {
    const threshold = 32;
    const bigTiles = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] >= threshold) bigTiles.push({ r: r, c: c, val: g[r][c] });
      }
    }
    bigTiles.sort((a, b) => b.val - a.val);
    if (bigTiles.length < 2) return 0;

    let total = 0;
    for (let i = 0; i < bigTiles.length - 1; i++) {
      const curr = bigTiles[i];
      const next = bigTiles[i + 1];
      const dist = Math.abs(curr.r - next.r) + Math.abs(curr.c - next.c);
      if (dist === 1) total += next.val * 5;
      else if (dist === 2) total += next.val;
      else total -= next.val * 3;
    }

    if (SIZE === 4) {
      const maxTile = bigTiles[0];
      const isCorner = (maxTile.r === 0 || maxTile.r === SIZE - 1) &&
                       (maxTile.c === 0 || maxTile.c === SIZE - 1);
      if (isCorner) total += maxTile.val * 10;
    }

    return total;
  }

  function evaluate(g, sc) {
    const profile = AI_PROFILES[SIZE];
    const empty = emptyScore(g);

    let emptyWeight = 0;
    for (const tier of profile.emptyTiers) {
      if (empty <= tier[0]) {
        emptyWeight = tier[1];
        break;
      }
    }

    return sc * profile.coeff.score
      + snakeScore(g) * profile.coeff.snake
      + monotonicity(g) * profile.coeff.mono
      + cornerScore(g) * profile.coeff.corner
      + continuityScore(g) * profile.coeff.continuity
      + empty * emptyWeight
      + mergeScore(g) * profile.coeff.merge;
  }

  function playerNode(g, sc, depth) {
    if (depth <= 0 || performance.now() > aiDeadline) return evaluate(g, sc);

    let bestValue = -Infinity;
    const dirs = ['left', 'right', 'up', 'down'];
    for (const dir of dirs) {
      const result = simulateMove(g, sc, dir);
      if (!result) continue;
      const value = chanceNode(result.grid, result.score, depth);
      if (value > bestValue) bestValue = value;
    }

    return bestValue === -Infinity ? evaluate(g, sc) : bestValue;
  }

  function chanceNode(g, sc, depth) {
    if (performance.now() > aiDeadline) return evaluate(g, sc);

    const empties = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] === 0) empties.push({ r: r, c: c });
      }
    }

    if (empties.length === 0) {
      return canMoveOnGrid(g) ? playerNode(g, sc, depth - 1) : -1e9;
    }

    let samples = empties;
    if (empties.length > 6) {
      let maxVal = 0;
      let maxR = 0;
      let maxC = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (g[r][c] > maxVal) {
            maxVal = g[r][c];
            maxR = r;
            maxC = c;
          }
        }
      }
      empties.sort((a, b) => {
        const da = Math.abs(a.r - maxR) + Math.abs(a.c - maxC);
        const db = Math.abs(b.r - maxR) + Math.abs(b.c - maxC);
        return da - db;
      });
      samples = empties.slice(0, 6);
    }

    let total = 0;
    for (const cell of samples) {
      if (performance.now() > aiDeadline) return evaluate(g, sc);

      g[cell.r][cell.c] = 2;
      total += playerNode(g, sc, depth - 1) * 0.9;

      g[cell.r][cell.c] = 4;
      total += playerNode(g, sc, depth - 1) * 0.1;

      g[cell.r][cell.c] = 0;
    }
    return total / samples.length;
  }

  function aiChooseDirection() {
    aiDeadline = performance.now() + 650;
    const profile = AI_PROFILES[SIZE];
    let bestDir = null;
    let bestValue = -Infinity;
    const dirs = ['left', 'right', 'up', 'down'];

    for (const dir of dirs) {
      const result = simulateMove(grid, score, dir);
      if (!result) continue;

      const value = chanceNode(result.grid, result.score, profile.depth - 1);
      if (value > bestValue) {
        bestValue = value;
        bestDir = dir;
      }
      if (performance.now() > aiDeadline) break;
    }

    return bestDir;
  }

  function aiStep() {
    if (!running || gameOver) return;

    statusEl.textContent = 'AI 思考中…';
    stepTimer = setTimeout(() => {
      if (!running || gameOver) return;

      const dir = aiChooseDirection();
      if (!dir) {
        endGame();
        return;
      }

      move(dir);
      if (!running || gameOver) return;
      statusEl.textContent = 'AI 运行中…';
      stepTimer = setTimeout(aiStep, getDelay());
    }, 20);
  }

  /* ---------- 输入 ---------- */
  document.addEventListener('keydown', (e) => {
    if (mode !== 'manual') return;
    if (!lbModal.hidden) return;

    const map = {
      ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
      a: 'left', d: 'right', w: 'up', s: 'down',
    };
    const dir = map[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  boardWrapper.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  boardWrapper.addEventListener('touchend', (e) => {
    if (mode !== 'manual' || touchStartX == null) return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    touchStartY = null;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  /* ---------- 事件绑定 ---------- */
  modeSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn || btn.dataset.mode === mode) return;

    stopRun();
    saveState();
    mode = btn.dataset.mode;
    setActiveSegments();
    updateRunUI();

    const saved = loadState(mode, SIZE);
    if (saved) restoreState(saved);
    else newGame(true);

    saveLast();
  });

  sizeSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-size]');
    if (!btn) return;

    const nextSize = Number(btn.dataset.size);
    if (nextSize === SIZE) return;

    stopRun();
    saveState();
    SIZE = nextSize;
    setActiveSegments();
    updateRunUI();

    const saved = loadState(mode, SIZE);
    if (saved) restoreState(saved);
    else newGame(true);

    saveLast();
  });

  newBtn.addEventListener('click', () => newGame(false));
  runBtn.addEventListener('click', startStop);

  speedEl.addEventListener('input', () => {
    speed = Number(speedEl.value) || 60;
    speedLabel.textContent = speed;
  });

  keepBtn.addEventListener('click', () => {
    keepPlaying = true;
    hideOverlay();
    saveState();
  });

  $('againBtn').addEventListener('click', () => newGame(true));
  $('overlayLbBtn').addEventListener('click', openLB);

  $('lbBtn').addEventListener('click', openLB);
  $('lbClose').addEventListener('click', closeLB);
  lbModal.addEventListener('click', (e) => {
    if (e.target === lbModal) closeLB();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !lbModal.hidden) closeLB();
  });

  $('lbClear').addEventListener('click', () => {
    if (!confirm('清空「' + (LB_TABS.find((t) => t.key === lbSelectedKey) || {}).label + '」的全部记录？')) return;
    const data = getLB();
    delete data[lbSelectedKey];
    writeJSON(LB_KEY, data);
    renderLB();
    showToast('已清空本榜');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      saveState();
      if (running) {
        stopRun();
        statusEl.textContent = '已暂停（切后台）';
      }
    }
  });

  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);
  window.addEventListener('resize', render);

  /* ---------- 提示 ---------- */
  let toastTimer = null;
  function showToast(message) {
    toastEl.textContent = message;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.hidden = true;
    }, 1600);
  }

  /* ---------- 初始化 ---------- */
  function init() {
    const last = readJSON(LAST_KEY, null);
    if (last && (last.mode === 'manual' || last.mode === 'ai' || last.mode === 'auto') &&
        (last.size === 4 || last.size === 5)) {
      mode = last.mode;
      SIZE = last.size;
    }

    setActiveSegments();
    updateRunUI();
    speedEl.value = speed;
    speedLabel.textContent = speed;
    buildLBTabs();

    const saved = loadState(mode, SIZE);
    if (saved && (saved.moves > 0 || saved.gameOver || saved.score > 0)) {
      restoreState(saved);
    } else {
      newGame(true);
    }
  }

  init();
</script>
</body>
</html>
